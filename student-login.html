<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Login | GAAWOW ACADEMY</title>

  <link rel="stylesheet" href="student-login.css">

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script
    src="student-login.js"
    defer
  ></script>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand">

        <div class="brand-logo-wrap">
          <img
            id="academyLogo"
            src="logo.png"
            alt="GAAWOW Academy"
            onerror="this.style.display='none'"
          >
        </div>

        <div class="brand-text">
          <h1>GAAWOW ACADEMY</h1>
          <p>Ilayska Aqoonta iyo Xirfadda</p>
        </div>

      </div>


      <div class="login-header">

        <div class="login-icon">
          🎓
        </div>

        <h2>Student Login</h2>

        <p>
          Sign in to access your student portal
        </p>

      </div>


      <form id="studentLoginForm">

        <div class="form-group">

          <label for="email">
            Student Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <div
          id="loginMessage"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          <span id="loginButtonText">
            Sign In
          </span>

          <span
            id="loginSpinner"
            class="spinner"
            hidden
          ></span>
        </button>

      </form>


      <div class="login-footer">

        <p>
          GAAWOW ACADEMY
        </p>

        <span>
          Burhakaba, Bay, Somalia
        </span>

        <span>
          © <span id="currentYear"></span>
        </span>

      </div>

    </section>

  </main>

</body>
</html>
