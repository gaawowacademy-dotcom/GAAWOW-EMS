}


body{

}


/* =========================================================
   TOP BAR
   ========================================================= */

.top{

  background:

      135deg,

    );

  padding:18px 20px;

  box-shadow:

}


.top-inner{

  max-width:900px;

  display:flex;

  align-items:center;

  gap:12px;

}


.top-mark{

  background:#fff;

  padding:4px;

}


.brand{

  font-weight:800;

  letter-spacing:.3px;

}


.motto{

}


/* =========================================================
   PAGE
   ========================================================= */

.wrap{

  max-width:820px;

  margin:30px auto;

  padding:
    0
    16px
    40px;

}


.card{

  background:#fff;

}


/* =========================================================
   HEADER
   ========================================================= */

.head{

    30px
    22px
    24px;

}


.logo{

  height:82px;

  object-fit:contain;

  margin-bottom:10px;

}


.title{

  color:var(--navy);

  letter-spacing:.2px;

}


.sub{

  font-size:14px;

}


.gold-line{

  width:72px;

  height:3px;

  background:var(--gold);

  border-radius:99px;

  margin:
    14px
    auto

}


/* =========================================================
   STATUS
   ========================================================= */

.status{

  margin:
    22px
    22px
    16px;

  padding:
    15px
    16px;

  border-radius:12px;

  font-weight:800;

  text-align:center;

  border:
    1px solid
    transparent;

}


.loading{

  background:#EFF6FF;

  color:var(--blue);

  border-color:#BFDBFE;

}


.valid{

  background:#ECFDF5;

  color:#166534;

  border-color:#BBF7D0;

}


.invalid{

  background:#FEF2F2;

  color:#991B1B;

  border-color:#FECACA;

}


/* =========================================================
   INFORMATION GRID
   ========================================================= */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:13px;

  padding:
    4px
    22px
    24px;

}


.item{

  border:
    1px solid
    var(--line);

  border-radius:11px;

  padding:14px;

  background:#fff;

}


.label{

  font-size:10px;

  font-weight:800;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.65px;

}


.value{

  margin-top:6px;

  font-weight:750;

  line-height:1.4;

  word-break:break-word;

}


.code{

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  color:var(--navy);

  font-size:14px;

}


.status-value{

  color:#166534;

  text-transform:uppercase;

}


.wide{

  grid-column:
    1 / -1;

}


/* =========================================================
   PHOTO
   ========================================================= */

.photo-wrap{

  display:flex;

  align-items:center;

  gap:16px;

  margin-top:8px;

}


.photo{

  height:112px;

/* =========================================================

.results-section{

    24px;

}

.results-subtitle{

}


.results-table-wrap{

}


.results-table{

}


.results-table th{

  text-align:left;

  padding:
    10px
    9px;

  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.4px;

}


.results-table td{

  padding:
    9px;

  border-bottom:
    1px solid
    var(--line);

}


.results-table tbody tr:last-child td{

}


.score-cell{

  font-weight:800;

  color:var(--navy);

}


.grade-cell{

  color:#166534;

}


.results-summary{

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:10px;

  padding:12px;

  border-top:
    1px solid
    var(--line);

  background:#F8FAFC;

}


.summary-box{

  border:
    1px solid
    var(--line);

  border-radius:9px;

  background:#fff;

  padding:10px;

  text-align:center;

}


.summary-label{

  font-size:9px;

  font-weight:800;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.4px;

}


.summary-value{

  margin-top:5px;

  font-size:15px;

  font-weight:900;

  color:var(--navy);

}


.no-results{

  padding:18px;

  text-align:center;

  color:var(--muted);

  font-size:12px;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{

  display:flex;

  justify-content:center;

  gap:10px;

  margin:
    0
    22px
    24px;

}


.btn{

  border:
    1px solid
    var(--line);

  background:#fff;

  color:var(--navy);

  padding:
    10px
    16px;

  border-radius:9px;

  font-weight:800;

  cursor:pointer;

}


.btn:hover{

}


/* =========================================================
   FOOTER

.footer{

    1px solid

    17px
    20px;

/* =========================================================

  }


  .wide{

  }


  .item{

  }


  .results-section{

    margin:
      0

      18px;

  }


  .results-table{

    min-width:500px;

  }


  .results-summary{

    grid-template-columns:

  }


  .actions{

    margin:

}


/* =========================================================

@media print{

  }

  }

  .results-section{

  }

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>

/* =========================================================
   GAAWOW ACADEMY
   AUTHENTICATION VERIFICATION
   VERSION 20261002-2
   ========================================================= */

(async()=>{


  /* =======================================================
     CONFIG
     ======================================================= */

  const SUPABASE_URL =
    "https://mytyvqwrxnxpxnxpiicj.supabase.co";


  const SUPABASE_KEY =
    window.GAAWOW_SUPABASE_KEY ||
    "sb_publishable_2AvWfupkF1b_s0RjIbAi5g_RqLCs145";


  const db =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =======================================================
     URL PARAMETERS
     ======================================================= */

  const qs =
    new URLSearchParams(
      location.search
    );


  const code =
    (
      qs.get("code") ||
      ""
    ).trim();


  const id =
    (
      qs.get("id") ||
      ""
    ).trim();


  /* =======================================================
     ELEMENTS
     ======================================================= */

  const status =
    document.getElementById(
      "status"
    );


  const result =
    document.getElementById(
      "result"
    );


  const actions =
    document.getElementById(
      "actions"
    );


  const academicResults =
    document.getElementById(
      "academicResults"
    );


  const resultsTableContainer =
    document.getElementById(
      "resultsTableContainer"
    );


  const resultsSummary =
    document.getElementById(
      "resultsSummary"
    );


  /* =======================================================
     HELPERS
     ======================================================= */

  const esc =
    value =>

      String(
        value ?? ""
      )

      .replace(
        /[&<>\"']/g,
        m => ({

          "&":"&amp;",

          "<":"&lt;",

          ">":"&gt;",

          "\"":"&quot;",

          "'":"&#039;"

        }[m])

      );


  const fmt =
    value => {

      if (!value) {

        return "Not available";

      }


      const date =
        new Date(
          value +
          (
            String(value).includes("T")
              ? ""
              : "T00:00:00"
          )
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return esc(value);

      }


      return date.toLocaleDateString(
        "en-GB",
        {

          day:"2-digit",

          month:"long",

          year:"numeric"

        }
      );

    };


  const numberValue =
    value => {

      if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ) {

        return null;

      }


      const n =
        Number(value);


      return Number.isFinite(n)
        ? n
        : null;

    };


  const calculateGrade =
    percentage => {

      if (
        percentage === null ||
        percentage === undefined ||
        !Number.isFinite(
          Number(percentage)
        )
      ) {

        return "N/A";

      }


      const value =
        Number(percentage);


      if (value >= 80) {
        return "A";
      }


      if (value >= 70) {
        return "B";
      }


      if (value >= 60) {
        return "C";
      }


      if (value >= 50) {
        return "D";
      }


      return "F";

    };


  /* =======================================================
     INVALID CODE
     ======================================================= */

  if (!code){

    status.className =
      "status invalid";

    status.textContent =
      "INVALID VERIFICATION CODE";

    return;

  }


  /* =======================================================
     MAIN VERIFICATION
     ======================================================= */

  try{


    console.log(
      "[GAAWOW VERIFY AUTH] VERSION 20261002-2"
    );


    console.log(
      "[GAAWOW VERIFY AUTH] CODE:",
      code
    );


    console.log(
      "[GAAWOW VERIFY AUTH] ID:",
      id
    );


    /* =====================================================
       RPC
       ===================================================== */

    const rpc =
      await db.rpc(
        "verify_authentication_letter",
        {

          p_code:
            code,

          p_id:
            id ||
            null

        }
      );


    if (
      rpc.error ||
      !rpc.data ||
      !rpc.data.length
    ){

      console.error(
        "[GAAWOW VERIFY AUTH] RPC:",
        rpc.error
      );


      status.className =
        "status invalid";


      status.textContent =
        "AUTHENTICATION LETTER NOT FOUND / INVALID";


      return;

    }


    const a =
      rpc.data[0];


    /* =====================================================
       STATUS
       ===================================================== */

    status.className =
      "status valid";


    status.textContent =
      "✓ AUTHENTICATION LETTER VERIFIED";


    /* =====================================================
       DISPLAY BASIC VERIFICATION DATA
       ===================================================== */

    result.innerHTML = `

      <div class="item">

        <div class="label">
          Reference No
        </div>

        <div class="value code">
          ${esc(a.reference_no)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Authentication ID
        </div>

        <div class="value code">
          ${esc(a.authentication_id)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Verification Code
        </div>

        <div class="value code">
          ${esc(a.verification_code)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Student Name
        </div>

        <div class="value">
          ${esc(a.student_name)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Course / Program
        </div>

        <div class="value">
          ${esc(a.course_name)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Date Started
        </div>

        <div
          id="verifiedDateStarted"
          class="value"
        >
          Not available
        </div>

      </div>


      <div class="item">

        <div class="label">
          Date Completed
        </div>

        <div class="value">
          ${fmt(a.date_completed)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Date Issued
        </div>

        <div class="value">
          ${fmt(a.issue_date)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Document Status
        </div>

        <div class="value status-value">
          ${esc(
            String(
              a.status ||
              "VALID"
            ).toUpperCase()
          )}
        </div>

      </div>


      <div class="item wide">

        <div class="label">
          Institution
        </div>

        <div class="value">
          ${esc(
            a.institution_name ||
            "GAAWOW ACADEMY"
          )}
        </div>

      </div>


      ${
        a.student_photo_url
        ?
        `

        <div class="item wide">

          <div class="label">
            Student Photo
          </div>

          <div class="photo-wrap">

            <img
              class="photo"
              src="${esc(
                a.student_photo_url
              )}"
              alt="Student photo"
            >

          </div>

        </div>

        `
        :
        ""
      }

    `;


    /* =====================================================
       LOAD CERTIFICATE RECORD
       ===================================================== */

    let certificateQuery =
      db
        .from("certificates")
        .select(`
          id,
          student_id,
          certificate_id,
          verify_code,
          certificate_type
        `)
        .eq(
          "verify_code",
          code
        )
        .eq(
          "certificate_type",
          "authentication_letter"
        )
        .limit(1)
        .maybeSingle();


    if (id) {

      certificateQuery =
        db
          .from("certificates")
          .select(`
            id,
            student_id,
            certificate_id,
            verify_code,
            certificate_type
          `)
          .eq(
            "verify_code",
            code
          )
          .eq(
            "certificate_id",
            id
          )
          .eq(
            "certificate_type",
            "authentication_letter"
          )
          .limit(1)
          .maybeSingle();

    }


    const certificateResult =
      await certificateQuery;


    if (
      certificateResult.error
    ) {

      console.warn(
        "[GAAWOW VERIFY AUTH] Certificate lookup:",
        certificateResult.error
      );

    }


    const certificate =
      certificateResult.data ||
      null;


    /* =====================================================
       LOAD STUDENT
       ===================================================== */

    if (
      certificate &&
      certificate.student_id
    ){

      const studentResult =
        await db
          .from("students")
          .select(`
            id,
            full_name,
            student_id,
            admission_date,
            photo_url
          `)
          .eq(
            "id",
            certificate.student_id
          )
          .limit(1)
          .maybeSingle();


      if (
        !studentResult.error &&
        studentResult.data
      ){

        const student =
          studentResult.data;


        const dateStarted =
          document.getElementById(
            "verifiedDateStarted"
          );


        if (dateStarted){

          dateStarted.textContent =
            fmt(
              student.admission_date
            );

        }


        /*
         * Use official student photo
         * if RPC did not already provide one.
         */

        if (
          !a.student_photo_url &&
          student.photo_url
        ){

          result.insertAdjacentHTML(
            "beforeend",
            `

            <div class="item wide">

              <div class="label">
                Student Photo
              </div>

              <div class="photo-wrap">

                <img
                  class="photo"
                  src="${esc(
                    student.photo_url
                  )}"
                  alt="Student photo"
                >

              </div>

            </div>

            `
          );

        }

      }

    }


    /* =====================================================
       LOAD ACADEMIC RESULTS
       ===================================================== */

    if (
      certificate &&
      certificate.student_id
    ){

      try{

        const resultsQuery =
          await db
            .from("results")
            .select(`
              id,
              student_id,
              subject_id,
              score,
              max_score,
              percentage,
              grade,
              is_published
            `)
            .eq(
              "student_id",
              certificate.student_id
            )
            .eq(
              "is_published",
              true
            );


        if (
          resultsQuery.error
        ){

          console.warn(
            "[GAAWOW VERIFY AUTH] Results:",
            resultsQuery.error
          );

        } else {

          const rows =
            resultsQuery.data ||
            [];


          if (rows.length){

            /* =============================================
               SUBJECT IDs
               ============================================= */

            const subjectIds =
              [
                ...new Set(
                  rows
                    .map(
                      row =>
                        row.subject_id
                    )
                    .filter(Boolean)
                )
              ];


            let subjectMap = {};


            if (
              subjectIds.length
            ){

              const subjectsQuery =
                await db
                  .from("subjects")
                  .select(`
                    id,
                    name,
                    code,
                    max_score
                  `)
                  .in(
                    "id",
                    subjectIds
                  );


              if (
                !subjectsQuery.error
              ){

                (
                  subjectsQuery.data ||
                  []
                ).forEach(
                  subject => {

                    subjectMap[
                      String(
                        subject.id
                      )
                    ] =
                      subject;

                  }
                );

              } else {

                console.warn(
                  "[GAAWOW VERIFY AUTH] Subjects:",
                  subjectsQuery.error
                );

              }

            }


            /* =============================================
               NORMALIZE RESULTS
               ============================================= */

            const normalized =
              rows.map(
                row => {

                  const subject =
                    row.subject_id
                    ?
                    subjectMap[
                      String(
                        row.subject_id
                      )
                    ]
                    :
                    null;


                  const score =
                    numberValue(
                      row.score
                    );


                  const maxScore =
                    numberValue(
                      row.max_score
                    ) ??
                    numberValue(
                      subject?.max_score
                    ) ??
                    100;


                  let percentage =
                    numberValue(
                      row.percentage
                    );


                  if (
                    percentage === null &&
                    score !== null &&
                    maxScore > 0
                  ){

                    percentage =
                      (
                        score /
                        maxScore
                      ) *
                      100;

                  }


                  const grade =
                    row.grade ||
                    calculateGrade(
                      percentage
                    );


                  const subjectName =
                    subject?.name ||
                    subject?.code ||
                    "Subject";


                  return {

                    subject:
                      subjectName,

                    score:
                      score,

                    maxScore:
                      maxScore,

                    percentage:
                      percentage,

                    grade:
                      grade

                  };

                }
              );


            /* =============================================
               TOTALS
               ============================================= */

            let total = 0;

            let maxTotal = 0;

            let percentageSum = 0;

            let percentageCount = 0;


            normalized.forEach(
              row => {

                if (
                  row.score !== null
                ){

                  total +=
                    row.score;

                  maxTotal +=
                    row.maxScore;

                }


                if (
                  row.percentage !== null
                ){

                  percentageSum +=
                    row.percentage;

                  percentageCount++;

                }

              }
            );


            const overallPercentage =
              maxTotal > 0
                ?
                (
                  total /
                  maxTotal
                ) *
                100
                :
                (
                  percentageCount > 0
                    ?
                    percentageSum /
                    percentageCount
                    :
                    null
                );


            const overallGrade =
              calculateGrade(
                overallPercentage
              );


            /* =============================================
               BUILD TABLE
               ============================================= */

            let tableHTML = `

              <table class="results-table">

                <thead>

                  <tr>

                    <th>
                      Subject
                    </th>

                    <th>
                      Score
                    </th>

                    <th>
                      Grade
                    </th>

                  </tr>

                </thead>

                <tbody>

            `;


            normalized.forEach(
              row => {

                tableHTML += `

                  <tr>

                    <td>
                      ${esc(
                        row.subject
                      )}
                    </td>

                    <td class="score-cell">

                      ${
                        row.score === null
                          ?
                          "N/A"
                          :
                          esc(
                            row.score
                          )
                      }

                    </td>

                    <td class="grade-cell">

                      ${esc(
                        row.grade
                      )}

                    </td>

                  </tr>

                `;

              }
            );


            tableHTML += `

                </tbody>

              </table>

            `;


            resultsTableContainer.innerHTML =
              tableHTML;


            /* =============================================
               SUMMARY
               ============================================= */

            resultsSummary.innerHTML = `

              <div class="summary-box">

                <div class="summary-label">
                  Total
                </div>

                <div class="summary-value">
                  ${esc(total)}
                  /
                  ${esc(maxTotal)}
                </div>

              </div>


              <div class="summary-box">

                <div class="summary-label">
                  Percentage
                </div>

                <div class="summary-value">

                  ${
                    overallPercentage !== null
                      ?
                      overallPercentage.toFixed(1) +
                      "%"
                      :
                      "N/A"
                  }

                </div>

              </div>


              <div class="summary-box">

                <div class="summary-label">
                  Overall Grade
                </div>

                <div class="summary-value">
                  ${esc(
                    overallGrade
                  )}
                </div>

              </div>

            `;


            academicResults.hidden =
              false;


            console.log(
              "[GAAWOW VERIFY AUTH] RESULTS:",
              {

                subjects:
                  normalized.length,

                total:
                  total,

                maxTotal:
                  maxTotal,

                percentage:
                  overallPercentage,

                grade:
                  overallGrade

              }
            );

          } else {

            console.log(
              "[GAAWOW VERIFY AUTH] No published results."
            );

          }

        }

      }catch(resultsError){

        console.warn(
          "[GAAWOW VERIFY AUTH] Results exception:",
          resultsError
        );

      }

    }


    /* =====================================================
       SHOW ACTIONS
       ===================================================== */

    actions.hidden =
      false;


    console.log(
      "[GAAWOW VERIFY AUTH] VERIFIED SUCCESSFULLY"
    );


  }catch(error){

    console.error(
      "[GAAWOW VERIFY AUTH] ERROR:",
      error
    );


    status.className =
      "status invalid";


    status.textContent =
      "VERIFICATION SERVICE ERROR";

  }

})();

</script>


</body>

</html>
