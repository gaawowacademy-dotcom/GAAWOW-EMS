<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAAWOW Academy - Authentication Letter Verification</title>
<style>
body{margin:0;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#111827}.top{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;padding:18px 20px}.wrap{max-width:760px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden}.head{padding:22px;text-align:center;border-bottom:1px solid #e5e7eb}.logo{width:72px;height:72px;object-fit:contain}.title{font-size:25px;font-weight:800;color:#0B1E63}.sub{color:#6b7280;margin-top:5px}.status{margin:18px;padding:14px;border-radius:10px;font-weight:800;text-align:center}.valid{background:#dcfce7;color:#166534}.invalid{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px 22px}.item{border:1px solid #e5e7eb;border-radius:9px;padding:12px}.label{font-size:11px;font-weight:800;color:#6b7280;text-transform:uppercase}.value{margin-top:5px;font-weight:700;word-break:break-word}.photo{width:100px;height:120px;object-fit:cover;border:2px solid #D4AF37;border-radius:8px}.wide{grid-column:1/-1}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="top"><strong>GAAWOW ACADEMY</strong><div>Ilayska Aqoonta iyo Xirfadda</div></div>
<div class="wrap"><div class="card">
<div class="head"><img class="logo" src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png" alt="GAAWOW Academy"><div class="title">AUTHENTICATION LETTER</div><div class="sub">Official Document Verification</div></div>
<div id="status" class="status">Checking verification...</div>
<div id="result" class="grid"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const SUPABASE_URL="https://mytyvqwrxnxpxnxpiicj.supabase.co";
 const SUPABASE_KEY=window.GAAWOW_SUPABASE_KEY||"PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
 const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const qs=new URLSearchParams(location.search),code=qs.get('code'),id=qs.get('id');
 const status=document.getElementById('status'),result=document.getElementById('result');
 const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
 const fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}):'—';
 if(!code){status.className='status invalid';status.textContent='INVALID VERIFICATION CODE';return;}
 const {data,error}=await db.rpc('verify_authentication_letter',{p_code:code,p_id:id||null});
 if(error||!data||!data.length){status.className='status invalid';status.textContent='AUTHENTICATION LETTER NOT FOUND / INVALID';return;}
 const a=data[0];status.className='status valid';status.textContent='✓ AUTHENTICATION LETTER VERIFIED';
 result.innerHTML=`
 <div class="item"><div class="label">Reference No</div><div class="value">${esc(a.reference_no)}</div></div>
 <div class="item"><div class="label">Verification Code</div><div class="value">${esc(a.verification_code)}</div></div>
 <div class="item"><div class="label">Student Name</div><div class="value">${esc(a.student_name)}</div></div>
 <div class="item"><div class="label">Course</div><div class="value">${esc(a.course_name)}</div></div>
 <div class="item"><div class="label">Date Started</div><div class="value">${fmt(a.date_started)}</div></div>
 <div class="item"><div class="label">Date Completed</div><div class="value">${fmt(a.date_completed)}</div></div>
 <div class="item"><div class="label">Date Issued</div><div class="value">${fmt(a.issue_date)}</div></div>
 <div class="item"><div class="label">Status</div><div class="value">${esc(String(a.status||'VALID').toUpperCase())}</div></div>
 ${a.institution_name?`<div class="item wide"><div class="label">Institution</div><div class="value">${esc(a.institution_name)}</div></div>`:''}
 ${a.student_photo_url?`<div class="item wide"><div class="label">Student Photo</div><img class="photo" src="${esc(a.student_photo_url)}" alt="Student photo"></div>`:''}`;
})().catch(e=>{const s=document.getElementById('status');s.className='status invalid';s.textContent='Verification error: '+e.message;});
</script>
</body></html>
