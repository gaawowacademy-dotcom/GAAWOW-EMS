
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1E63">
<meta name="description" content="GAAWOW Academy official Authentication Letter verification">
<title>GAAWOW Academy | Authentication Letter Verification</title>

<style>
:root{
  --navy:#0B1E63;
  --blue:#0B4DA2;
  --gold:#D4AF37;
  --bg:#F5F7FA;
  --text:#111827;
  --muted:#64748B;
  --line:#E2E8F0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.top{
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  padding:18px 20px;
  box-shadow:0 3px 14px rgba(11,30,99,.18);
}
.top-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}
.top-mark{
  width:42px;height:42px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  object-fit:contain;
  background:#fff;
  padding:4px;
}
.brand{font-size:16px;font-weight:800;letter-spacing:.3px}
.motto{font-size:12px;opacity:.88;margin-top:3px}
.wrap{max-width:820px;margin:30px auto;padding:0 16px 40px}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 10px 35px rgba(15,23,42,.08);
  overflow:hidden;
}
.head{
  text-align:center;
  padding:30px 22px 24px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#fbfdff);
}
.logo{width:82px;height:82px;object-fit:contain;margin-bottom:10px}
.title{
  font-size:27px;line-height:1.2;font-weight:900;
  color:var(--navy);letter-spacing:.2px;
}
.sub{color:var(--muted);margin-top:7px;font-size:14px}
.gold-line{
  width:72px;height:3px;background:var(--gold);
  border-radius:99px;margin:14px auto 0;
}
.status{
  margin:22px 22px 16px;
  padding:15px 16px;
  border-radius:12px;
  font-weight:800;
  text-align:center;
  border:1px solid transparent;
}
.loading{background:#EFF6FF;color:var(--blue);border-color:#BFDBFE}
.valid{background:#ECFDF5;color:#166534;border-color:#BBF7D0}
.graduated{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.pending{background:#FFFBEB;color:#92400E;border-color:#FDE68A}
.expired{background:#FFF7ED;color:#9A3412;border-color:#FED7AA}
.invalid{background:#FEF2F2;color:#991B1B;border-color:#FECACA}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  padding:4px 22px 24px;
}
.item{
  border:1px solid var(--line);
  border-radius:11px;
  padding:14px;
  background:#fff;
  min-width:0;
}
.label{
  font-size:10px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.65px;
}
.value{margin-top:6px;font-weight:750;line-height:1.4;word-break:break-word}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--navy);font-size:14px;
}
.status-value{text-transform:uppercase}
.wide{grid-column:1/-1}
.photo-wrap{display:flex;align-items:center;gap:16px;margin-top:8px}
.photo{
  width:92px;height:112px;object-fit:cover;
  border:2px solid var(--gold);border-radius:9px;
  background:#f8fafc;
}
.results-section{
  margin:0 22px 24px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}
.results-header{
  background:linear-gradient(135deg,#f8fafc,#fff);
  border-bottom:1px solid var(--line);
  padding:13px 15px;
}
.results-title{
  font-size:13px;font-weight:900;color:var(--navy);
  text-transform:uppercase;letter-spacing:.35px;
}
.results-subtitle{font-size:10px;color:var(--muted);margin-top:3px}
.results-table-wrap{width:100%;overflow-x:auto}
.results-table{width:100%;border-collapse:collapse;font-size:12px}
.results-table th{
  background:var(--navy);color:#fff;text-align:left;
  padding:10px 9px;font-size:10px;
  text-transform:uppercase;letter-spacing:.4px;
}
.results-table td{
  padding:9px;border-bottom:1px solid var(--line);
  vertical-align:middle;
}
.results-table tbody tr:last-child td{border-bottom:none}
.score-cell{font-weight:800;color:var(--navy)}
.grade-cell{font-weight:800;color:#166534}
.results-summary{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;padding:12px;border-top:1px solid var(--line);
  background:#F8FAFC;
}
.summary-box{
  border:1px solid var(--line);border-radius:9px;
  background:#fff;padding:10px;text-align:center;
}
.summary-label{
  font-size:9px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;
}
.summary-value{margin-top:5px;font-size:15px;font-weight:900;color:var(--navy)}
.no-results{padding:18px;text-align:center;color:var(--muted);font-size:12px}
.actions{display:flex;justify-content:center;gap:10px;margin:0 22px 24px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--navy);
  padding:10px 16px;border-radius:9px;font-weight:800;cursor:pointer;
}
.btn:hover{border-color:var(--gold)}
.footer{
  text-align:center;border-top:1px solid var(--line);
  padding:17px 20px;color:var(--muted);
  font-size:12px;line-height:1.6;
}
.footer strong{color:var(--navy)}
[hidden]{display:none!important}

@media(max-width:600px){
  .wrap{margin:18px auto;padding:0 10px 28px}
  .top{padding:14px}
  .top-mark{width:38px;height:38px}
  .head{padding:24px 16px 20px}
  .logo{width:72px;height:72px}
  .title{font-size:22px}
  .status{margin:18px 14px 14px}
  .grid{grid-template-columns:1fr;padding:4px 14px 18px}
  .wide{grid-column:auto}
  .item{padding:13px}
  .results-section{margin:0 14px 18px}
  .results-table{min-width:500px}
  .results-summary{grid-template-columns:1fr}
  .actions{margin:0 14px 18px}
}
@media print{
  body{background:#fff}
  .top{box-shadow:none}
  .wrap{max-width:none;margin:12px auto}
  .card{box-shadow:none;border:1px solid #ccc}
  .actions{display:none}
  .status,.item,.results-section{break-inside:avoid}
}
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">
    <img class="top-mark"
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy">
    <div>
      <div class="brand">GAAWOW ACADEMY</div>
      <div class="motto">Ilayska Aqoonta iyo Xirfadda</div>
    </div>
  </div>
</header>

<main class="wrap">
<section class="card" aria-live="polite">

  <div class="head">
    <img class="logo"
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy logo">
    <div class="title">AUTHENTICATION LETTER</div>
    <div class="sub">Official Academic Document Verification</div>
    <div class="gold-line"></div>
  </div>

  <div id="status" class="status loading">
    Checking verification...
  </div>

  <div id="result" class="grid"></div>

  <section id="academicResults" class="results-section" hidden>
    <div class="results-header">
      <div class="results-title">Academic Results</div>
      <div class="results-subtitle">Published academic performance</div>
    </div>
    <div id="resultsTableContainer" class="results-table-wrap"></div>
    <div id="resultsSummary" class="results-summary"></div>
  </section>

  <div id="actions" class="actions" hidden>
    <button class="btn" type="button" onclick="window.print()">
      Print / Save PDF
    </button>
  </div>

  <footer class="footer">
    <strong>GAAWOW ACADEMY</strong>
    <br>
    Burhakaba, Bay, Somalia · Ilayska Aqoonta iyo Xirfadda
    <br>
    Official verification service
  </footer>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function(){

  "use strict";

  /* SUPABASE CONFIGURATION */
  const SUPABASE_URL =
    "https://mytyvqwrxnxpxnxpiicj.supabase.co";

  const SUPABASE_KEY =
    window.GAAWOW_SUPABASE_KEY ||
    "sb_publishable_2AvWfupkF1b_s0RjIbAi5g_RqLCs145";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  /* URL PARAMETERS */
  const qs = new URLSearchParams(location.search);
  const code = (qs.get("code") || "").trim();
  const id = (qs.get("id") || "").trim();

  /* PAGE ELEMENTS */
  const statusBox = document.getElementById("status");
  const resultBox = document.getElementById("result");
  const actions = document.getElementById("actions");
  const academicResults = document.getElementById("academicResults");
  const resultsTableContainer =
    document.getElementById("resultsTableContainer");
  const resultsSummary =
    document.getElementById("resultsSummary");

  /* HELPERS */
  const esc = value =>
    String(value ?? "").replace(/[&<>"']/g, character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[character]);

  const fmt = value => {
    if (!value) return "Not available";

    const date = new Date(
      String(value).includes("T") ? value : value + "T00:00:00"
    );

    if (Number.isNaN(date.getTime())) return esc(value);

    return date.toLocaleDateString("en-GB", {
      day:"2-digit",
      month:"long",
      year:"numeric"
    });
  };

  const numberValue = value => {
    if (
      value === null ||
      value === undefined ||
      String(value).trim() === ""
    ) return null;

    const number = Number(value);
    return Number.isFinite(number) ? number : null;
  };

  const pick = (object, keys, fallback = null) => {
    if (!object || typeof object !== "object") return fallback;

    for (const key of keys) {
      if (
        object[key] !== undefined &&
        object[key] !== null &&
        object[key] !== ""
      ) return object[key];
    }

    return fallback;
  };

  const safeImageUrl = value => {
    if (!value) return null;

    try {
      const url = new URL(String(value), location.href);
      if (url.protocol !== "https:") return null;
      return url.href;
    } catch {
      return null;
    }
  };

  const displayStatus = value => {
    const normalized = String(value || "")
      .trim()
      .toLowerCase();

    const allowed = [
      "valid",
      "graduated",
      "pending",
      "expired",
      "revoked"
    ];

    return allowed.includes(normalized) ? normalized : "revoked";
  };

  const setStatus = (type, message) => {
    statusBox.className = "status " + type;
    statusBox.textContent = message;
  };

  const renderItem = (label, value, options = {}) => {
    const className = options.wide ? "item wide" : "item";
    const valueClass = options.code ? "value code" : "value";

    return `
      <div class="${className}">
        <div class="label">${esc(label)}</div>
        <div class="${valueClass}">${esc(value || "Not available")}</div>
      </div>
    `;
  };

  /* INVALID OR MISSING CODE */
  if (!code) {
    setStatus("invalid", "INVALID VERIFICATION CODE");
    return;
  }

  try {

    /*
      IMPORTANT:
      This page uses ONLY the verification RPC.
      No direct SELECT from certificates, students,
      results, subjects, or any other table.
    */

    const { data, error } = await db.rpc(
      "verify_authentication_letter",
      {
        p_code: code,
        p_id: id || null
      }
    );

    if (error) {
      console.error("Authentication verification RPC failed:", error);
      setStatus(
        "invalid",
        "VERIFICATION SERVICE ERROR. PLEASE TRY AGAIN LATER."
      );
      return;
    }

    if (!data || !Array.isArray(data) || data.length === 0) {
      setStatus(
        "invalid",
        "AUTHENTICATION LETTER NOT FOUND / INVALID"
      );
      return;
    }

    const a = data[0];

    /* DOCUMENT STATUS */
    const documentStatus = displayStatus(a.status);

    const statusMessages = {
      valid: "✓ AUTHENTICATION LETTER VERIFIED",
      graduated: "✓ AUTHENTICATION LETTER VERIFIED · GRADUATED",
      pending: "⚠ AUTHENTICATION LETTER PENDING",
      expired: "✕ AUTHENTICATION LETTER EXPIRED",
      revoked: "✕ AUTHENTICATION LETTER REVOKED / INVALID"
    };

    setStatus(
      documentStatus === "valid" ? "valid" : documentStatus,
      statusMessages[documentStatus]
    );

    /* STUDENT PHOTO */
    const photoUrl = safeImageUrl(a.student_photo_url);

    /* BASIC INFORMATION */
    let html = "";

    html += renderItem("Reference No", a.reference_no, {code:true});
    html += renderItem("Authentication ID", a.authentication_id, {code:true});
    html += renderItem("Verification Code", a.verification_code, {code:true});
    html += renderItem("Student Name", a.student_name);
    html += renderItem("Student ID", a.student_id, {code:true});
    html += renderItem("Course / Program", a.course_name);
    html += renderItem("Date Started", fmt(a.date_started));
    html += renderItem("Date Completed", fmt(a.date_completed));
    html += renderItem("Admission Date", fmt(a.admission_date));
    html += renderItem("Date Issued", fmt(a.issue_date));
    html += renderItem("Expiry Date", fmt(a.expiry_date));

    html += `
      <div class="item">
        <div class="label">Document Status</div>
        <div class="value status-value">${esc(documentStatus.toUpperCase())}</div>
      </div>
    `;

    html += renderItem(
      "Institution",
      a.institution_name || "GAAWOW ACADEMY",
      {wide:true}
    );

    if (photoUrl) {
      html += `
        <div class="item wide">
          <div class="label">Student Photo</div>
          <div class="photo-wrap">
            <img
              class="photo"
              src="${esc(photoUrl)}"
              alt="Student photo"
              loading="lazy"
              referrerpolicy="no-referrer"
            >
          </div>
        </div>
      `;
    }

    resultBox.innerHTML = html;

    /* RESULTS ARE SHOWN ONLY FOR VALID / GRADUATED DOCUMENTS */
    const canShowResults =
      documentStatus === "valid" ||
      documentStatus === "graduated";

    if (canShowResults) {
      renderAcademicResults(a.academic_results, a.summary);
    } else {
      academicResults.hidden = true;
    }

    actions.hidden = false;

  } catch (error) {

    console.error("Authentication verification error:", error);

    setStatus(
      "invalid",
      "VERIFICATION SERVICE ERROR. PLEASE TRY AGAIN LATER."
    );

  }

  /* ACADEMIC RESULTS */
  function renderAcademicResults(rawResults, rawSummary) {

    let rows = rawResults;

    if (typeof rows === "string") {
      try {
        rows = JSON.parse(rows);
      } catch {
        rows = [];
      }
    }

    if (!Array.isArray(rows)) rows = [];

    let summary = rawSummary;

    if (typeof summary === "string") {
      try {
        summary = JSON.parse(summary);
      } catch {
        summary = {};
      }
    }

    if (!summary || typeof summary !== "object") {
      summary = {};
    }

    academicResults.hidden = false;

    if (rows.length === 0) {
      resultsTableContainer.innerHTML = `
        <div class="no-results">
          No published academic results are currently available.
        </div>
      `;

      renderSummary(summary, []);
      return;
    }

    const normalized = rows.map(row => {

      const subject = pick(row, [
        "subject_name",
        "subject",
        "name",
        "subject_title"
      ], "Subject");

      const score = numberValue(
        pick(row, ["score", "total_score", "marks"])
      );

      const maxScore = numberValue(
        pick(row, ["max_score", "total_max_score", "maximum_score"])
      );

      let percentage = numberValue(
        pick(row, ["percentage", "percent"])
      );

      if (
        percentage === null &&
        score !== null &&
        maxScore !== null &&
        maxScore > 0
      ) {
        percentage = (score / maxScore) * 100;
      }

      const grade = pick(row, [
        "grade",
        "letter_grade",
        "overall_grade"
      ], "N/A");

      return {
        subject,
        score,
        maxScore,
        percentage,
        grade
      };
    });

    let tableHTML = `
      <table class="results-table">
        <thead>
          <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Percentage</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody>
    `;

    normalized.forEach(row => {

      const scoreText =
        row.score === null
          ? "N/A"
          : row.score +
            (row.maxScore !== null ? " / " + row.maxScore : "");

      const percentageText =
        row.percentage === null
          ? "N/A"
          : row.percentage.toFixed(1) + "%";

      tableHTML += `
        <tr>
          <td>${esc(row.subject)}</td>
          <td class="score-cell">${esc(scoreText)}</td>
          <td>${esc(percentageText)}</td>
          <td class="grade-cell">${esc(row.grade)}</td>
        </tr>
      `;
    });

    tableHTML += `
        </tbody>
      </table>
    `;

    resultsTableContainer.innerHTML = tableHTML;

    renderSummary(summary, normalized);
  }

  /* RESULTS SUMMARY */
  function renderSummary(summary, rows) {

    const totalScore = numberValue(
      pick(summary, ["total_score", "total", "score_total"])
    );

    const totalMaxScore = numberValue(
      pick(summary, ["total_max_score", "max_score", "maximum_total"])
    );

    let percentage = numberValue(
      pick(summary, ["percentage", "average", "overall_percentage"])
    );

    if (
      percentage === null &&
      totalScore !== null &&
      totalMaxScore !== null &&
      totalMaxScore > 0
    ) {
      percentage = (totalScore / totalMaxScore) * 100;
    }

    const overallGrade = pick(summary, [
      "overall_grade",
      "grade",
      "final_grade"
    ], "N/A");

    const finalResult = pick(summary, [
      "final_result",
      "result",
      "overall_result"
    ], null);

    const totalText =
      totalScore !== null
        ? totalScore +
          (totalMaxScore !== null ? " / " + totalMaxScore : "")
        : "N/A";

    const percentageText =
      percentage !== null
        ? Number(percentage).toFixed(1) + "%"
        : "N/A";

    resultsSummary.innerHTML = `
      <div class="summary-box">
        <div class="summary-label">Total Score</div>
        <div class="summary-value">${esc(totalText)}</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">Percentage</div>
        <div class="summary-value">${esc(percentageText)}</div>
      </div>

      <div class="summary-box">
        <div class="summary-label">Overall Grade</div>
        <div class="summary-value">${esc(overallGrade)}</div>
      </div>

      ${
        finalResult
          ? `
            <div class="summary-box" style="grid-column:1/-1">
              <div class="summary-label">Final Result</div>
              <div class="summary-value">${esc(finalResult)}</div>
            </div>
          `
          : ""
      }
    `;
  }

})();
</script>

</body>
</html>
