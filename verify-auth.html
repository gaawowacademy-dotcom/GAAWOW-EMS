<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1E63">
<meta name="description" content="GAAWOW Academy official Authentication Letter verification">
<title>GAAWOW Academy | Authentication Letter Verification</title>

<style>
:root{
  --navy:#0B1E63;
  --blue:#0B4DA2;
  --gold:#D4AF37;
  --bg:#F5F7FA;
  --text:#111827;
  --muted:#64748B;
  --line:#E2E8F0;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

.top{
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;
  padding:18px 20px;
  box-shadow:0 3px 14px rgba(11,30,99,.18);
}

.top-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.top-mark{
  width:42px;
  height:42px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  object-fit:contain;
  background:#fff;
  padding:4px;
}

.brand{
  font-size:16px;
  font-weight:800;
  letter-spacing:.3px;
}

.motto{
  font-size:12px;
  opacity:.88;
  margin-top:3px;
}

.wrap{
  max-width:820px;
  margin:30px auto;
  padding:0 16px 40px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 10px 35px rgba(15,23,42,.08);
  overflow:hidden;
}

.head{
  text-align:center;
  padding:30px 22px 24px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#fbfdff);
}

.logo{
  width:82px;
  height:82px;
  object-fit:contain;
  margin-bottom:10px;
}

.title{
  font-size:27px;
  line-height:1.2;
  font-weight:900;
  color:var(--navy);
  letter-spacing:.2px;
}

.sub{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.gold-line{
  width:72px;
  height:3px;
  background:var(--gold);
  border-radius:99px;
  margin:14px auto 0;
}

.status{
  margin:22px 22px 16px;
  padding:15px 16px;
  border-radius:12px;
  font-weight:800;
  text-align:center;
  border:1px solid transparent;
}

.loading{
  background:#EFF6FF;
  color:var(--blue);
  border-color:#BFDBFE;
}

.valid{
  background:#ECFDF5;
  color:#166534;
  border-color:#BBF7D0;
}

.invalid{
  background:#FEF2F2;
  color:#991B1B;
  border-color:#FECACA;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  padding:4px 22px 24px;
}

.item{
  border:1px solid var(--line);
  border-radius:11px;
  padding:14px;
  background:#fff;
}

.label{
  font-size:10px;
  font-weight:800;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.65px;
}

.value{
  margin-top:6px;
  font-weight:750;
  line-height:1.4;
  word-break:break-word;
}

.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--navy);
  font-size:14px;
}

.status-value{
  color:#166534;
  text-transform:uppercase;
}

.wide{
  grid-column:1/-1;
}

.photo-wrap{
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:8px;
}

.photo{
  width:92px;
  height:112px;
  object-fit:cover;
  border:2px solid var(--gold);
  border-radius:9px;
  background:#f8fafc;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:0 22px 24px;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--navy);
  padding:10px 16px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.btn:hover{
  border-color:var(--gold);
}

.footer{
  text-align:center;
  border-top:1px solid var(--line);
  padding:17px 20px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.footer strong{
  color:var(--navy);
}

@media(max-width:600px){

  .wrap{
    margin:18px auto;
    padding:0 10px 28px;
  }

  .top{
    padding:14px;
  }

  .top-mark{
    width:38px;
    height:38px;
  }

  .head{
    padding:24px 16px 20px;
  }

  .logo{
    width:72px;
    height:72px;
  }

  .title{
    font-size:22px;
  }

  .status{
    margin:18px 14px 14px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:4px 14px 18px;
  }

  .wide{
    grid-column:auto;
  }

  .item{
    padding:13px;
  }

  .actions{
    margin:0 14px 18px;
  }
}

@media print{

  body{
    background:#fff;
  }

  .top{
    box-shadow:none;
  }

  .wrap{
    max-width:none;
    margin:12px auto;
  }

  .card{
    box-shadow:none;
    border:1px solid #ccc;
  }

  .actions{
    display:none;
  }

  .status,
  .item{
    break-inside:avoid;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="top-inner">

    <img
      class="top-mark"
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy"
    >

    <div>
      <div class="brand">GAAWOW ACADEMY</div>
      <div class="motto">Ilayska Aqoonta iyo Xirfadda</div>
    </div>

  </div>
</header>


<main class="wrap">

<section class="card" aria-live="polite">

  <div class="head">

    <img
      class="logo"
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy logo"
    >

    <div class="title">
      AUTHENTICATION LETTER
    </div>

    <div class="sub">
      Official Academic Document Verification
    </div>

    <div class="gold-line"></div>

  </div>


  <div id="status" class="status loading">
    Checking verification...
  </div>


  <div id="result" class="grid"></div>


  <div id="actions" class="actions" hidden>

    <button
      class="btn"
      type="button"
      onclick="window.print()"
    >
      Print / Save PDF
    </button>

  </div>


  <footer class="footer">

    <strong>GAAWOW ACADEMY</strong><br>

    Burhakaba, Bay, Somalia ·
    Ilayska Aqoonta iyo Xirfadda<br>

    Official verification service

  </footer>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

(async()=>{

  const SUPABASE_URL =
    "https://mytyvqwrxnxpxnxpiicj.supabase.co";

  const SUPABASE_KEY =
    window.GAAWOW_SUPABASE_KEY ||
    "sb_publishable_2AvWfupkF1b_s0RjIbAi5g_RqLCs145";


  const db =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const qs =
    new URLSearchParams(location.search);

  const code =
    qs.get("code");

  const id =
    qs.get("id");


  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const actions =
    document.getElementById("actions");


  const esc = v =>
    String(v ?? "")
      .replace(/[&<>\"']/g,m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#039;"

      }[m]));


  const fmt = v => {

    if(!v)
      return "Not available";

    return new Date(
      v + "T00:00:00"
    ).toLocaleDateString(
      "en-GB",
      {
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );

  };


  if(!code){

    status.className =
      "status invalid";

    status.textContent =
      "INVALID VERIFICATION CODE";

    return;

  }


  try{

    const {data,error} =
      await db.rpc(
        "verify_authentication_letter",
        {
          p_code:code,
          p_id:id || null
        }
      );


    if(
      error ||
      !data ||
      !data.length
    ){

      status.className =
        "status invalid";

      status.textContent =
        "AUTHENTICATION LETTER NOT FOUND / INVALID";

      return;

    }


    const a =
      data[0];


    status.className =
      "status valid";

    status.textContent =
      "✓ AUTHENTICATION LETTER VERIFIED";


    result.innerHTML = `

      <div class="item">

        <div class="label">
          Reference No
        </div>

        <div class="value code">
          ${esc(a.reference_no)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Verification Code
        </div>

        <div class="value code">
          ${esc(a.verification_code)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Student Name
        </div>

        <div class="value">
          ${esc(a.student_name)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Course / Program
        </div>

        <div class="value">
          ${esc(a.course_name)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Date Started
        </div>

        <div class="value">
          ${fmt(a.date_started)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Date Completed
        </div>

        <div class="value">
          ${fmt(a.date_completed)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Date Issued
        </div>

        <div class="value">
          ${fmt(a.issue_date)}
        </div>

      </div>


      <div class="item">

        <div class="label">
          Document Status
        </div>

        <div class="value status-value">
          ${esc(
            String(
              a.status || "VALID"
            ).toUpperCase()
          )}
        </div>

      </div>


      <div class="item wide">

        <div class="label">
          Institution
        </div>

        <div class="value">
          ${esc(
            a.institution_name ||
            "GAAWOW ACADEMY"
          )}
        </div>

      </div>


      ${
        a.student_photo_url
        ?
        `

        <div class="item wide">

          <div class="label">
            Student Photo
          </div>

          <div class="photo-wrap">

            <img
              class="photo"
              src="${esc(a.student_photo_url)}"
              alt="Student photo"
            >

          </div>

        </div>

        `
        :
        ""
      }

    `;


    actions.hidden = false;


  }catch(e){

    status.className =
      "status invalid";

    status.textContent =
      "VERIFICATION SERVICE ERROR";

  }

})();

</script>

</body>
</html>
