<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW Academy — Certificate Verification</title>

  <meta name="description" content="Verify a GAAWOW Academy certificate online.">
  <meta name="theme-color" content="#0B1E63">

  <link rel="icon" type="image/png"
        href="https://i.ibb.co/4ZCRpm30/gaawow-logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #164fa4 0%, #0B1E63 45%, #061337 100%);
      color: #1F2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 32px 26px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.30);
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0;
      color: #0B1E63;
      font-size: 27px;
    }

    .subtitle {
      margin: 8px 0 25px;
      color: #6B7280;
      font-size: 14px;
    }

    .form {
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #0B1E63;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0B4DA2;
      box-shadow: 0 0 0 3px rgba(11,77,162,0.12);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#0B4DA2,#0B1E63);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .error {
      background: #FEE2E2;
      color: #991B1B;
    }

    .success {
      background: #DCFCE7;
      color: #166534;
    }

    .result {
      display: none;
      margin-top: 22px;
      text-align: left;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      overflow: hidden;
    }

    .result-header {
      background: linear-gradient(135deg,#0B1E63,#0B4DA2);
      color: white;
      padding: 18px;
      text-align: center;
    }

    .result-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      display: inline-block;
      margin-top: 9px;
      padding: 6px 14px;
      border-radius: 30px;
      background: #16A34A;
      color: white;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .result-body {
      padding: 18px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 11px 0;
      border-bottom: 1px solid #F0F0F0;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #6B7280;
      font-size: 13px;
    }

    .value {
      text-align: right;
      font-weight: 700;
      color: #1F2937;
      word-break: break-word;
    }

    .links {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .links a {
      flex: 1;
      text-align: center;
      padding: 11px;
      border-radius: 10px;
      background: #F1F5F9;
      color: #0B4DA2;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    footer {
      margin-top: 22px;
      color: rgba(255,255,255,0.75);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 18px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <img
        class="logo"
        src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
        alt="GAAWOW Academy Logo"
      >

      <h1>Certificate Verification</h1>

      <div class="subtitle">
        GAAWOW Academy — Ilayska Aqoonta iyo Xirfadda
      </div>

      <div class="form">

        <label for="verifyCode">
          Certificate Number / ID / Verification Code
        </label>

        <input
          id="verifyCode"
          type="text"
          placeholder="Enter certificate code"
          autocomplete="off"
        >

        <button id="verifyBtn" type="button">
          VERIFY CERTIFICATE
        </button>

      </div>

      <div id="message" class="message"></div>

      <div id="result" class="result">

        <div class="result-header">
          <h2>Certificate Found</h2>
          <span id="status" class="status">VALID</span>
        </div>

        <div class="result-body">

          <div class="row">
            <span class="label">Certificate No.</span>
            <span id="certificateNo" class="value">—</span>
          </div>

          <div class="row">
            <span class="label">Certificate ID</span>
            <span id="certificateId" class="value">—</span>
          </div>

          <div class="row">
            <span class="label">Verification Code</span>
            <span id="verificationCode" class="value">—</span>
          </div>

          <div class="row">
            <span class="label">Student</span>
            <span id="studentName" class="value">—</span>
          </div>

          <div class="row">
            <span class="label">Course</span>
            <span id="courseName" class="value">—</span>
          </div>

          <div class="row">
            <span class="label">Issue Date</span>
            <span id="issueDate" class="value">—</span>
          </div>

          <div class="row">
            <span class="label">Expiry Date</span>
            <span id="expiryDate" class="value">—</span>
          </div>

          <div id="links" class="links"></div>

        </div>

      </div>

    </div>

    <footer>
      © 2026 GAAWOW Academy — Bur Hakaba, Bay, Somalia
    </footer>

  </div>

  <<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./verify.js"></script>

</body>
</html>
