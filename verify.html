<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="GAAWOW Academy Certificate Verification System">

<meta name="robots"
      content="index,follow">

<title>Verify Certificate — GAAWOW Academy</title>

<style>
:root{
  --navy:#0B1E63;
  --blue:#0B4DA2;
  --gold:#D4AF37;
  --white:#FFFFFF;
  --background:#F5F7FA;
  --dark:#1F2937;

  --green:#16A34A;
  --amber:#D97706;
  --red:#DC2626;

  --border:#dbe3ef;
  --muted:#64748b;
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--navy);
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:var(--dark);

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--blue)
    );

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    26px
    16px
    50px;
}


/* =========================================================
   BRAND
   ========================================================= */

.brand{
  display:flex;
  flex-direction:column;
  align-items:center;

  gap:10px;

  color:#fff;
  text-align:center;

  margin-bottom:22px;
}

.brand img{
  width:64px;
  height:64px;

  object-fit:contain;

  background:#fff;

  border-radius:14px;

  padding:6px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.18);
}

.brand h1{
  margin:0;

  font-size:22px;
  line-height:1.2;

  font-weight:800;
}

.brand p{
  margin:0;

  color:#f4d97a;

  font-size:12px;

  font-weight:800;

  letter-spacing:.4px;
}


/* =========================================================
   MAIN CARD
   ========================================================= */

.card{
  width:100%;
  max-width:680px;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 25px 60px rgba(0,0,0,.25);

  padding:22px;

  overflow:hidden;
}


/* =========================================================
   FORM
   ========================================================= */

form{
  display:flex;

  gap:8px;

  margin-bottom:18px;
}

input[type="text"]{
  flex:1;

  min-width:0;

  border:
    1px solid #cbd5e1;

  border-radius:10px;

  padding:
    12px
    13px;

  font:inherit;

  outline:none;

  text-transform:uppercase;

  letter-spacing:.5px;

  color:#1e293b;

  background:#fff;
}

input[type="text"]:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(11,77,162,.12);
}

button{
  border:0;

  border-radius:10px;

  padding:
    12px
    18px;

  font-weight:800;

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--blue)
    );

  color:#fff;

  font-size:14px;

  white-space:nowrap;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

button:hover{
  opacity:.94;
}

button:active{
  transform:scale(.98);
}


/* =========================================================
   PANEL
   ========================================================= */

.panel{
  text-align:center;

  padding:
    6px
    4px;
}

.panel .icon{
  font-size:44px;

  line-height:1;

  margin-bottom:6px;
}

.panel h2{
  margin:
    6px
    0
    10px;

  font-size:21px;

  color:var(--navy);
}

.panel p{
  color:#475569;

  line-height:1.55;

  margin:
    0
    0
    6px;
}

.panel.ok .icon{
  color:var(--green);
}

.panel.warn .icon{
  color:var(--amber);
}

.panel.bad .icon{
  color:var(--red);
}

.panel.neutral .icon{
  color:#64748b;
}


/* =========================================================
   STATUS BADGE
   ========================================================= */

.badge{
  display:inline-block;

  margin:
    6px
    0
    18px;

  padding:
    7px
    16px;

  border-radius:999px;

  font-weight:800;

  font-size:13px;

  letter-spacing:.5px;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.warn{
  background:#fef3c7;
  color:#92400e;
}

.badge.bad{
  background:#fee2e2;
  color:#991b1b;
}


/* =========================================================
   CERTIFICATE GRID
   ========================================================= */

.cert-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  text-align:left;

  margin-top:4px;
}

.cert-item{
  background:#f8fafc;

  border-radius:10px;

  padding:
    11px
    12px;

  border:
    1px solid #f1f5f9;
}

.cert-item strong{
  display:block;

  font-size:10.5px;

  color:#64748b;

  text-transform:uppercase;

  margin-bottom:4px;

  letter-spacing:.3px;
}

.cert-item span{
  color:#1e293b;

  font-weight:700;

  word-break:break-word;

  font-size:13.5px;
}


/* =========================================================
   VERIFY CODE
   ========================================================= */

.code{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  background:#eef2ff;

  color:var(--navy);

  padding:
    2px
    7px;

  border-radius:6px;

  font-size:12.5px;

  word-break:break-all;
}


/* =========================================================
   ACADEMIC RESULTS
   ========================================================= */

.academic-section{
  margin-top:22px;

  text-align:left;

  border-top:
    1px solid var(--border);

  padding-top:18px;
}

.academic-section h3{
  margin:
    0
    0
    12px;

  color:var(--navy);

  font-size:17px;

  text-align:center;
}

.academic-table-wrapper{
  width:100%;

  overflow-x:auto;

  border:
    1px solid var(--border);

  border-radius:12px;

  background:#fff;

  -webkit-overflow-scrolling:touch;
}

.academic-table{
  width:100%;

  min-width:720px;

  border-collapse:collapse;

  font-size:12.5px;
}

.academic-table th{
  background:var(--navy);

  color:#fff;

  padding:
    10px
    8px;

  text-align:center;

  font-size:10.5px;

  text-transform:uppercase;

  letter-spacing:.25px;

  white-space:nowrap;
}

.academic-table td{
  padding:
    10px
    8px;

  border-bottom:
    1px solid #e5e7eb;

  color:#334155;

  text-align:center;

  vertical-align:middle;
}

.academic-table td:nth-child(2){
  text-align:left;
}

.academic-table tbody tr:last-child td{
  border-bottom:0;
}

.academic-table tbody tr:nth-child(even){
  background:#f8fafc;
}


/* =========================================================
   SUMMARY
   ========================================================= */

.academic-summary{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:14px;
}

.summary-card{
  background:#f8fafc;

  border:
    1px solid var(--border);

  border-radius:11px;

  padding:12px;

  text-align:center;
}

.summary-card span{
  display:block;

  color:#64748b;

  font-size:10.5px;

  text-transform:uppercase;

  letter-spacing:.3px;

  margin-bottom:5px;
}

.summary-card strong{
  display:block;

  color:var(--navy);

  font-size:17px;
}

.summary-card.ok{
  background:#f0fdf4;

  border-color:#bbf7d0;
}

.summary-card.ok strong{
  color:#166534;
}

.summary-card.bad{
  background:#fef2f2;

  border-color:#fecaca;
}

.summary-card.bad strong{
  color:#991b1b;
}


/* =========================================================
   FOOTNOTE
   ========================================================= */

.footnote{
  margin-top:16px;

  font-size:12px;

  color:#94a3b8;

  text-align:center;

  line-height:1.6;
}

.tech{
  font-size:11px;

  color:#94a3b8;

  word-break:break-all;
}


/* =========================================================
   LOADING
   ========================================================= */

.spinner{
  width:34px;
  height:34px;

  border:
    4px solid #e2e8f0;

  border-top-color:
    var(--blue);

  border-radius:50%;

  margin:
    4px
    auto
    12px;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{
  margin-top:22px;

  color:#e5e7eb;

  font-size:12px;

  text-align:center;

  opacity:.85;

  line-height:1.5;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  body{
    padding:
      20px
      12px
      40px;
  }

  .brand{
    margin-bottom:18px;
  }

  .brand img{
    width:60px;
    height:60px;
  }

  .brand h1{
    font-size:20px;
  }

  .card{
    padding:18px;

    border-radius:16px;
  }

  form{
    flex-direction:column;
  }

  button{
    width:100%;
  }

  .cert-grid{
    grid-template-columns:1fr;
  }

  .academic-summary{
    grid-template-columns:
      1fr 1fr;
  }

  .academic-table{
    min-width:720px;
  }

}

@media(max-width:380px){

  .academic-summary{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<!-- =======================================================
     BRAND
     ======================================================= -->

<div class="brand">

  <img
    src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
    alt="GAAWOW Academy Logo"
  >

  <h1>
    GAAWOW Academy
  </h1>

  <p>
    CERTIFICATE VERIFICATION
  </p>

</div>


<!-- =======================================================
     MAIN CARD
     ======================================================= -->

<div class="card">

  <form
    id="verifyForm"
    autocomplete="off"
  >

    <input
      id="codeInput"
      type="text"
      placeholder="e.g. GAW-2026-XXXXXXXX"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      aria-label="Certificate verification code"
    >

    <button
      type="submit"
    >
      Verify
    </button>

  </form>


  <div
    id="result"
    aria-live="polite"
  ></div>

</div>


<!-- =======================================================
     FOOTER
     ======================================================= -->

<footer>

  GAAWOW Academy •
  Burhakaba, Bay, Somalia •
  www.gaawowacademy.com

</footer>


<!-- =======================================================
     SUPABASE
     ======================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =======================================================
     VERIFY JS
     CACHE VERSION 102
     ======================================================= -->

<script
  src="verify.js?v=102"
></script>

</body>
</html>
