<!-- GAAWOW TEACHER DASHBOARD CARDS: paste this whole block right BEFORE the last </body> tag -->
<style>
.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px!important}
.quick{display:flex!important;flex-direction:column;align-items:flex-start;gap:10px;min-height:130px;padding:16px!important;background:#fff;border:1px solid #e7ecf4;border-top:4px solid var(--c,#0B4DA2);border-radius:16px!important;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.quick:hover,.quick:active{transform:translateY(-3px);box-shadow:0 10px 22px rgba(11,30,99,.1)}
.quick .qicon{width:48px;height:48px;margin:0!important;border-radius:13px;background:#f1f5fb;display:grid;place-items:center;font-size:25px!important}
.quick strong{font-size:14px!important}
.quick span:not(.qicon){font-size:11px!important}
.back-dash{display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;border:1px solid #dbe3ef;background:#fff;color:#0B1E63;padding:9px 13px;border-radius:10px;font-weight:700;font-size:12px}
@media(max-width:760px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.quick{min-height:118px;padding:12px!important}.quick .qicon{width:42px;height:42px;font-size:22px!important}.quick strong{font-size:13px!important}}
</style>
<script>
(function(){
  "use strict";
  var colors={classes:"#0B4DA2",lessons:"#7C3AED",students:"#16A34A",attendance:"#D4AF37",exams:"#0B1E63",grades:"#B91C1C"};
  document.querySelectorAll(".quick[data-go]").forEach(function(b){
    b.style.setProperty("--c",colors[b.dataset.go]||"#0B4DA2");
    b.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});
  });
  // Full-width cards, Upcoming Lessons below
  var two=document.querySelector("#view-overview .grid-two");
  if(two)two.style.gridTemplateColumns="1fr";
  var qg=document.querySelector(".quick-grid");
  if(qg){var h=qg.closest(".panel").querySelector("h3");if(h)h.textContent="Teacher Management";}
  // Back to Dashboard button in every inner view
  document.querySelectorAll(".content-view:not(#view-overview)").forEach(function(v){
    var b=document.createElement("button");
    b.type="button";b.className="back-dash";b.textContent="← Back to Dashboard";
    b.addEventListener("click",function(){
      var n=document.querySelector('.nav-btn[data-view="overview"]');if(n)n.click();
      window.scrollTo({top:0,behavior:"smooth"});
    });
    v.insertBefore(b,v.firstChild);
  });
})();
</script>
/body>.
