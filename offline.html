<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1E63">
<title>GAAWOW EMS - Offline</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #F5F7FA;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

.card {
  background: white;
  padding: 35px 25px;
  border-radius: 18px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h2 {
  color: #0B1E63;
}

p {
  color: #555;
  line-height: 1.7;
}

button {
  background: #0B1E63;
  color: white;
  border: 0;
  padding: 13px 25px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>GAAWOW EMS</h2>

<h3>You are currently offline</h3>

<p>
Internet connection is required to access your account,
student records, attendance, examinations and live data.
</p>

<p>
Please reconnect to the internet and try again.
</p>

<button onclick="location.reload()">
Try Again
</button>

</div>

</body>
</html>
