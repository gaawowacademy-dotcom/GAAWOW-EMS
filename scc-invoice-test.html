
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAAWOW EMS - SCC Invoice Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#0B1E63;
  --blue:#0B4DA2;
  --gold:#D4AF37;
  --light:#F5F7FA;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:18px;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:#172033;
}
.container {
  max-width:520px;
  margin:25px auto;
}
.card {
  background:white;
  border-radius:14px;
  padding:22px;
  box-shadow:0 4px 18px #00000012;
}
.header {
  background:linear-gradient(135deg,var(--navy),var(--blue));
  color:white;
  text-align:center;
  padding:22px;
  border-radius:14px 14px 0 0;
}
.header h2 { margin:0 0 8px; }
.header p { margin:0; color:#f4d982; }
.student {
  border:1px solid #e2e6ed;
  border-radius:10px;
  padding:15px;
  margin:18px 0;
  line-height:1.8;
}
.label { color:#687386; font-size:13px; }
.value { font-weight:bold; }
button {
  width:100%;
  border:0;
  border-radius:9px;
  padding:15px;
  background:var(--navy);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled { opacity:.55; }
#message {
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:9px;
  overflow-wrap:anywhere;
  line-height:1.6;
}
.success { background:#e7f7ec; color:#176b35; }
.error { background:#fdeaea; color:#a32323; }
.info { background:#e9f1ff; color:#174b91; }
.small {
  font-size:12px;
  color:#687386;
  text-align:center;
  margin-top:18px;
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h2>GAAWOW EMS</h2>
    <p>Student Clearance Certificate</p>
  </div>

  <div class="card">
    <h3>SCC Graduation Invoice Test</h3>

    <div class="student">
      <div class="label">Student Name</div>
      <div class="value">Liibaan Maxamed Sheekh</div>

      <div class="label">Enrollment Number</div>
      <div class="value">GA-2026-000159</div>

      <div class="label">Graduation Fee</div>
      <div class="value" id="fee">$35.00 USD (configured fee)</div>
    </div>

    <p id="authStatus">Checking login session...</p>

    <button id="createBtn" disabled>
      Create SCC Invoice
    </button>

    <div id="message" role="status"></div>

    <div class="small">
      GAAWOW Academy | Ilayska Aqoonta iyo Xirfadda
    </div>
  </div>
</div>

<script>
"use strict";

const SUPABASE_URL =
  "https://mytyvqwrxnxpxnxpiicj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_2AvWfupkF1b_s0RjAi5g_RqLCs145";

const STUDENT_ID =
  "41e3644f-10f0-48be-86b9-cab586ff7240";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: "pkce"
    }
  }
);

const button = document.getElementById("createBtn");
const message = document.getElementById("message");
const authStatus = document.getElementById("authStatus");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
  message.style.display = "block";
}

async function initialize() {
  try {
    const { data, error } =
      await client.auth.getSession();

    if (error) throw error;

    if (!data.session) {
      authStatus.textContent =
        "Login session lama helin. Ku gal Super Admin EMS.";
      showMessage(
        "Fur boggan isla browser-ka aad EMS ku login-gashay.",
        "error"
      );
      return;
    }

    const user = data.session.user;

    const { data: profile, error: profileError } =
      await client
        .from("profiles")
        .select("role,is_active")
        .eq("id", user.id)
        .maybeSingle();

    if (profileError) throw profileError;

    if (
      !profile ||
      profile.role !== "super_admin" ||
      profile.is_active !== true
    ) {
      throw new Error(
        "Boggan waxaa isticmaali kara Super Admin active ah oo keliya."
      );
    }

    authStatus.textContent =
      "Super Admin session waa la xaqiijiyey.";

    button.disabled = false;

  } catch (error) {
    authStatus.textContent = "Login verification failed.";
    showMessage(error.message, "error");
  }
}

button.addEventListener("click", async () => {
  const confirmed = window.confirm(
    "Ma hubtaa inaad abuurayso SCC Request iyo Graduation Fee Invoice $35 ee Liibaan Maxamed Sheekh? Tani waxay xog cusub ku qoraysaa database-ka."
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "Creating invoice...";

  try {
    const { data: sessionData, error: sessionError } =
      await client.auth.getSession();

    if (sessionError) throw sessionError;
    if (!sessionData.session) {
      throw new Error("Login session wuu dhammaaday. Mar kale gal.");
    }

    const { data, error } = await client.rpc(
      "scc_finance_create_graduation_invoice_v1",
      {
        p_student_id: STUDENT_ID,
        p_due_date: null
      }
    );

    if (error) throw error;

    console.log("SCC RPC RESULT:", data);

    showMessage(
      "RPC waa la fuliyey. Natiijada: " +
      JSON.stringify(data),
      "success"
    );

    button.textContent = "Request processed";

  } catch (error) {
    console.error("SCC INVOICE ERROR:", error);

    showMessage(
      "Khalad: " + error.message,
      "error"
    );

    button.disabled = false;
    button.textContent = "Try Again";
  }
});

initialize();
</script>
</body>
</html>
