<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    GAAWOW EMS | Teachers
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .page {
      padding: 20px;
      max-width: 1500px;
      margin: auto;
    }

    .header {
      background:
        linear-gradient(
          135deg,
          #0b1e63,
          #0b4da2
        );
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow:
        0 5px 18px rgba(0,0,0,.12);
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .toolbar {
      background: white;
      padding: 16px;
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
      box-shadow:
        0 3px 14px rgba(0,0,0,.07);
    }

    .toolbar input,
    .toolbar select {
      height: 42px;
      border: 1px solid #d7dce5;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .toolbar input {
      min-width: 240px;
      flex: 1;
    }

    .toolbar select {
      min-width: 180px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .primary-btn {
      background: #0b4da2;
      color: white;
      height: 42px;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .primary-btn:hover {
      opacity: .92;
    }

    .table-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 3px 14px rgba(0,0,0,.07);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th {
      background: #0b1e63;
      color: white;
      padding: 13px 10px;
      text-align: left;
      font-size: 13px;
    }

    td {
      padding: 11px 10px;
      border-bottom: 1px solid #edf0f5;
      font-size: 13px;
      vertical-align: middle;
    }

    tr:hover td {
      background: #fafcff;
    }

    .teacher-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 240px;
    }

    .teacher-photo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #e9edf5;
      border: 2px solid #e0e5ef;
      flex-shrink: 0;
    }

    .teacher-name {
      font-weight: bold;
      color: #172033;
    }

    .teacher-email {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
      word-break: break-all;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .status.active {
      background: #e6f7ed;
      color: #16834b;
    }

    .status.inactive {
      background: #fdeaea;
      color: #c62828;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .action-btn {
      padding: 6px 9px;
      border-radius: 6px;
      color: white;
      font-size: 11px;
      font-weight: bold;
    }

    .action-btn.view {
      background: #607d8b;
    }

    .action-btn.edit {
      background: #0b4da2;
    }

    .action-btn.toggle {
      background: #d4af37;
      color: #172033;
    }

    .action-btn.delete {
      background: #c62828;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 35px !important;
      color: #777;
    }

    /* =========================================
       MODALS
       ========================================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 94vh;
      overflow-y: auto;
      background: white;
      border-radius: 15px;
      box-shadow:
        0 15px 50px rgba(0,0,0,.25);
    }

    .modal-header {
      background:
        linear-gradient(
          135deg,
          #0b1e63,
          #0b4da2
        );
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-btn {
      background: transparent;
      color: white;
      font-size: 25px;
      line-height: 1;
    }

    .modal-body {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 13px;
      font-weight: bold;
      color: #39455a;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      height: 42px;
      border: 1px solid #d6dce6;
      border-radius: 8px;
      padding: 0 11px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #0b4da2;
      box-shadow:
        0 0 0 2px rgba(11,77,162,.1);
    }

    .form-group input:disabled {
      background: #f1f3f6;
      color: #666;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #edf0f5;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .secondary-btn {
      height: 42px;
      padding: 0 16px;
      background: #e9edf3;
      color: #293346;
      border-radius: 8px;
      font-weight: bold;
    }

    /* =========================================
       PHOTO UPLOAD
       ========================================= */

    .photo-upload-box {
      border: 2px dashed #cbd3df;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      background: #fafbfd;
    }

    .photo-preview {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #d4af37;
      background: #edf1f6;
      display: block;
      margin: 0 auto 12px;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 15px;
      background: #0b4da2;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    #photoFile {
      display: none;
    }

    .photo-help {
      margin-top: 8px;
      font-size: 11px;
      color: #777;
    }

    .upload-status {
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    /* =========================================
       VIEW PROFILE
       ========================================= */

    .profile-box {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .profile-box .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #d4af37;
      background: #edf1f6;
      flex-shrink: 0;
    }

    .profile-name {
      font-size: 22px;
      font-weight: bold;
      color: #0b1e63;
      margin-bottom: 10px;
    }

    .detail {
      margin: 7px 0;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      .page {
        padding: 10px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .profile-box {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .profile-box .avatar {
        width: 115px;
        height: 115px;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
        min-width: 100%;
      }

      .primary-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>

<div class="page">

  <!-- =========================================
       HEADER
       ========================================= -->

  <div class="header">

    <h1>
      GAAWOW EMS — Teachers
    </h1>

    <p>
      Teacher Management & Account Administration
    </p>

  </div>


  <!-- =========================================
       TOOLBAR
       ========================================= -->

  <div class="toolbar">

    <input
      type="search"
      id="searchInput"
      placeholder="Search teacher name, email, phone or ID..."
    >

    <select id="institutionFilter">
      <option value="">
        All Institutions
      </option>
    </select>

    <select id="statusFilter">

      <option value="">
        All Status
      </option>

      <option value="active">
        Active
      </option>

      <option value="inactive">
        Inactive
      </option>

    </select>

    <button
      type="button"
      class="primary-btn"
      onclick="openAddTeacher()"
    >
      + Add Teacher
    </button>

  </div>


  <!-- =========================================
       TEACHERS TABLE
       ========================================= -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>#</th>

            <th>
              Teacher
            </th>

            <th>
              Phone
            </th>

            <th>
              Institution
            </th>

            <th>
              Role
            </th>

            <th>
              Status
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>

        <tbody id="teachersTableBody">

          <tr>

            <td
              colspan="7"
              class="loading"
            >
              Loading teachers...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- =========================================
     ADD / EDIT TEACHER MODAL
     ========================================= -->

<div
  class="modal"
  id="teacherModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">
        Add Teacher
      </h2>

      <button
        type="button"
        class="close-btn"
        onclick="closeTeacherModal()"
      >
        &times;
      </button>

    </div>


    <form
      id="teacherForm"
    >

      <div class="modal-body">

        <input
          type="hidden"
          id="editId"
        >


        <div class="form-grid">


          <!-- =================================
               PHOTO
               ================================= -->

          <div class="form-group full">

            <label>
              Teacher Photo
            </label>

            <div class="photo-upload-box">

              <img
                id="photoPreview"
                class="photo-preview"
                src="https://via.placeholder.com/105"
                alt="Teacher Photo"
              >

              <label
                class="file-label"
                for="photoFile"
              >
                Choose Teacher Photo
              </label>

              <input
                type="file"
                id="photoFile"
                accept="image/jpeg,image/png,image/webp"
              >

              <div class="photo-help">
                JPG, PNG or WEBP • Maximum 2 MB
              </div>

              <div
                id="uploadStatus"
                class="upload-status"
              ></div>

            </div>

          </div>


          <!-- =================================
               FULL NAME
               ================================= -->

          <div class="form-group full">

            <label for="fullName">
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter teacher full name"
              required
            >

          </div>


          <!-- =================================
               EMAIL
               ================================= -->

          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="teacher@example.com"
              required
            >

          </div>


          <!-- =================================
               PASSWORD
               ================================= -->

          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Minimum 6 characters"
            >

          </div>


          <!-- =================================
               PHONE
               ================================= -->

          <div class="form-group">

            <label for="phone">
              Phone
            </label>

            <input
              type="text"
              id="phone"
              placeholder="Phone number"
            >

          </div>


          <!-- =================================
               INSTITUTION
               ================================= -->

          <div class="form-group">

            <label for="institutionId">
              Institution
            </label>

            <select
              id="institutionId"
              required
            >

              <option value="">
                Select Institution
              </option>

            </select>

          </div>


          <!-- =================================
               STATUS
               ================================= -->

          <div class="form-group">

            <label for="isActive">
              Status
            </label>

            <select id="isActive">

              <option value="true">
                Active
              </option>

              <option value="false">
                Inactive
              </option>

            </select>

          </div>


        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="secondary-btn"
          onclick="closeTeacherModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          id="saveBtn"
          class="primary-btn"
        >
          Create Teacher
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================================
     VIEW TEACHER MODAL
     ========================================= -->

<div
  class="modal"
  id="viewModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        Teacher Profile
      </h2>

      <button
        type="button"
        class="close-btn"
        onclick="closeViewModal()"
      >
        &times;
      </button>

    </div>

    <div
      class="modal-body"
      id="viewContent"
    ></div>

    <div class="modal-footer">

      <button
        type="button"
        class="secondary-btn"
        onclick="closeViewModal()"
      >
        Close
      </button>

    </div>

  </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script src="teacher.js?v=5"></script>

</body>

</html>
