<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GAAWOW EMS | Teacher Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0B1E63;
    --blue: #0B4DA2;
    --gold: #D4AF37;
    --green: #16834A;
    --red: #C62828;
    --bg: #F4F7FB;
    --text: #172033;
    --muted: #667085;
    --line: #E3E8F0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
}

/* HEADER */

.topbar {
    background: linear-gradient(110deg, var(--navy), var(--blue));
    color: white;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 54px;
    height: 54px;
    object-fit: contain;
    background: white;
    border-radius: 10px;
    padding: 3px;
}

.brand h1 {
    font-size: 18px;
    margin: 0;
}

.brand p {
    font-size: 12px;
    margin: 4px 0 0;
    color: #E4EBFF;
}

.top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* BUTTONS */

.btn {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
}

.btn-gold {
    background: var(--gold);
    color: #172033;
}

.btn-light {
    background: white;
    color: var(--navy);
}

.btn-blue {
    background: var(--blue);
    color: white;
}

.btn-danger {
    background: #FFEBEE;
    color: var(--red);
}

.btn-small {
    padding: 7px 9px;
    font-size: 11px;
    margin: 2px;
}

/* MAIN */

main {
    max-width: 1250px;
    margin: 24px auto;
    padding: 0 16px;
}

.banner {
    display: none;
    background: #FFF8DF;
    border: 1px solid #F0D783;
    color: #654D00;
    padding: 11px 14px;
    border-radius: 9px;
    margin-bottom: 14px;
    font-size: 13px;
}

.card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px #10234B08;
}

.card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.card h2 {
    font-size: 17px;
    margin: 0 0 5px;
    color: var(--navy);
}

.sub {
    font-size: 12px;
    color: var(--muted);
}

/* FILTERS */

.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #344054;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #CCD5E2;
    border-radius: 8px;
    padding: 10px 11px;
    font: inherit;
    font-size: 13px;
    background: white;
    color: var(--text);
}

input:disabled,
select:disabled {
    background: #F1F3F6;
    color: #667085;
}

/* TABLE */

.table-wrap {
    overflow-x: auto;
    margin-top: 14px;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 850px;
}

th,
td {
    text-align: left;
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
}

th {
    background: #F6F8FC;
    color: var(--navy);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
}

.person {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 180px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: #E8EDF7;
    display: grid;
    place-items: center;
    color: var(--navy);
    font-weight: 800;
}

.person strong {
    display: block;
    font-size: 12px;
}

.person small {
    color: var(--muted);
    font-size: 10px;
}

.badge {
    display: inline-block;
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 800;
}

.active {
    background: #E6F6ED;
    color: #147A42;
}

.inactive {
    background: #FFEBEE;
    color: #B42318;
}

.missing {
    background: #FFF4D6;
    color: #8A6100;
}

/* MESSAGES */

#messageBox {
    display: none;
    padding: 11px 13px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 13px;
}

#messageBox.success {
    display: block;
    background: #E8F7EE;
    color: #146C3B;
}

#messageBox.error {
    display: block;
    background: #FFEBEE;
    color: #A21B1B;
}

#messageBox.info {
    display: block;
    background: #EAF2FF;
    color: #174EA6;
}

/* MODALS */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #071536A8;
    z-index: 10;
    padding: 18px;
    overflow: auto;
}

.modal.show {
    display: block;
}

.modal-box {
    max-width: 760px;
    margin: 25px auto;
    background: white;
    border-radius: 14px;
    padding: 20px;
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.modal-head h2 {
    margin: 0;
    color: var(--navy);
    font-size: 18px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.field-full {
    grid-column: 1 / -1;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

.photo-row {
    display: flex;
    gap: 12px;
    align-items: center;
}

.photo-row img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 10px;
    background: #EEE;
}

.loading,
.empty {
    text-align: center;
    padding: 30px;
    color: var(--muted);
}

/* MOBILE */

@media(max-width:700px) {

    .topbar {
        padding: 13px;
    }

    .brand img {
        width: 45px;
        height: 45px;
    }

    .brand h1 {
        font-size: 15px;
    }

    .filters,
    .grid {
        grid-template-columns: 1fr;
    }

    .field-full {
        grid-column: auto;
    }

    main {
        margin: 15px auto;
        padding: 0 10px;
    }

    .card {
        padding: 13px;
    }

    .top-actions {
        width: 100%;
    }

    .top-actions .btn {
        flex: 1;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="topbar">

    <div class="brand">

        <img
            src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
            alt="GAAWOW Academy Logo"
        >

        <div>
            <h1>GAAWOW ACADEMY</h1>
            <p>Ilayska Aqoonta iyo Xirfadda | EMS Teacher Management</p>
        </div>

    </div>

    <div class="top-actions">

        <a
            class="btn btn-light"
            href="dashboard.html"
            style="text-decoration:none"
        >
            Dashboard
        </a>

        <a
            id="superAdminLink"
            class="btn btn-light"
            href="dashboard.html"
            style="text-decoration:none"
        >
            Super Admin
        </a>

        <button
            id="createTeacherAccountBtn"
            class="btn btn-gold"
        >
            + Add Teacher
        </button>

    </div>

</header>


<!-- MAIN -->

<main>

    <div id="roleBanner" class="banner"></div>

    <div id="messageBox"></div>

    <section class="card">

        <div class="card-head">

            <div>
                <h2>Teacher Management</h2>

                <div class="sub">
                    Manage teacher records and login access securely.
                </div>
            </div>

            <div class="sub" id="teacherCount">
                Loading...
            </div>

        </div>


        <!-- FILTERS -->

        <div class="filters">

            <div>

                <label for="searchInput">
                    Search Teachers
                </label>

                <input
                    id="searchInput"
                    placeholder="Name, Teacher ID, email or phone"
                >

            </div>


            <div>

                <label for="institutionFilter">
                    Institution
                </label>

                <select id="institutionFilter">
                    <option value="">All institutions</option>
                </select>

            </div>


            <div>

                <label for="statusFilter">
                    Account Status
                </label>

                <select id="statusFilter">

                    <option value="">
                        All statuses
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                    <option value="missing">
                        Profile Missing
                    </option>

                </select>

            </div>

        </div>


        <!-- TEACHERS TABLE -->

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>Teacher</th>
                        <th>Phone</th>
                        <th>Institution</th>
                        <th>Qualification</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="teachersTableBody">

                    <tr>
                        <td colspan="7" class="loading">
                            Loading teachers...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<!-- ADD / EDIT TEACHER MODAL -->

<div class="modal" id="teacherModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                Add Teacher
            </h2>

            <button
                class="btn btn-danger"
                type="button"
                id="closeTeacherModal"
            >
                Close
            </button>

        </div>


        <form id="teacherForm">

            <input
                type="hidden"
                id="editId"
            >

            <div class="grid">


                <div>

                    <label for="fullName">
                        Full Name *
                    </label>

                    <input
                        id="fullName"
                        required
                        maxlength="150"
                    >

                </div>


                <div>

                    <label for="email">
                        Email *
                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                        maxlength="254"
                    >

                </div>


                <div>

                    <label for="teacherId">
                        Teacher ID *
                    </label>

                    <input
                        id="teacherId"
                        required
                        maxlength="50"
                    >

                </div>


                <div>

                    <label for="password">
                        Initial Password
                        <span id="passwordHint">
                            (minimum 12 characters)
                        </span>
                    </label>

                    <input
                        id="password"
                        type="password"
                        minlength="12"
                        autocomplete="new-password"
                    >

                </div>


                <div>

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        id="phone"
                        maxlength="30"
                    >

                </div>


                <div>

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>


                <div>

                    <label for="qualification">
                        Qualification
                    </label>

                    <input
                        id="qualification"
                        maxlength="150"
                    >

                </div>


                <div>

                    <label for="specialization">
                        Specialization
                    </label>

                    <input
                        id="specialization"
                        maxlength="150"
                    >

                </div>


                <div>

                    <label for="employmentDate">
                        Employment Date
                    </label>

                    <input
                        id="employmentDate"
                        type="date"
                    >

                </div>


                <div>

                    <label for="institutionId">
                        Institution *
                    </label>

                    <select
                        id="institutionId"
                        required
                    >
                    </select>

                </div>


                <!-- PHOTO -->

                <div class="field-full">

                    <label for="photoFile">
                        Teacher Photo
                        (JPG, PNG or WEBP, max 2 MB)
                    </label>

                    <div class="photo-row">

                        <img
                            id="photoPreview"
                            alt="Photo preview"
                            src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
                        >

                        <input
                            id="photoFile"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                        >

                    </div>

                    <small
                        id="photoStatus"
                        class="sub"
                    ></small>

                </div>

            </div>


            <!-- FORM ACTIONS -->

            <div class="form-actions">

                <button
                    class="btn btn-light"
                    type="button"
                    id="cancelTeacher"
                >
                    Cancel
                </button>

                <button
                    class="btn btn-blue"
                    id="saveBtn"
                    type="submit"
                >
                    Save Teacher
                </button>

            </div>

        </form>

    </div>

</div>


<!-- VIEW TEACHER MODAL -->

<div class="modal" id="viewModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>
                Teacher Details
            </h2>

            <button
                class="btn btn-danger"
                id="closeViewModal"
            >
                Close
            </button>

        </div>

        <div id="viewContent"></div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
window.__teacherJsLoaded = false;

setTimeout(() => {

    if (!window.__teacherJsLoaded) {

        const e = document.getElementById("messageBox");

        e.className = "error";

        e.textContent =
            "Teacher management script did not load. Check teacher.js file and internet connection.";

    }

}, 5000);

</script>


<!-- TEACHER JAVASCRIPT V10 -->

<script src="teacher.js?v=10.1"></script>

</body>
</html>
