<!-- GAAWOW PARENT DASHBOARD CARDS: paste this whole block right BEFORE the last </body> tag -->
<style>
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:6px}
.quick-card{appearance:none;font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:130px;padding:16px;background:#fff;border:1px solid #e7ecf4;border-top:4px solid var(--c,#0B4DA2);border-radius:16px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.04);transition:.18s ease;-webkit-tap-highlight-color:transparent}
.quick-card:hover,.quick-card:active{transform:translateY(-3px);box-shadow:0 10px 22px rgba(11,30,99,.1)}
.quick-card .ico{width:48px;height:48px;border-radius:13px;background:#f1f5fb;display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1}
.quick-card b{display:block;font-size:15px;color:#0B1E63}
.quick-card small{display:block;margin-top:5px;font-size:11px;line-height:1.45;color:#64748b;font-weight:400}
.back-dash{display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;border:1px solid #dbe3ef;background:#fff;color:#0B1E63;padding:9px 13px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer}
.child-section .data-grid.single{grid-template-columns:1fr}
@media(max-width:650px){.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card{min-height:118px;padding:12px;gap:9px}.quick-card .ico{width:42px;height:42px;font-size:22px}.quick-card b{font-size:13px}}
</style>
<script>
(function(){
  "use strict";
  var colors=["#0B4DA2","#7C3AED","#16A34A","#D4AF37","#0B1E63","#B91C1C"];
  var desc={
    "Institution":"Machadka iyo xiriirka",
    "Courses & Departments":"Koorsooyinka iyo waaxaha",
    "Classes":"Fasallada iyo macallimiinta",
    "Subjects":"Maaddooyinka",
    "Lessons & Teachers":"Casharrada iyo jadwalka",
    "Attendance":"Xaadirinta ardayga",
    "Exams":"Imtixaannada iyo natiijada",
    "Grades & Results":"Dhibcaha iyo darajooyinka",
    "Academic Progress":"Horumarka waxbarasho",
    "Certificates":"Shahaadooyinka",
    "Invoices":"Biilasha iyo haraaga",
    "Payments":"Lacagaha la bixiyey"
  };
  function build(){
    document.querySelectorAll(".child-section:not([data-dash])").forEach(function(sec){
      var grid=sec.querySelector(".data-grid");
      if(!grid)return;
      sec.dataset.dash="1";
      var cards=Array.prototype.slice.call(grid.children);
      var menu=document.createElement("div");menu.className="quick-grid";
      var back=document.createElement("button");
      back.type="button";back.className="back-dash";back.textContent="← Back to menu";back.hidden=true;
      grid.hidden=true;grid.classList.add("single");
      cards.forEach(function(card,i){
        var h4=card.querySelector("h4");
        var full=h4?h4.textContent.trim():"Section";
        var sp=full.indexOf(" ");
        var icon=sp>0?full.slice(0,sp):"📁";
        var label=sp>0?full.slice(sp+1):full;
        var b=document.createElement("button");
        b.type="button";b.className="quick-card";
        b.style.setProperty("--c",colors[i%colors.length]);
        b.innerHTML='<span class="ico"></span><span><b></b><small></small></span>';
        b.querySelector(".ico").textContent=icon;
        b.querySelector("b").textContent=label;
        b.querySelector("small").textContent=desc[label]||"";
        b.addEventListener("click",function(){
          menu.hidden=true;grid.hidden=false;back.hidden=false;
          cards.forEach(function(c){c.hidden=(c!==card);});
          sec.scrollIntoView({behavior:"smooth",block:"start"});
        });
        menu.appendChild(b);
      });
      back.addEventListener("click",function(){
        grid.hidden=true;back.hidden=true;menu.hidden=false;
        cards.forEach(function(c){c.hidden=false;});
        sec.scrollIntoView({behavior:"smooth",block:"start"});
      });
      grid.before(menu);
      grid.before(back);
    });
  }
  var list=document.getElementById("childrenList");
  if(list){
    new MutationObserver(build).observe(list,{childList:true});
    build();
  }
})();
</script>
/body>.
