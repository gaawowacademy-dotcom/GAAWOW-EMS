
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B1E63">
<title>Parent Portal | GAAWOW EMS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --navy:#0B1E63;
  --blue:#0B4DA2;
  --gold:#D4AF37;
  --white:#fff;
  --bg:#F5F7FA;
  --text:#172033;
  --muted:#6B7280;
  --border:#E5E7EB;
  --success:#16834A;
  --danger:#DC2626;
  --green:#16A34A;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
  width:260px;
  background:var(--navy);
  color:white;
  padding:22px 15px;
  position:fixed;
  top:0;bottom:0;left:0;
  overflow-y:auto;
  z-index:20;
}
.brand{text-align:center;padding:5px 8px 22px;border-bottom:1px solid #ffffff25}
.brand img{width:76px;height:76px;object-fit:contain;background:white;border-radius:50%;padding:5px}
.brand h2{font-size:17px;margin:10px 0 4px}
.brand p{font-size:11px;color:#d9e2ff;margin:0}
.menu{margin-top:20px}
.menu button{
  width:100%;display:flex;align-items:center;gap:12px;
  color:#e7edff;background:transparent;border:0;
  padding:12px 13px;border-radius:9px;text-align:left;
  font-size:13px;margin:3px 0;
}
.menu button:hover,.menu button.active{background:#ffffff20;color:white}
.menu button.active{border-left:3px solid var(--gold)}
.main{margin-left:260px;width:calc(100% - 260px);padding:25px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;background:white;padding:17px 20px;
  border-radius:13px;border:1px solid var(--border);
  margin-bottom:22px;
}
.topbar h1{font-size:19px;color:var(--navy);margin:0}
.topbar p{font-size:12px;color:var(--muted);margin:5px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:8px;padding:10px 14px;
  font-size:12px;font-weight:700;
}
.btn-primary{background:var(--navy);color:white}
.btn-light{background:#eef2ff;color:var(--navy)}
.btn-danger{background:#fee2e2;color:#991b1b}
.content-title{font-size:19px;color:var(--navy);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{
  background:white;border:1px solid var(--border);
  border-radius:12px;padding:18px;
}
.stat .icon{font-size:23px}
.stat h3{font-size:25px;color:var(--navy);margin:12px 0 5px}
.stat p{font-size:12px;color:var(--muted);margin:0}
.panel{
  background:white;border:1px solid var(--border);
  border-radius:12px;padding:20px;margin-bottom:18px;
}
.panel h3{font-size:15px;color:var(--navy);margin:0 0 15px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:550px}
th,td{padding:12px 10px;border-bottom:1px solid var(--border);font-size:12px;text-align:left}
th{background:#f8fafc;color:var(--navy);font-weight:700}
td{color:#374151}
.badge{
  display:inline-block;padding:5px 9px;border-radius:20px;
  font-size:10px;font-weight:700;background:#e5e7eb;color:#374151
}
.badge.success{background:#dcfce7;color:#166534}
.badge.warning{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#991b1b}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
.child-select,.field{
  width:100%;padding:12px;border:1px solid var(--border);
  border-radius:8px;background:white;color:var(--text);
}
.field{margin-top:7px}
label{font-size:12px;font-weight:700;color:#374151}
.form-group{margin-bottom:15px}
.notice{
  background:#eff6ff;color:#1e40af;padding:12px;
  border-radius:8px;font-size:12px;line-height:1.6;
}

/* WhatsApp */
.whatsapp-panel{
  border:1px solid #bbf7d0;
  background:#fff;border-radius:14px;padding:20px;
}
.wa-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.wa-logo{
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;background:#dcfce7;font-size:27px
}
.wa-header h2{font-size:17px;color:#166534;margin:0 0 5px}
.wa-header p{font-size:12px;color:var(--muted);margin:0}
.wa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.wa-card{
  border:1px solid var(--border);border-radius:10px;
  padding:15px;background:white;text-align:left;
  transition:.2s;
}
.wa-card:hover{border-color:var(--green);background:#f0fdf4}
.wa-card.selected{border:2px solid var(--green);background:#f0fdf4}
.wa-icon{font-size:24px;margin-bottom:8px}
.wa-card strong{display:block;font-size:13px;color:#166534}
.wa-card small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.wa-send{
  width:100%;padding:14px;border:0;border-radius:9px;
  color:white;background:#16A34A;font-weight:800;font-size:14px;
}
.wa-send:hover{background:#15803d}
.wa-note{
  background:#f0fdf4;color:#166534;padding:12px;
  border-radius:8px;font-size:11px;line-height:1.7;margin-top:14px
}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
.mobile-menu{display:none}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:650px){
  .sidebar{transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:13px}
  .mobile-menu{display:inline-block}
  .topbar{padding:13px;align-items:flex-start}
  .topbar h1{font-size:16px}
  .grid{gap:9px}
  .stat{padding:13px}
  .stat h3{font-size:21px}
  .wa-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png" alt="GAAWOW Academy Logo">
    <h2>GAAWOW ACADEMY</h2>
    <p>ILAYSKA AQOONTA IYO XIRFADDA</p>
    <p style="margin-top:7px;color:#D4AF37">PARENT PORTAL</p>
  </div>
  <nav class="menu" id="menu"></nav>
</aside>

<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-light mobile-menu" onclick="toggleSidebar()">☰</button>
      <div>
        <h1 id="pageTitle">Parent Dashboard</h1>
        <p id="welcomeText">Welcome to GAAWOW EMS</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-light" onclick="refreshCurrent()">↻ Refresh</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <div id="pageContent">
    <div class="loading">Loading Parent Portal...</div>
  </div>

  <div class="footer">
    © <span id="year"></span> GAAWOW Academy | GAAWOW EMS
  </div>
</main>
</div>

<script>
/* =========================================================
   GAAWOW EMS PARENT PORTAL
   WhatsApp Communication System Integrated
   ========================================================= */

/* SUPABASE CONFIGURATION */
const SUPABASE_URL = "https://mytyvqwrxnxpxnxpiicj.supabase.co";
const SUPABASE_KEY = "sb_publishable_2AvWfupkF1b_s0RjIbAi5g_RqLCs145";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* OFFICIAL GAAWOW WHATSAPP NUMBER */
const WHATSAPP_NUMBER = "252615228824";

/* APPLICATION STATE */
let currentUser = null;
let currentProfile = null;
let currentParent = null;
let children = [];
let selectedChild = null;
let currentSection = "dashboard";
let cache = {};

const sections = [
  ["dashboard","🏠","Dashboard"],
  ["children","👨‍👩‍👧","My Children"],
  ["institution","🏫","Institution"],
  ["courses","📚","Courses"],
  ["classes","🏛️","Classes"],
  ["subjects","📖","Subjects"],
  ["lessons","📝","Lessons"],
  ["attendance","📅","Attendance"],
  ["exams","📋","Exams"],
  ["grades","🎓","Academic Results"],
  ["progress","📈","Academic Progress"],
  ["certificates","📜","Certificates"],
  ["invoices","💳","Invoices"],
  ["payments","💰","Payments"],
  ["whatsapp","💬","WhatsApp Communication"]
];

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function showMessage(message){
  alert(message);
}

function toggleSidebar(){
  $("sidebar").classList.toggle("open");
}

function setPage(title,html){
  $("pageTitle").textContent = title;
  $("pageContent").innerHTML = html;
  $("sidebar").classList.remove("open");
}

function buildMenu(){
  $("menu").innerHTML = sections.map(item => `
    <button class="${currentSection===item[0]?"active":""}"
      onclick="openSection('${item[0]}')">
      <span>${item[1]}</span><span>${escapeHTML(item[2])}</span>
    </button>
  `).join("");
}

async function sq(query){
  const result = await query;
  if(result.error) throw result.error;
  return result.data || [];
}

function getChildId(){
  return selectedChild?.id || null;
}

function childSelector(){
  if(!children.length) return "";
  return `
    <div class="form-group">
      <label>Choose Student</label>
      <select class="child-select" onchange="changeChild(this.value)">
        ${children.map(c=>`
          <option value="${escapeHTML(c.id)}" ${selectedChild?.id===c.id?"selected":""}>
            ${escapeHTML(c.full_name || c.student_name || "Student")}
          </option>
        `).join("")}
      </select>
    </div>`;
}

function changeChild(id){
  selectedChild = children.find(c=>String(c.id)===String(id)) || null;
  cache = {};
  openSection(currentSection);
}

function tableHTML(headers,rows){
  if(!rows.length) return `<div class="empty">No records available.</div>`;
  return `<div class="table-wrap"><table>
    <thead><tr>${headers.map(h=>`<th>${escapeHTML(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function statusBadge(value){
  const v=String(value||"Unknown");
  let cls="badge";
  if(["paid","successful","valid","published","approved","present","completed"].includes(v.toLowerCase())) cls+=" success";
  else if(["pending","partial","unpaid","overdue","absent"].includes(v.toLowerCase())) cls+=" warning";
  else if(["failed","cancelled","rejected","invalid"].includes(v.toLowerCase())) cls+=" danger";
  return `<span class="${cls}">${escapeHTML(v)}</span>`;
}

async function loadChildren(){
  const links = await sq(
    supabaseClient.from("parent_students")
      .select("student_id")
      .eq("parent_id",currentParent.id)
  );

  const ids = links.map(x=>x.student_id).filter(Boolean);
  if(!ids.length) return [];

  return await sq(
    supabaseClient.from("students")
      .select("*")
      .in("id",ids)
      .order("full_name")
  );
}

async function initialize(){
  try{
    const {data:{session},error:sessionError} =
      await supabaseClient.auth.getSession();

    if(sessionError) throw sessionError;
    if(!session){
      window.location.href="login.html";
      return;
    }

    currentUser=session.user;

    const profiles=await sq(
      supabaseClient.from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .limit(1)
    );

    currentProfile=profiles[0];

    if(!currentProfile ||
       currentProfile.role!=="parent" ||
       currentProfile.is_active===false){
      showMessage("Access denied. Parent account is required.");
      await supabaseClient.auth.signOut();
      window.location.href="login.html";
      return;
    }

    const parents=await sq(
      supabaseClient.from("parents")
        .select("*")
        .eq("profile_id",currentUser.id)
        .limit(1)
    );

    currentParent=parents[0];

    if(!currentParent){
      setPage("Parent Account",`
        <div class="panel">
          <h3>Parent Profile Not Found</h3>
          <p>Your login is valid, but your parent profile has not been linked.</p>
          <p>Please contact GAAWOW Academy administration.</p>
        </div>`);
      return;
    }

    children=await loadChildren();
    selectedChild=children[0]||null;

    $("welcomeText").textContent =
      "Welcome, "+(currentProfile.full_name||"Parent");

    buildMenu();
    await openSection("dashboard");

  }catch(error){
    console.error("Parent portal initialization:",error);
    setPage("Connection Error",`
      <div class="panel">
        <h3>Unable to load Parent Portal</h3>
        <p>${escapeHTML(error.message||"Please try again.")}</p>
        <button class="btn btn-primary" onclick="initialize()">Try Again</button>
      </div>`);
  }
}

/* DASHBOARD */
async function openDashboard(){
  if(!selectedChild){
    setPage("Parent Dashboard",`
      <div class="panel">
        <h3>No Student Linked</h3>
        <p>Your parent account does not currently have a linked student.</p>
        <p>Please contact GAAWOW Academy administration.</p>
      </div>`);
    return;
  }

  const studentId=getChildId();

  let attendanceCount=0,gradeCount=0,invoiceCount=0,certificateCount=0;

  try{
    const attendance=await sq(
      supabaseClient.from("attendance")
        .select("id")
        .eq("student_id",studentId)
        .eq("is_published",true)
    );
    attendanceCount=attendance.length;
  }catch(e){console.warn(e.message)}

  try{
    const grades=await sq(
      supabaseClient.from("grades")
        .select("id")
        .eq("student_id",studentId)
    );
    gradeCount=grades.length;
  }catch(e){console.warn(e.message)}

  try{
    const invoices=await sq(
      supabaseClient.from("invoices")
        .select("id")
        .eq("student_id",studentId)
    );
    invoiceCount=invoices.length;
  }catch(e){console.warn(e.message)}

  try{
    const certificates=await sq(
      supabaseClient.from("certificates")
        .select("id")
        .eq("student_id",studentId)
    );
    certificateCount=certificates.length;
  }catch(e){console.warn(e.message)}

  setPage("Parent Dashboard",`
    ${childSelector()}
    <div class="grid">
      <div class="stat"><div class="icon">👨‍🎓</div><h3>${children.length}</h3><p>Linked Children</p></div>
      <div class="stat"><div class="icon">📅</div><h3>${attendanceCount}</h3><p>Published Attendance Records</p></div>
      <div class="stat"><div class="icon">🎓</div><h3>${gradeCount}</h3><p>Academic Results</p></div>
      <div class="stat"><div class="icon">📜</div><h3>${certificateCount}</h3><p>Certificates</p></div>
    </div>
    <div class="panel">
      <h3>Student Information</h3>
      <p><strong>Name:</strong> ${escapeHTML(selectedChild.full_name||"")}</p>
      <p><strong>Student ID:</strong> ${escapeHTML(selectedChild.student_id||selectedChild.admission_number||"")}</p>
      <p><strong>Gender:</strong> ${escapeHTML(selectedChild.gender||"Not available")}</p>
      <p><strong>Phone:</strong> ${escapeHTML(selectedChild.phone||"Not available")}</p>
    </div>
    <div class="notice">
      Attendance records shown in this portal are published records only.
      For support, use the WhatsApp Communication section.
    </div>
  `);
}

/* CHILDREN */
function openChildren(){
  const rows=children.map(c=>[
    escapeHTML(c.full_name||""),
    escapeHTML(c.student_id||c.admission_number||""),
    escapeHTML(c.gender||""),
    escapeHTML(c.phone||"")
  ]);
  setPage("My Children",`
    <div class="panel">
      <h3>Students Linked to Your Parent Account</h3>
      ${tableHTML(["Student Name","Student ID","Gender","Phone"],rows)}
    </div>`);
}

/* GENERIC STUDENT TABLES */
async function loadStudentTable(config){
  if(!selectedChild){
    setPage(config.title,`<div class="panel"><div class="empty">No linked student found.</div></div>`);
    return;
  }

  setPage(config.title,`<div class="loading">Loading ${escapeHTML(config.title)}...</div>`);

  try{
    let query=supabaseClient.from(config.table).select("*")
      .eq("student_id",getChildId());

    if(config.published) query=query.eq("is_published",true);

    const data=await sq(query);

    const rows=data.map(record=>config.fields.map(field=>{
      const value=record[field];
      if(field==="status"||field==="payment_status"){
        return statusBadge(value);
      }
      return escapeHTML(value??"");
    }));

    setPage(config.title,`
      ${childSelector()}
      <div class="panel">
        <h3>${escapeHTML(config.title)}</h3>
        ${tableHTML(config.headers,rows)}
      </div>`);
  }catch(error){
    console.error(config.title,error);
    setPage(config.title,`
      <div class="panel">
        <h3>${escapeHTML(config.title)}</h3>
        <div class="empty">Unable to load records: ${escapeHTML(error.message)}</div>
      </div>`);
  }
}

/* INSTITUTION */
async function openInstitution(){
  if(!selectedChild){
    setPage("Institution",`<div class="panel empty">No student linked.</div>`);
    return;
  }

  try{
    const institutionId=selectedChild.institution_id;
    if(!institutionId) throw new Error("Institution information is unavailable.");

    const rows=await sq(
      supabaseClient.from("institutions")
        .select("*").eq("id",institutionId).limit(1)
    );
    const institution=rows[0];
    if(!institution) throw new Error("Institution not found.");

    setPage("Institution",`
      <div class="panel">
        <h3>${escapeHTML(institution.name||"GAAWOW Academy")}</h3>
        <p><strong>Institution Code:</strong> ${escapeHTML(institution.code||"")}</p>
        <p><strong>Location:</strong> ${escapeHTML(institution.address||institution.location||"")}</p>
        <p><strong>Phone:</strong> ${escapeHTML(institution.phone||"")}</p>
        <p><strong>Email:</strong> ${escapeHTML(institution.email||"")}</p>
      </div>`);
  }catch(error){
    setPage("Institution",`<div class="panel"><div class="empty">${escapeHTML(error.message)}</div></div>`);
  }
}

/* WHATSAPP COMMUNICATION SYSTEM */
let selectedWACategory="Parent Support";

function openWhatsApp(){
  setPage("WhatsApp Communication",`
    <div class="whatsapp-panel">
      <div class="wa-header">
        <div class="wa-logo">💬</div>
        <div>
          <h2>GAAWOW EMS WhatsApp Communication</h2>
          <p>Direct communication with GAAWOW Academy</p>
        </div>
      </div>

      <div class="notice">
        Use this service to contact the academy about student support,
        attendance, announcements and academic results.
      </div>

      <div style="margin-top:18px">
        ${childSelector()}
      </div>

      <h3 style="font-size:14px;color:#166534">Choose Message Category</h3>

      <div class="wa-grid">
        <button class="wa-card selected" id="wa-support" onclick="selectWACategory('Parent Support')">
          <div class="wa-icon">🆘</div>
          <strong>Parent Support</strong>
          <small>General questions and assistance</small>
        </button>

        <button class="wa-card" id="wa-attendance" onclick="selectWACategory('Attendance')">
          <div class="wa-icon">📅</div>
          <strong>Attendance</strong>
          <small>Ask about student attendance</small>
        </button>

        <button class="wa-card" id="wa-announcements" onclick="selectWACategory('Announcements')">
          <div class="wa-icon">📢</div>
          <strong>Announcements</strong>
          <small>School notices and information</small>
        </button>

        <button class="wa-card" id="wa-results" onclick="selectWACategory('Results')">
          <div class="wa-icon">🎓</div>
          <strong>Academic Results</strong>
          <small>Questions about grades and exams</small>
        </button>
      </div>

      <div class="form-group">
        <label>Your Message</label>
        <textarea id="waMessage" class="field" rows="5"
          placeholder="Write your message to GAAWOW Academy..."></textarea>
      </div>

      <button class="wa-send" onclick="sendWhatsAppMessage()">
        <span>💬</span> Continue to WhatsApp
      </button>

      <div class="wa-note">
        <strong>Important:</strong> This button opens WhatsApp with your message
        prepared. Review the message and press Send inside WhatsApp.
        Your message is not sent automatically by this portal.
      </div>
    </div>
  `);
}

function selectWACategory(category){
  selectedWACategory=category;

  document.querySelectorAll(".wa-card").forEach(card=>{
    card.classList.remove("selected");
  });

  const map={
    "Parent Support":"wa-support",
    "Attendance":"wa-attendance",
    "Announcements":"wa-announcements",
    "Results":"wa-results"
  };

  const selected=$(map[category]);
  if(selected) selected.classList.add("selected");
}

function sendWhatsAppMessage(){
  if(!currentParent){
    showMessage("Parent account is not available.");
    return;
  }

  const messageText=$("waMessage")?.value.trim()||"";

  if(!messageText){
    showMessage("Fadlan marka hore qor fariintaada.");
    $("waMessage")?.focus();
    return;
  }

  const parentName=currentProfile?.full_name||"Parent";
  const studentName=selectedChild?.full_name||"Not selected";
  const studentCode=selectedChild?.student_id||selectedChild?.admission_number||"Not available";

  const message=
`GAAWOW ACADEMY
GAAWOW EMS PARENT COMMUNICATION

Category: ${selectedWACategory}

Parent Name: ${parentName}
Student Name: ${studentName}
Student ID: ${studentCode}

Message:
${messageText}

Sent via GAAWOW EMS Parent Portal.`;

  const url="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message);

  window.open(url,"_blank","noopener,noreferrer");
}

/* SECTION ROUTER */
async function openSection(section){
  currentSection=section;
  buildMenu();

  switch(section){
    case "dashboard":
      await openDashboard();
      break;

    case "children":
      openChildren();
      break;

    case "institution":
      await openInstitution();
      break;

    case "courses":
      await loadStudentTable({
        title:"Courses",table:"enrollments",
        headers:["Course","Status","Start Date","End Date"],
        fields:["course_name","status","start_date","end_date"]
      });
      break;

    case "classes":
      await loadStudentTable({
        title:"Classes",table:"enrollments",
        headers:["Class","Status","Start Date"],
        fields:["class_name","status","start_date"]
      });
      break;

    case "subjects":
      await loadStudentTable({
        title:"Subjects",table:"grades",
        headers:["Subject","Score","Grade","Status"],
        fields:["subject_name","score","grade","status"]
      });
      break;

    case "lessons":
      await loadStudentTable({
        title:"Lessons",table:"lessons",
        headers:["Lesson","Description","Date"],
        fields:["title","description","created_at"]
      });
      break;

    case "attendance":
      await loadStudentTable({
        title:"Published Attendance",table:"attendance",
        headers:["Date","Subject","Status","Remarks"],
        fields:["attendance_date","subject_name","status","remarks"],
        published:true
      });
      break;

    case "exams":
      await loadStudentTable({
        title:"Exams",table:"exams",
        headers:["Exam","Subject","Date","Status"],
        fields:["title","subject_name","exam_date","status"]
      });
      break;

    case "grades":
      await loadStudentTable({
        title:"Academic Results",table:"grades",
        headers:["Subject","Score","Grade","Remarks"],
        fields:["subject_name","score","grade","remarks"]
      });
      break;

    case "progress":
      await loadStudentTable({
        title:"Academic Progress",table:"academic_progress",
        headers:["Title","Description","Status","Date"],
        fields:["title","description","status","created_at"]
      });
      break;

    case "certificates":
      await loadStudentTable({
        title:"Certificates",table:"certificates",
        headers:["Certificate Number","Course","Type","Status"],
        fields:["certificate_number","course_name","certificate_type","status"]
      });
      break;

    case "invoices":
      await loadStudentTable({
        title:"Invoices",table:"invoices",
        headers:["Invoice Number","Amount","Currency","Status"],
        fields:["invoice_number","amount","currency","status"]
      });
      break;

    case "payments":
      await loadStudentTable({
        title:"Payments",table:"payments",
        headers:["Reference","Amount","Payment Method","Status"],
        fields:["transaction_reference","amount","payment_method","status"]
      });
      break;

    case "whatsapp":
      openWhatsApp();
      break;

    default:
      await openDashboard();
  }
}

async function refreshCurrent(){
  cache={};
  await openSection(currentSection);
}

async function logout(){
  const confirmed=confirm("Ma hubtaa inaad ka baxdo Parent Portal?");
  if(!confirmed) return;

  await supabaseClient.auth.signOut();
  window.location.href="login.html";
}

$("year").textContent=new Date().getFullYear();

/* START APPLICATION */
initialize();
</script>
