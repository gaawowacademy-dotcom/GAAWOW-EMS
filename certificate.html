<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAAWOW EMS — Certificate V6</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:Arial;color:#1F2937}
.page{max-width:1450px;margin:auto;padding:25px}.head{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;padding:22px;border-radius:18px;display:flex;gap:15px;align-items:center}.head img{width:65px;height:65px;object-fit:contain;background:#fff;border-radius:12px;padding:5px}.head h1{margin:0}.panel{background:#fff;padding:24px;margin-top:20px;border-radius:18px;box-shadow:0 10px 35px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:bold;color:#0B1E63}.field input,.field select{padding:12px;border:1px solid #d8dee8;border-radius:9px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{border:0;padding:12px 17px;border-radius:9px;font-weight:bold;cursor:pointer}.gen{background:#D4AF37;color:#0B1E63}.pre{background:#0B4DA2;color:white}.save{background:#16A34A;color:white}.down{background:#D4AF37}.print{background:#0B1E63;color:white}.new{background:#eee}.msg{margin-top:15px;padding:12px;border-radius:8px}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#991b1b}#sheet{width:1200px;height:820px;max-width:100%;margin:25px auto;background:white;border:15px solid #0B1E63;overflow:hidden;position:relative}.cert{height:100%;margin:15px;border:5px solid #D4AF37;position:relative;overflow:hidden}.wm{position:absolute;font:900 570px Georgia;color:#0B1E6308;left:430px;top:80px}.corner{position:absolute;width:130px;height:130px;border:10px solid transparent}.tl{top:-5px;left:-5px;border-top-color:#D4AF37;border-left-color:#0B4DA2}.tr{top:-5px;right:-5px;border-top-color:#0B4DA2;border-right-color:#D4AF37}.bl{bottom:-5px;left:-5px;border-bottom-color:#0B4DA2;border-left-color:#D4AF37}.br{bottom:-5px;right:-5px;border-bottom-color:#D4AF37;border-right-color:#0B4DA2}.left{position:absolute;left:45px;top:65px;width:205px}.photo{width:175px;height:215px;border:4px solid #D4AF37;padding:5px;margin:auto}.photo img{width:100%;height:100%;object-fit:cover}.meta{margin-top:12px;font-size:11px;color:#0B1E63}.meta b{display:block;color:#D4AF37;font-size:8px}.center{position:absolute;left:270px;right:215px;top:35px;text-align:center}.logo{width:88px;height:88px;object-fit:contain}.academy{font:900 25px Georgia;color:#0B1E63;letter-spacing:2px}.motto{color:#D4AF37;font-weight:bold;font-size:12px}.title{font:900 43px Georgia;color:#0B1E63;letter-spacing:5px;margin-top:32px}.sub{color:#D4AF37;font-weight:bold;letter-spacing:4px}.present{margin-top:25px;color:#777;font-size:12px}.student{font:900 34px Georgia;color:#0B1E63;border-bottom:2px solid #D4AF37;padding:10px}.text{margin:14px auto 7px;max-width:500px;font-size:12px;line-height:1.5}.course{font:900 23px Georgia;color:#0B4DA2}.location{margin-top:14px;font-size:11px;color:#777}.id{font-size:9px;color:#777;margin-top:9px}.right{position:absolute;right:38px;top:100px;width:150px;text-align:center;color:#0B1E63}.verify{font-size:17px;letter-spacing:2px}.qr{width:125px;height:125px;display:block;margin:12px auto;border:3px solid #D4AF37;padding:5px}.right small{display:block;color:#777;font-size:9px;margin-top:7px}.signatures{position:absolute;bottom:65px;left:55px;right:55px;display:grid;grid-template-columns:1fr 110px 1fr;gap:30px;text-align:center;align-items:end;color:#0B1E63;font-size:9px}.line{height:1px;background:#0B1E63;margin-bottom:7px}.signatures small{display:block;color:#777}.seal{width:88px;height:88px;border:4px double #D4AF37;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold}.footer{position:absolute;bottom:18px;left:55px;right:55px;border-top:1px solid #0B1E6333;padding-top:5px;text-align:center;font-size:7px;color:#777}
@media(max-width:800px){.grid{grid-template-columns:1fr}#sheet{transform-origin:top left}.actions{gap:6px}}
@media print{body{background:#fff}.head,.panel,.page>h2{display:none!important}#sheet{margin:0;max-width:none;box-shadow:none}@page{size:landscape;margin:0}}
</style>
</head>
<body>
<div class="page">
<div class="head"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><div><h1>GAAWOW EMS — Certificate Generator V6</h1><div>Education Management & Verification System</div></div></div>
<div class="panel">
<div class="grid">
<div class="field"><label>Select Registered Student</label><select id="student_select"><option>Loading students...</option></select></div>
<div class="field"><label>Student Name</label><input id="student_name"></div>
<div class="field"><label>Student ID</label><input id="student_id"></div>
<div class="field"><label>Course</label><input id="course_name" placeholder="Course name"></div>
<div class="field"><label>Certificate ID</label><input id="certificate_id" readonly></div>
<div class="field"><label>Certificate No.</label><input id="certificate_no" readonly></div>
<div class="field"><label>Verify Code</label><input id="verify_code" readonly></div>
<div class="field"><label>Date Started</label><input id="start_date" type="date"></div>
<div class="field"><label>Date Completed</label><input id="completion_date" type="date"></div>
<div class="field"><label>Date Issued</label><input id="issue_date" type="date"></div>
<div class="field"><label>Status</label><select id="status"><option>GRADUATED</option><option selected>COMPLETED</option><option>VALID</option></select></div>
<div class="field"><label>Student Photo URL</label><input id="photo_url"></div>
<div class="field"><label>Director Name</label><input id="director_name" placeholder="Enter director name"></div>
<div class="field"><label>Authorized Signatory Name</label><input id="signatory_name" placeholder="Enter signatory name"></div>
</div>
<div class="actions">
<button class="gen" id="generateBtn">🎓 Generate Certificate</button>
<button class="pre" id="previewBtn">👁 Preview</button>
<button class="save" id="saveBtn">💾 Save Supabase</button>
<button class="down" id="downloadBtn">⬇ Download HD PNG</button>
<button class="print" id="printBtn">🖨 Print / PDF</button>
<button class="new" id="newBtn">＋ New</button>
</div>
<div id="msg"></div>
</div>
<h2>Certificate Preview</h2><div id="sheet"></div>
</div>
<script src="./certificate.js"></script>
</body>
</html>
