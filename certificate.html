<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAAWOW EMS — Certificates</title>

<style>
:root{
  --blue:#0B4DA2; --navy:#0B1E63; --gold:#D4AF37; --white:#F5F7FA;
  --dark:#1F2937; --green:#16A34A; --red:#DC2626; --border:#dbe3ef;
  --shadow:0 8px 25px rgba(11,30,99,.10); --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--white);color:var(--dark)}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:15px 22px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.header-inner{max-width:1450px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
.brand h1{margin:0;font-size:20px}
.brand p{margin:4px 0 0;color:#f4d97a;font-size:12px;font-weight:bold}
.dashboard-link{text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.35);padding:9px 14px;border-radius:10px;font-weight:bold;white-space:nowrap}
.dashboard-link:hover{background:rgba(255,255,255,.12)}
main{max-width:1450px;margin:22px auto;padding:0 18px 40px}
.message{display:none;padding:12px 15px;border-radius:12px;margin-bottom:16px;font-weight:bold;line-height:1.5}
.message.success{display:block;background:#dcfce7;color:#166534;border:1px solid #86efac}
.message.error{display:block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.message.info{display:block;background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-title{font-size:12px;color:#64748b;font-weight:bold;text-transform:uppercase}
.stat-value{margin-top:6px;font-size:26px;font-weight:800;color:var(--navy)}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-header h2{margin:0;color:var(--navy);font-size:18px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer;font:inherit}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
.btn-secondary{background:#e2e8f0;color:#334155;text-decoration:none;display:inline-flex;align-items:center;padding:10px 13px;border-radius:10px}
.btn-small{padding:6px 9px;font-size:12px;border-radius:8px}
.toolbar{padding:14px 18px;display:grid;grid-template-columns:1fr 170px auto;gap:10px;border-bottom:1px solid var(--border)}
.toolbar input,.toolbar select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;font:inherit}
.toolbar button{background:var(--gold);color:#172554}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:11px 10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;vertical-align:middle}
th{background:#f8fafc;color:var(--navy);font-weight:800;white-space:nowrap}
tbody tr:hover{background:#f8fbff}
.sub{font-size:11px;color:#64748b;margin-top:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.status-valid,.status-graduated{background:#dcfce7;color:#166534}
.status-pending{background:#fef3c7;color:#92400e}
.status-expired{background:#f1f5f9;color:#475569}
.status-revoked{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.action-view{background:#dbeafe;color:#1e40af}
.action-regen{background:#fef3c7;color:#92400e}
.action-verify{background:#e2e8f0;color:#334155}
.empty{padding:32px 15px;text-align:center;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:1000;padding:20px;overflow:auto}
.modal.show{display:flex;align-items:center;justify-content:center}
.modal-box{width:min(650px,100%);background:#fff;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.25);overflow:hidden}
.modal-header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{margin:0}
.modal-close{background:transparent;color:#fff;font-size:24px;padding:0 5px}
.profile{padding:20px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-item{background:#f8fafc;border-radius:10px;padding:12px}
.profile-item strong{display:block;color:#64748b;font-size:11px;text-transform:uppercase;margin-bottom:4px}
.profile-item span{color:#1e293b;font-weight:600;word-break:break-word}
.modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
footer{text-align:center;color:#64748b;font-size:12px;margin-top:22px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){
  header{padding:12px} .brand h1{font-size:16px} .brand img{width:44px;height:44px}
  main{margin-top:14px;padding:0 10px 30px} .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:13px} .stat-value{font-size:22px}
  .toolbar{grid-template-columns:1fr} .profile-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png" alt="GAAWOW Academy Logo">
      <div>
        <h1>GAAWOW EMS — Certificates</h1>
        <p>Ilayska Aqoonta iyo Xirfadda</p>
      </div>
    </div>
    <a class="dashboard-link" href="dashboard.html">← Dashboard</a>
  </div>
</header>

<main>
  <div id="message" class="message"></div>

  <section class="stats">
    <div class="stat-card"><div class="stat-title">Total Certificates</div><div id="totalCerts" class="stat-value">0</div></div>
    <div class="stat-card"><div class="stat-title">Valid</div><div id="validCerts" class="stat-value">0</div></div>
    <div class="stat-card"><div class="stat-title">Expired</div><div id="expiredCerts" class="stat-value">0</div></div>
    <div class="stat-card"><div class="stat-title">Revoked</div><div id="revokedCerts" class="stat-value">0</div></div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2>Issued Certificates</h2>
      <button id="newCertBtn" type="button" class="btn-primary">+ New Certificate</button>
    </div>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search student, course, certificate no, verify code...">
      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="valid">Valid</option>
        <option value="graduated">Graduated</option>
        <option value="pending">Pending</option>
        <option value="expired">Expired</option>
        <option value="revoked">Revoked</option>
      </select>
      <button id="refreshBtn" type="button">↻ Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Certificate</th>
            <th>Student</th>
            <th>Course</th>
            <th>Issued</th>
            <th>Status</th>
            <th>Verify Code</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="certTableBody">
          <tr><td colspan="7" class="empty">Loading certificates...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <footer>GAAWOW EMS — GAAWOW Academy • Burhakaba, Bay, Somalia</footer>
</main>

<div id="certModal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Certificate Details</h3>
      <button id="closeCertModal" type="button" class="modal-close">×</button>
    </div>
    <div id="certModalContent" class="profile"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="certificates.js?v=100"></script>
</body>
</html>
