<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW EMS — Certificate Generator V8</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f7fa;
      color:#1f2937;
    }

    .topbar{
      height:64px;
      background:linear-gradient(135deg,#0B1E63,#0B4DA2);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      box-shadow:0 3px 10px rgba(0,0,0,.15);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:42px;
      height:42px;
      object-fit:contain;
    }

    .brand-title{
      font-size:19px;
      font-weight:800;
    }

    .brand-subtitle{
      font-size:11px;
      opacity:.85;
    }

    .back-btn{
      border:0;
      background:rgba(255,255,255,.12);
      color:#fff;
      padding:10px 15px;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }

    .main{
      display:grid;
      grid-template-columns:360px 1fr;
      min-height:calc(100vh - 64px);
    }

    .panel{
      background:#fff;
      padding:20px;
      border-right:1px solid #ddd;
      overflow-y:auto;
    }

    .panel h2{
      margin:0 0 4px;
      color:#0B1E63;
      font-size:20px;
    }

    .panel-subtitle{
      color:#6b7280;
      font-size:12px;
      margin-bottom:18px;
    }

    .section-title{
      margin:20px 0 10px;
      padding-bottom:7px;
      border-bottom:1px solid #e5e7eb;
      color:#0B1E63;
      font-size:13px;
      font-weight:800;
      text-transform:uppercase;
    }

    .field{
      margin-bottom:12px;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:700;
      color:#374151;
      margin-bottom:5px;
    }

    .field input,
    .field select{
      width:100%;
      padding:10px 11px;
      border:1px solid #d1d5db;
      border-radius:7px;
      background:#fff;
      color:#111827;
      outline:none;
      font-size:13px;
    }

    .field input:focus,
    .field select:focus{
      border-color:#0B4DA2;
      box-shadow:0 0 0 2px rgba(11,77,162,.1);
    }

    .field input[readonly]{
      background:#f3f4f6;
    }

    .photo-preview{
      display:none;
      width:82px;
      height:82px;
      object-fit:cover;
      border-radius:50%;
      border:2px solid #D4AF37;
      margin:8px auto 15px;
    }

    .buttons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:18px;
    }

    .btn{
      border:0;
      padding:11px 8px;
      border-radius:7px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
    }

    .btn-primary{
      background:#0B4DA2;
      color:#fff;
    }

    .btn-gold{
      background:#D4AF37;
      color:#111827;
    }

    .btn-dark{
      background:#0B1E63;
      color:#fff;
    }

    .btn-light{
      background:#e5e7eb;
      color:#111827;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .message{
      display:none;
      margin-top:14px;
      padding:10px;
      border-radius:7px;
      font-size:12px;
      font-weight:600;
    }

    .message.success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .message.error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .message.info{
      display:block;
      background:#dbeafe;
      color:#1e40af;
    }

    .stage{
      background:
        radial-gradient(
          circle at center,
          rgba(11,77,162,.08),
          transparent 40%
        ),
        #eef2f7;

      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:28px;
      overflow:auto;
    }

    .preview-shell{
      width:min(100%,1536px);
      background:#fff;
      box-shadow:0 10px 35px rgba(0,0,0,.20);
      line-height:0;
    }

    #certificateCanvas{
      display:block;
      width:100%;
      height:auto;
      background:#fff;
    }

    .hint{
      margin-top:10px;
      color:#6b7280;
      font-size:11px;
      line-height:1.45;
    }

    @media(max-width:900px){

      .main{
        display:block;
      }

      .panel{
        border-right:0;
        border-bottom:1px solid #ddd;
      }

      .stage{
        padding:15px;
      }
    }

    @media print{

      @page{
        size:A4 landscape;
        margin:0;
      }

      body{
        background:#fff;
      }

      .topbar,
      .panel{
        display:none!important;
      }

      .main{
        display:block;
        min-height:0;
      }

      .stage{
        padding:0;
        background:#fff;
      }

      .preview-shell{
        width:100%;
        box-shadow:none;
      }

      #certificateCanvas{
        width:100%;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <img
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy"
    >

    <div>
      <div class="brand-title">GAAWOW EMS</div>
      <div class="brand-subtitle">
        Certificate Generator — V8
      </div>
    </div>

  </div>

  <button
    type="button"
    class="back-btn"
    id="backDashboardBtn"
  >
    ← Back to Dashboard
  </button>

</header>


<main class="main">

  <!-- =========================
       LEFT CONTROL PANEL
       ========================= -->

  <section class="panel">

    <h2>Certificate Generator</h2>

    <div class="panel-subtitle">
      Student → Course → Enrollment → Certificate
    </div>


    <!-- INSTITUTION -->

    <div class="section-title">
      Institution
    </div>

    <div class="field">

      <label for="institutionSelect">
        Select Institution
      </label>

      <select id="institutionSelect">

        <option value="">
          Loading institutions...
        </option>

      </select>

    </div>


    <!-- STUDENT -->

    <div class="section-title">
      Student
    </div>

    <div class="field">

      <label for="studentSelect">
        Select Student
      </label>

      <select id="studentSelect">

        <option value="">
          Select institution first
        </option>

      </select>

    </div>


    <img
      id="studentPhoto"
      class="photo-preview"
      alt="Student Photo"
    >


    <div class="field">

      <label for="studentFullName">
        Full Name
      </label>

      <input
        id="studentFullName"
        type="text"
        readonly
      >

    </div>


    <div class="field">

      <label for="studentId">
        Student ID
      </label>

      <input
        id="studentId"
        type="text"
        readonly
      >

    </div>


    <!-- COURSE / ENROLLMENT -->

    <div class="section-title">
      Course & Enrollment
    </div>


    <div class="field">

      <label for="courseSelect">
        Course
      </label>

      <select id="courseSelect">

        <option value="">
          Select student first
        </option>

      </select>

    </div>


    <div class="field">

      <label for="dateStarted">
        Date Started
      </label>

      <input
        id="dateStarted"
        type="date"
        readonly
      >

    </div>


    <div class="field">

      <label for="dateCompleted">
        Date Completed
      </label>

      <input
        id="dateCompleted"
        type="date"
        readonly
      >

    </div>


    <!-- CERTIFICATE -->

    <div class="section-title">
      Certificate
    </div>


    <div class="field">

      <label for="certificateNo">
        Certificate No
      </label>

      <input
        id="certificateNo"
        type="text"
        readonly
      >

    </div>


    <div class="field">

      <label for="certificateId">
        Certificate ID
      </label>

      <input
        id="certificateId"
        type="text"
        readonly
      >

    </div>


    <div class="field">

      <label for="verifyCode">
        Verify Code
      </label>

      <input
        id="verifyCode"
        type="text"
        readonly
      >

    </div>


    <div class="field">

      <label for="issueDate">
        Date Issued
      </label>

      <input
        id="issueDate"
        type="date"
      >

    </div>


    <div class="field">

      <label for="certificateStatus">
        Status
      </label>

      <select id="certificateStatus">

        <option value="valid">
          VALID
        </option>

        <option value="graduated">
          GRADUATED
        </option>

        <option value="pending">
          PENDING
        </option>

        <option value="expired">
          EXPIRED
        </option>

        <option value="revoked">
          REVOKED
        </option>

      </select>

    </div>


    <!-- SIGNATORIES -->

    <div class="section-title">
      Signatories
    </div>


    <div class="field">

      <label for="directorName">
        Director
      </label>

      <input
        id="directorName"
        type="text"
        value="Abdirahman H. Mohamed"
      >

    </div>


    <div class="field">

      <label for="academicHead">
        Academic Head
      </label>

      <input
        id="academicHead"
        type="text"
        value="Hodan Yusuf"
      >

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

      <button
        type="button"
        class="btn btn-primary"
        id="generateBtn"
      >
        Generate
      </button>


      <button
        type="button"
        class="btn btn-gold"
        id="previewBtn"
      >
        Preview
      </button>


      <button
        type="button"
        class="btn btn-dark"
        id="saveBtn"
      >
        Save Certificate
      </button>


      <button
        type="button"
        class="btn btn-primary"
        id="downloadBtn"
      >
        HD Download
      </button>


      <button
        type="button"
        class="btn btn-light"
        id="printBtn"
      >
        Print A4
      </button>


      <button
        type="button"
        class="btn btn-light"
        id="newBtn"
      >
        New
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div class="hint">

      The original PNG template is used as the certificate
      background. The certificate design is not recreated
      with HTML/CSS.

    </div>

  </section>


  <!-- =========================
       CERTIFICATE PREVIEW
       ========================= -->

  <section class="stage">

    <div class="preview-shell">

      <canvas
        id="certificateCanvas"
        width="1536"
        height="1024"
      ></canvas>

    </div>

  </section>

</main>


<script src="certificate.js?v=8"></script>

</body>
</html>
