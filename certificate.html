<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW EMS — Certificates</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f7fa;
      color:#1f2937;
    }

    .topbar{
      min-height:64px;
      background:linear-gradient(135deg,#0B1E63,#0B4DA2);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 22px;
      box-shadow:0 3px 10px rgba(0,0,0,.15);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:42px;
      height:42px;
      object-fit:contain;
    }

    .brand-title{
      font-size:19px;
      font-weight:800;
    }

    .brand-subtitle{
      font-size:11px;
      opacity:.85;
    }

    .back-btn{
      border:0;
      background:rgba(255,255,255,.12);
      color:#fff;
      padding:10px 15px;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }

    .container{
      padding:24px;
      max-width:1500px;
      margin:auto;
    }

    .page-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .page-head h1{
      margin:0;
      color:#0B1E63;
      font-size:25px;
    }

    .page-head p{
      margin:5px 0 0;
      color:#6b7280;
      font-size:13px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      border-radius:7px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
    }

    .btn-primary{
      background:#0B4DA2;
      color:#fff;
    }

    .btn-gold{
      background:#D4AF37;
      color:#111827;
    }

    .btn-light{
      background:#e5e7eb;
      color:#111827;
    }

    .filters{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:10px;
      padding:15px;
      margin-bottom:18px;
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr;
      gap:10px;
      box-shadow:0 3px 12px rgba(0,0,0,.05);
    }

    .filters input,
    .filters select{
      width:100%;
      padding:10px 11px;
      border:1px solid #d1d5db;
      border-radius:7px;
      background:#fff;
      outline:none;
      font-size:13px;
    }

    .filters input:focus,
    .filters select:focus{
      border-color:#0B4DA2;
      box-shadow:0 0 0 2px rgba(11,77,162,.1);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .stat{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:10px;
      padding:16px;
      box-shadow:0 3px 12px rgba(0,0,0,.05);
    }

    .stat-label{
      font-size:11px;
      color:#6b7280;
      font-weight:700;
      text-transform:uppercase;
    }

    .stat-value{
      margin-top:6px;
      font-size:25px;
      font-weight:800;
      color:#0B1E63;
    }

    .table-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 3px 12px rgba(0,0,0,.05);
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1050px;
    }

    thead{
      background:#0B1E63;
      color:#fff;
    }

    th{
      padding:12px 10px;
      text-align:left;
      font-size:11px;
      text-transform:uppercase;
      white-space:nowrap;
    }

    td{
      padding:12px 10px;
      border-bottom:1px solid #edf0f3;
      font-size:12px;
      vertical-align:middle;
    }

    tbody tr:hover{
      background:#f8fafc;
    }

    .muted{
      color:#6b7280;
    }

    .badge{
      display:inline-block;
      padding:5px 8px;
      border-radius:999px;
      font-size:10px;
      font-weight:800;
    }

    .badge-valid{
      background:#dcfce7;
      color:#166534;
    }

    .badge-graduated{
      background:#dbeafe;
      color:#1e40af;
    }

    .badge-pending{
      background:#fef3c7;
      color:#92400e;
    }

    .badge-expired{
      background:#fee2e2;
      color:#991b1b;
    }

    .badge-revoked{
      background:#e5e7eb;
      color:#374151;
    }

    .row-actions{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
    }

    .small-btn{
      border:0;
      padding:6px 8px;
      border-radius:5px;
      cursor:pointer;
      font-size:10px;
      font-weight:700;
    }

    .small-view{
      background:#dbeafe;
      color:#1e40af;
    }

    .small-verify{
      background:#dcfce7;
      color:#166534;
    }

    .small-delete{
      background:#fee2e2;
      color:#991b1b;
    }

    .empty{
      text-align:center;
      padding:40px 20px;
      color:#6b7280;
      font-size:13px;
    }

    .message{
      display:none;
      margin-bottom:15px;
      padding:11px;
      border-radius:7px;
      font-size:12px;
      font-weight:600;
    }

    .message.success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .message.error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .message.info{
      display:block;
      background:#dbeafe;
      color:#1e40af;
    }

    .loading{
      text-align:center;
      padding:35px;
      color:#6b7280;
      font-size:13px;
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.62);
      z-index:1000;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:min(700px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
    }

    .modal-head{
      background:linear-gradient(135deg,#0B1E63,#0B4DA2);
      color:#fff;
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .modal-head h2{
      margin:0;
      font-size:17px;
    }

    .close-btn{
      border:0;
      background:transparent;
      color:#fff;
      font-size:22px;
      cursor:pointer;
    }

    .modal-body{
      padding:20px;
    }

    .detail-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .detail{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:8px;
      padding:11px;
    }

    .detail-label{
      font-size:10px;
      text-transform:uppercase;
      font-weight:800;
      color:#6b7280;
      margin-bottom:4px;
    }

    .detail-value{
      font-size:13px;
      font-weight:700;
      color:#111827;
      word-break:break-word;
    }

    @media(max-width:900px){

      .filters{
        grid-template-columns:1fr 1fr;
      }

      .stats{
        grid-template-columns:1fr 1fr;
      }

    }

    @media(max-width:600px){

      .container{
        padding:15px;
      }

      .filters{
        grid-template-columns:1fr;
      }

      .stats{
        grid-template-columns:1fr;
      }

      .detail-grid{
        grid-template-columns:1fr;
      }

      .topbar{
        padding:10px 15px;
      }

      .brand-title{
        font-size:16px;
      }

      .back-btn{
        padding:8px 10px;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <img
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy"
    >

    <div>
      <div class="brand-title">
        GAAWOW EMS
      </div>

      <div class="brand-subtitle">
        Certificates Management
      </div>
    </div>

  </div>

  <button
    type="button"
    class="back-btn"
    id="backDashboardBtn"
  >
    ← Back to Dashboard
  </button>

</header>


<main class="container">

  <div class="page-head">

    <div>

      <h1>Certificates</h1>

      <p>
        View, search and manage issued certificates.
      </p>

    </div>

    <div class="actions">

      <button
        type="button"
        class="btn btn-gold"
        id="generateCertificateBtn"
      >
        + Generate Certificate
      </button>

      <button
        type="button"
        class="btn btn-light"
        id="refreshBtn"
      >
        Refresh
      </button>

    </div>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <section class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Certificates
      </div>

      <div
        class="stat-value"
        id="totalCount"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Valid
      </div>

      <div
        class="stat-value"
        id="validCount"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Pending
      </div>

      <div
        class="stat-value"
        id="pendingCount"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Revoked
      </div>

      <div
        class="stat-value"
        id="revokedCount"
      >
        0
      </div>

    </div>

  </section>


  <section class="filters">

    <input
      id="searchInput"
      type="search"
      placeholder="Search certificate no, student, course, verify code..."
    >


    <select id="statusFilter">

      <option value="">
        All Status
      </option>

      <option value="valid">
        Valid
      </option>

      <option value="graduated">
        Graduated
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="expired">
        Expired
      </option>

      <option value="revoked">
        Revoked
      </option>

    </select>


    <select id="institutionFilter">

      <option value="">
        All Institutions
      </option>

    </select>


    <button
      type="button"
      class="btn btn-light"
      id="clearFilterBtn"
    >
      Clear Filters
    </button>

  </section>


  <section class="table-card">

    <div
      id="loading"
      class="loading"
    >
      Loading certificates...
    </div>


    <div class="table-wrap">

      <table id="certificatesTable">

        <thead>

          <tr>

            <th>Certificate No</th>

            <th>Student</th>

            <th>Course</th>

            <th>Institution</th>

            <th>Issue Date</th>

            <th>Status</th>

            <th>Verify Code</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="certificatesBody"></tbody>

      </table>

    </div>

  </section>

</main>


<!-- =========================
     VIEW MODAL
     ========================= -->

<div
  class="modal"
  id="viewModal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Certificate Details
      </h2>

      <button
        type="button"
        class="close-btn"
        id="closeModalBtn"
      >
        ×
      </button>

    </div>


    <div
      class="modal-body"
      id="modalBody"
    ></div>

  </div>

</div>


<script src="certificates.js?v=1"></script>

</body>
</html>
