
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAAWOW EMS — Certificate V3</title><style>
:root{--navy:#0B1E63;--royal:#0B4DA2;--gold:#D4AF37;--cream:#fffdf7;--ink:#172033}
*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;border-radius:16px;padding:13px 18px;display:flex;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;border:2px solid #D4AF37}.brand b{display:block;font-size:18px}.brand small{color:#f6db7b}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;box-shadow:0 7px 24px #0b1e6312}.panel h2{margin:0 0 13px;color:#0B1E63}label{display:block;font-size:12px;font-weight:800;color:#0B1E63;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 13px;border-radius:8px;font-weight:800;background:#0B1E63;color:#fff;cursor:pointer}.btn.gold{background:#D4AF37;color:#0B1E63}.btn.light{background:#e8eef7;color:#0B1E63}.msg{margin:10px 0;padding:9px;border-radius:8px;font-size:12px}.ok{background:#e9f8ef;color:#166534}.err{background:#fdecec;color:#991b1b}.preview{overflow:auto;background:#dce4ee;border-radius:12px;padding:14px}.sheet{width:1200px;min-height:820px;margin:auto;background:#fff;position:relative;box-shadow:0 12px 32px #0002}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sheet{min-width:1000px}}@media print{body{background:#fff}.no-print{display:none!important}.app{padding:0}.layout{display:block}.panel{border:0;box-shadow:none;padding:0}.preview{padding:0;background:#fff}.sheet{box-shadow:none}}

.cert{height:820px;border:11px solid #0B1E63;background:#fffdf7;position:relative;overflow:hidden;padding:25px}.cert:before{content:"";position:absolute;inset:7px;border:2px solid #D4AF37}.arc1{position:absolute;width:410px;height:170px;left:-165px;top:-105px;border:28px solid #0B4DA2;border-right-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(-20deg)}.arc2{position:absolute;width:450px;height:190px;right:-185px;bottom:-120px;border:28px solid #0B1E63;border-left-color:transparent;border-top-color:transparent;border-radius:50%;transform:rotate(-20deg)}.water{position:absolute;left:42%;top:40%;font:900 250px Georgia;color:#0b1e6308}.inner{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:260px 1fr 210px;gap:18px}.left{padding:130px 8px 0}.photo{width:190px;height:190px;border-radius:50%;object-fit:cover;border:4px solid #D4AF37;display:block;margin:auto}.photoLabel{margin:-4px auto 13px;width:190px;text-align:center;background:#0B1E63;color:#fff;font-weight:900;padding:8px}.meta{border-bottom:1px solid #d4af3760;padding:9px 4px}.meta b{display:block;font-size:11px;color:#0B1E63}.meta span{font-size:13px}.center{text-align:center;padding-top:20px}.logo{width:82px;height:82px;object-fit:contain}.academy{font-weight:900;letter-spacing:3px;color:#0B1E63;font-size:25px}.motto{color:#b48312;font-weight:800;font-size:14px}.title{font:900 58px Georgia;color:#0B1E63;letter-spacing:3px;margin-top:28px}.subtitle{font:30px Georgia;color:#b48312;letter-spacing:4px;font-weight:700}.line{height:2px;background:#D4AF37;width:62%;margin:9px auto 22px}.this{font-weight:900;color:#0B1E63}.name{font:italic 49px Georgia;color:#0B1E63;margin:16px 0 7px;border-bottom:2px solid #D4AF37;display:inline-block;padding:0 28px 9px}.course{font:900 27px Georgia;color:#0B1E63;margin:14px}.body{font-size:15px;line-height:1.55}.right{padding-top:315px;text-align:center}.qrbox{border:2px solid #D4AF37;padding:9px;background:#fff}.qr{width:165px;height:165px;object-fit:contain}.verify{background:#0B1E63;color:#fff;font-weight:900;padding:8px;border-radius:8px;margin-top:7px}.url{font-size:11px;margin-top:10px;color:#0B1E63;word-break:break-all}.inst{font-size:11px;line-height:1.45;margin-top:18px}.bottom{position:absolute;left:275px;right:230px;bottom:55px;display:flex;align-items:flex-end;justify-content:space-around;text-align:center}.sig{width:205px;border-top:1px solid #64748b;padding-top:5px;font-size:12px}.signame{font:italic 24px cursive;color:#0B4DA2}.seal{width:105px;height:105px;border:5px double #D4AF37;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#0B1E63;font-size:10px;font-weight:900;background:#fff}.footer{position:absolute;z-index:4;left:25px;right:25px;bottom:8px;border-top:2px solid #D4AF37;padding:7px;text-align:center;font-size:10px;color:#fff;background:#0B1E63;height:31px}
</style></head><body><div class="app"><header class="top no-print"><div class="brand"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><div><b>GAAWOW EMS — Certificate Generator V3</b><small>HD Certificate • Supabase • Verification</small></div></div></header>
<div class="layout"><section class="panel no-print"><h2>Certificate Data</h2><div id="msg"></div>
<label>Student Name</label><input id="student_name" value="Student Name Here"><label>Student ID</label><input id="student_id" value="GA_2026_000001_A7F92C"><label>Certificate ID</label><input id="certificate_id" value="CERT_GA_2026_000001_X8M5Q2"><label>Certificate No.</label><input id="certificate_no" value="GA-C-2026-0001-4F7B2A"><label>Verify / Hash Code</label><input id="verify_code" value="4F7B2A"><label>Course</label><input id="course_name" value="Course Name Here"><label>Date Started</label><input id="start_date" type="date" value="2026-01-01"><label>Date Completed</label><input id="completion_date" type="date" value="2026-06-15"><label>Date Issued</label><input id="issue_date" type="date" value="2026-09-17"><label>Status</label><select id="status"><option>GRADUATED</option><option>COMPLETED</option><option>VALID</option></select><label>Student Photo URL</label><input id="photo_url" placeholder="Optional image URL">
<div class="actions"><button class="btn" onclick="render()">Preview</button><button class="btn gold" onclick="window.print()">Print / PDF</button><button class="btn light" onclick="saveCertificate()">Save Supabase</button></div><div class="actions"><button class="btn light" onclick="location.href='diploma.html'">Diploma</button><button class="btn light" onclick="location.href='authentication-letter.html'">Authentication</button></div></section>
<section class="panel"><div class="preview"><div class="sheet" id="sheet"></div></div></section></div></div><script src="certificate.js"></script><script>
const $=id=>document.getElementById(id),esc=gaawowEscape,fmt=gaawowDate;
function val(){return Object.fromEntries(["student_name","student_id","certificate_id","certificate_no","verify_code","course_name","start_date","completion_date","issue_date","status","photo_url"].map(k=>[k,$(k).value]))}
function meta(a,b){return `<div class="meta"><b>${a}</b><span>${esc(b)}</span></div>`}
function render(){let x=val(),p=x.photo_url||GAAWOW_CONFIG.LOGO_URL,q=gaawowQR(GAAWOW_CONFIG.VERIFY_URL+"?code="+encodeURIComponent(x.verify_code));$("sheet").innerHTML=`<div class="cert"><div class="arc1"></div><div class="arc2"></div><div class="water">G</div><div class="inner"><div class="left"><img class="photo" src="${esc(p)}" onerror="this.src=GAAWOW_CONFIG.LOGO_URL"><div class="photoLabel">STUDENT PHOTO</div>${meta("STUDENT ID",x.student_id)}${meta("CERTIFICATE ID",x.certificate_id)}${meta("COURSE",x.course_name)}${meta("DATE STARTED",fmt(x.start_date))}${meta("DATE COMPLETED",fmt(x.completion_date))}${meta("DATE ISSUED",fmt(x.issue_date))}${meta("STATUS",x.status)}</div><div class="center"><img class="logo" src="${GAAWOW_CONFIG.LOGO_URL}"><div class="academy">GAAWOW ACADEMY</div><div class="motto">Ilayska Aqoonta iyo Xirfadda</div><div class="title">CERTIFICATE</div><div class="subtitle">OF COMPLETION</div><div class="line"></div><div class="this">THIS IS TO CERTIFY THAT</div><div class="name">${esc(x.student_name)}</div><div class="body">has successfully completed the training program in</div><div class="course">${esc(x.course_name)}</div><div class="body">with dedication and excellence.<br>We congratulate them on this achievement.</div></div><div class="right"><div class="qrbox"><img class="qr" src="${q}"></div><div class="verify">VERIFY CERTIFICATE</div><div class="url">${GAAWOW_CONFIG.VERIFY_URL}</div><div class="inst">Scan QR code or visit the link above to verify the authenticity of this certificate.</div></div><div class="bottom"><div class="sig"><div class="signame">Abdirahman H. Mohamed</div><b>DIRECTOR</b><br>Gaawow Academy</div><div class="seal">GAAWOW<br>ACADEMY<br>OFFICIAL<br>SEAL</div><div class="sig"><div class="signame">Hodan Yusuf</div><b>ACADEMIC HEAD</b><br>Gaawow Academy</div></div></div><div class="footer">Bur Hakaba, Bay, Somalia • +252 615 228824 / 625 228824 • www.gaawowacademy.so • info@gaawowacademy.so</div></div>`}
async function saveCertificate(){let x=val();try{await gaawowSaveCertificate({certificate_no:x.certificate_no,certificate_id:x.certificate_id,verify_code:x.verify_code,student_name:x.student_name,course_name:x.course_name,issue_date:x.issue_date,expiry_date:null,status:x.status.toLowerCase()});$("msg").innerHTML='<div class="msg ok">Certificate saved successfully.</div>'}catch(e){$("msg").innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
render();
</script></body></html>
