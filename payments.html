<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW EMS — Payments</title>

  <link rel="icon" type="image/png"
    href="https://i.ibb.co/4ZCRpm30/gaawow-logo.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --blue:#0B4DA2;
      --navy:#0B1E63;
      --gold:#D4AF37;
      --bg:#F5F7FA;
      --text:#1F2937;
      --green:#16A34A;
      --red:#DC2626;
      --white:#fff;
      --border:#e5e7eb;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      background:linear-gradient(135deg,var(--navy),var(--blue));
      color:white;
      padding:16px 20px;
      box-shadow:0 4px 15px rgba(0,0,0,.15);
    }

    .header-inner{
      max-width:1400px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand img{
      width:55px;
      height:55px;
      object-fit:contain;
      background:white;
      padding:4px;
      border-radius:10px;
    }

    .brand h1{
      font-size:21px;
    }

    .brand p{
      font-size:12px;
      opacity:.85;
      margin-top:3px;
    }

    .back-btn{
      background:rgba(255,255,255,.12);
      color:white;
      border:1px solid rgba(255,255,255,.4);
      border-radius:8px;
      padding:10px 15px;
      cursor:pointer;
      font-weight:bold;
    }

    .container{
      max-width:1400px;
      margin:25px auto;
      padding:0 16px;
    }

    .title{
      margin-bottom:20px;
    }

    .title h2{
      color:var(--navy);
      font-size:28px;
    }

    .title p{
      color:#6b7280;
      margin-top:5px;
    }

    .message{
      display:none;
      padding:12px 14px;
      border-radius:8px;
      margin-bottom:15px;
      font-size:13px;
      font-weight:bold;
    }

    .message.success{
      display:block;
      background:#dcfce7;
      color:#166534;
    }

    .message.error{
      display:block;
      background:#fee2e2;
      color:#991b1b;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
      margin-bottom:20px;
    }

    .stat{
      background:white;
      padding:19px;
      border-radius:14px;
      box-shadow:0 4px 14px rgba(0,0,0,.06);
      border-left:5px solid var(--blue);
    }

    .stat.success{
      border-left-color:var(--green);
    }

    .stat.pending{
      border-left-color:var(--gold);
    }

    .stat h4{
      color:#6b7280;
      font-size:12px;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .stat strong{
      color:var(--navy);
      font-size:25px;
    }

    .main-grid{
      display:grid;
      grid-template-columns:380px 1fr;
      gap:20px;
      align-items:start;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:21px;
      box-shadow:0 4px 15px rgba(0,0,0,.06);
    }

    .card h3{
      color:var(--navy);
      margin-bottom:17px;
    }

    .form-group{
      margin-bottom:13px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-size:13px;
      font-weight:bold;
      color:#374151;
    }

    .required{
      color:var(--red);
    }

    input,
    select{
      width:100%;
      padding:11px 12px;
      border:1px solid #d1d5db;
      border-radius:8px;
      background:white;
      outline:none;
      font-size:14px;
    }

    input:focus,
    select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 2px rgba(11,77,162,.1);
    }

    select:disabled{
      background:#f3f4f6;
      cursor:not-allowed;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:17px;
    }

    .btn{
      border:none;
      border-radius:8px;
      padding:11px 15px;
      cursor:pointer;
      font-weight:bold;
    }

    .primary{
      background:var(--blue);
      color:white;
      flex:1;
    }

    .secondary{
      background:#e5e7eb;
      color:#374151;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr 180px;
      gap:10px;
      margin-bottom:17px;
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      min-width:900px;
      border-collapse:collapse;
    }

    th{
      background:#f3f4f6;
      color:var(--navy);
      text-align:left;
      padding:12px;
      font-size:11px;
      text-transform:uppercase;
    }

    td{
      padding:12px;
      border-bottom:1px solid var(--border);
      font-size:13px;
    }

    tr:hover{
      background:#fafafa;
    }

    .status{
      display:inline-block;
      padding:5px 9px;
      border-radius:20px;
      font-size:11px;
      font-weight:bold;
    }

    .successful{
      background:#dcfce7;
      color:#166534;
    }

    .pending{
      background:#fef3c7;
      color:#92400e;
    }

    .failed{
      background:#fee2e2;
      color:#991b1b;
    }

    .cancelled{
      background:#e5e7eb;
      color:#374151;
    }

    .refunded{
      background:#ede9fe;
      color:#5b21b6;
    }

    .action-btn{
      border:none;
      border-radius:6px;
      padding:7px 9px;
      cursor:pointer;
      font-size:11px;
      font-weight:bold;
      margin-right:3px;
    }

    .edit{
      background:#e0ecff;
      color:var(--blue);
    }

    .delete{
      background:#fee2e2;
      color:var(--red);
    }

    .loading,
    .empty{
      text-align:center;
      padding:30px;
      color:#6b7280;
    }

    small{
      color:#6b7280;
    }

    @media(max-width:1000px){
      .main-grid{
        grid-template-columns:1fr;
      }

      .stats{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .header-inner{
        align-items:flex-start;
      }

      .brand img{
        width:45px;
        height:45px;
      }

      .brand h1{
        font-size:17px;
      }

      .container{
        margin:18px auto;
        padding:0 12px;
      }

      .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
      }

      .stat{
        padding:14px;
      }

      .stat strong{
        font-size:20px;
      }

      .toolbar{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img
        src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
        alt="GAAWOW Academy">

      <div>
        <h1>GAAWOW EMS</h1>
        <p>Payments Management</p>
      </div>
    </div>

    <button class="back-btn" onclick="goBack()">
      ← Dashboard
    </button>

  </div>
</header>

<div class="container">

  <div class="title">
    <h2>Payments</h2>
    <p>Manage student payments and financial transactions.</p>
  </div>

  <div id="message" class="message"></div>

  <div class="stats">

    <div class="stat">
      <h4>Total Payments</h4>
      <strong id="totalPayments">0</strong>
    </div>

    <div class="stat success">
      <h4>Successful</h4>
      <strong id="successfulPayments">0</strong>
    </div>

    <div class="stat pending">
      <h4>Pending</h4>
      <strong id="pendingPayments">0</strong>
    </div>

    <div class="stat success">
      <h4>Total Successful</h4>
      <strong id="totalAmount">$0.00</strong>
    </div>

  </div>

  <div class="main-grid">

    <!-- PAYMENT FORM -->

    <div class="card">

      <h3 id="formTitle">Add Payment</h3>

      <form id="paymentForm">

        <input type="hidden" id="paymentId">

        <div class="form-group">
          <label>
            Institution <span class="required">*</span>
          </label>

          <select id="institutionId" required>
            <option value="">Loading institutions...</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            Student <span class="required">*</span>
          </label>

          <select id="studentId" required disabled>
            <option value="">Select Institution First</option>
          </select>
        </div>

        <div class="form-group">
          <label>Invoice</label>

          <select id="invoiceId">
            <option value="">No Invoice</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            Amount <span class="required">*</span>
          </label>

          <input
            type="number"
            id="amount"
            min="0"
            step="0.01"
            placeholder="150.00"
            required>
        </div>

        <div class="form-group">
          <label>Currency</label>

          <input
            type="text"
            id="currency"
            value="USD"
            required>
        </div>

        <div class="form-group">
          <label>Payment Method</label>

          <select id="paymentMethod">
            <option value="">Select Method</option>
            <option value="cash">Cash</option>
            <option value="bank">Bank</option>
            <option value="mobile_money">Mobile Money</option>
            <option value="card">Card</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Provider</label>

          <input
            type="text"
            id="provider"
            placeholder="Hormuud / EVC / Bank">
        </div>

        <div class="form-group">
          <label>Payer Phone</label>

          <input
            type="text"
            id="payerPhone"
            placeholder="0612345678">
        </div>

        <div class="form-group">
          <label>Provider Transaction ID</label>

          <input
            type="text"
            id="providerTransactionId"
            placeholder="TEST-TXN-001">
        </div>

        <div class="form-group">
          <label>Transaction Reference</label>

          <input
            type="text"
            id="transactionReference"
            placeholder="GAAWOW-PAY-001">
        </div>

        <div class="form-group">
          <label>
            Status <span class="required">*</span>
          </label>

          <select id="status" required>
            <option value="pending">Pending</option>
            <option value="successful">Successful</option>
            <option value="failed">Failed</option>
            <option value="cancelled">Cancelled</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>

        <div class="form-group">
          <label>Paid At</label>

          <input
            type="datetime-local"
            id="paidAt">
        </div>

        <div class="actions">

          <button
            type="submit"
            class="btn primary">
            Save Payment
          </button>

          <button
            type="button"
            class="btn secondary"
            onclick="resetForm()">
            Reset
          </button>

        </div>

      </form>

    </div>


    <!-- PAYMENTS TABLE -->

    <div class="card">

      <h3>Payment Records</h3>

      <div class="toolbar">

        <input
          type="text"
          id="searchInput"
          placeholder="Search student, reference, provider...">

        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="successful">Successful</option>
          <option value="failed">Failed</option>
          <option value="cancelled">Cancelled</option>
          <option value="refunded">Refunded</option>
        </select>

      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Student</th>
              <th>Amount</th>
              <th>Method</th>
              <th>Provider</th>
              <th>Reference</th>
              <th>Status</th>
              <th>Paid At</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="paymentsTableBody">
            <tr>
              <td colspan="8" class="loading">
                Loading payments...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script src="payments.js"></script>

</body>
</html>
