<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAAWOW EMS — Diploma V3</title><style>
:root{--navy:#0B1E63;--royal:#0B4DA2;--gold:#D4AF37;--cream:#fffdf7;--ink:#172033}
*{box-sizing:border-box}body{margin:0;background:#e9eef5;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;border-radius:16px;padding:13px 18px;display:flex;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;border:2px solid #D4AF37}.brand b{display:block;font-size:18px}.brand small{color:#f6db7b}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;box-shadow:0 7px 24px #0b1e6312}.panel h2{margin:0 0 13px;color:#0B1E63}label{display:block;font-size:12px;font-weight:800;color:#0B1E63;margin:10px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 13px;border-radius:8px;font-weight:800;background:#0B1E63;color:#fff;cursor:pointer}.btn.gold{background:#D4AF37;color:#0B1E63}.btn.light{background:#e8eef7;color:#0B1E63}.msg{margin:10px 0;padding:9px;border-radius:8px;font-size:12px}.ok{background:#e9f8ef;color:#166534}.err{background:#fdecec;color:#991b1b}.preview{overflow:auto;background:#dce4ee;border-radius:12px;padding:14px}.sheet{width:1200px;min-height:820px;margin:auto;background:#fff;position:relative;box-shadow:0 12px 32px #0002}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sheet{min-width:1000px}}@media print{body{background:#fff}.no-print{display:none!important}.app{padding:0}.layout{display:block}.panel{border:0;box-shadow:none;padding:0}.preview{padding:0;background:#fff}.sheet{box-shadow:none}}

.dip{height:820px;border:11px solid #0B1E63;background:#fffdf7;position:relative;overflow:hidden;padding:35px;text-align:center}.dip:before{content:"";position:absolute;inset:7px;border:2px solid #D4AF37}.dip .logo{width:90px;height:90px;object-fit:contain;position:relative;z-index:2}.academy{position:relative;z-index:2;color:#0B1E63;font-weight:900;font-size:28px;letter-spacing:3px}.motto{position:relative;z-index:2;color:#b48312;font-weight:800}.heading{position:relative;z-index:2;font:900 62px Georgia;color:#0B1E63;margin-top:35px}.sub{position:relative;z-index:2;color:#b48312;letter-spacing:5px;font-weight:900;font-size:20px}.present{position:relative;z-index:2;margin-top:32px}.name{position:relative;z-index:2;display:inline-block;font:italic 50px Georgia;color:#0B4DA2;border-bottom:2px solid #D4AF37;padding:0 60px 10px;margin:13px 0}.course{position:relative;z-index:2;font:900 29px Georgia;color:#0B1E63;margin:20px}.details{position:relative;z-index:2;font-size:14px}.row{position:absolute;z-index:2;left:90px;right:90px;bottom:65px;display:flex;justify-content:space-around;align-items:flex-end;text-align:center}.sig{width:220px;border-top:1px solid #64748b;padding-top:7px;font-size:12px}.seal{width:110px;height:110px;border:5px double #D4AF37;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#0B1E63;background:#fff}.footer{position:absolute;bottom:9px;left:35px;right:35px;background:#0B1E63;color:#fff;border-top:2px solid #D4AF37;padding:7px;font-size:10px}
</style></head><body><div class="app"><header class="top no-print"><div class="brand"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><div><b>GAAWOW EMS — Diploma V3</b><small>Official Diploma Generator</small></div></div></header><div class="layout"><section class="panel no-print"><h2>Diploma Data</h2><label>Student Name</label><input id="n" value="Student Name Here"><label>Program / Course</label><input id="c" value="Program Name Here"><label>Student ID</label><input id="sid" value="GA_2026_000001"><label>Diploma No.</label><input id="dn" value="GA-DIP-2026-0001"><label>Issue Date</label><input id="dt" type="date" value="2026-09-17"><label>Director</label><input id="dir" value="Abdirahman H. Mohamed"><label>Academic Head</label><input id="head" value="Hodan Yusuf"><div class="actions"><button class="btn" onclick="render()">Preview</button><button class="btn gold" onclick="window.print()">Print / PDF</button><button class="btn light" onclick="location.href='certificate.html'">Certificate</button><button class="btn light" onclick="location.href='authentication-letter.html'">Authentication</button></div></section><section class="panel"><div class="preview"><div class="sheet" id="sheet"></div></div></section></div></div><script>
const e=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]);function render(){let n=document.getElementById("n").value,c=document.getElementById("c").value,s=document.getElementById("sid").value,dn=document.getElementById("dn").value,dt=document.getElementById("dt").value,dir=document.getElementById("dir").value,h=document.getElementById("head").value;document.getElementById("sheet").innerHTML=`<div class="dip"><img class="logo" src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><div class="academy">GAAWOW ACADEMY</div><div class="motto">Ilayska Aqoonta iyo Xirfadda</div><div class="heading">DIPLOMA</div><div class="sub">OF SUCCESSFUL COMPLETION</div><div class="present">This diploma is proudly presented to</div><div class="name">${e(n)}</div><div>for successfully completing the academic / professional program</div><div class="course">${e(c)}</div><div class="details">Student ID: <b>${e(s)}</b> • Diploma No.: <b>${e(dn)}</b> • Issue Date: <b>${e(dt)}</b></div><div class="row"><div class="sig"><b>${e(dir)}</b><br>DIRECTOR<br>Gaawow Academy</div><div class="seal">GAAWOW<br>ACADEMY<br>OFFICIAL<br>SEAL</div><div class="sig"><b>${e(h)}</b><br>ACADEMIC HEAD<br>Gaawow Academy</div></div><div class="footer">Bur Hakaba, Bay, Somalia • +252 615 228824 / 625 228824 • www.gaawowacademy.so</div></div>`}render();
</script></body></html>
