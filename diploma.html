<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAAWOW EMS — Diploma</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:Arial}.page{max-width:1400px;margin:auto;padding:25px}.head{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;padding:22px;border-radius:18px}.panel{background:#fff;padding:22px;margin-top:20px;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:bold;color:#0B1E63}.field input,.field select{padding:12px;border:1px solid #ddd;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{padding:12px 17px;border:0;border-radius:9px;font-weight:bold}.gen{background:#D4AF37}.prev{background:#0B4DA2;color:white}.down{background:#D4AF37}.print{background:#0B1E63;color:white}#sheet{width:1200px;height:820px;max-width:100%;margin:25px auto;background:#fff;border:15px solid #0B1E63;padding:15px}.diploma{height:100%;border:5px solid #D4AF37;text-align:center;position:relative;padding:45px;overflow:hidden}.water{position:absolute;font:900 560px Georgia;color:#0B1E6306;left:430px;top:60px}.logo{width:90px;height:90px;object-fit:contain;position:relative}.academy{font:900 27px Georgia;color:#0B1E63;letter-spacing:3px}.motto{color:#D4AF37;font-weight:bold}.heading{font:900 60px Georgia;color:#0B1E63;margin-top:35px;letter-spacing:8px}.sub{color:#D4AF37;letter-spacing:4px;font-weight:bold}.present{margin-top:30px;color:#777}.name{font:900 38px Georgia;color:#0B1E63;border-bottom:2px solid #D4AF37;display:inline-block;padding:10px 70px}.body{margin-top:18px;color:#555}.course{font:900 27px Georgia;color:#0B4DA2;margin-top:10px}.details{margin-top:20px;color:#666;font-size:12px}.sign{position:absolute;bottom:70px;left:80px;right:80px;display:grid;grid-template-columns:1fr 110px 1fr;gap:35px;align-items:end;color:#0B1E63;font-size:10px}.sign hr{border:0;border-top:1px solid #0B1E63}.sign small{display:block;color:#777}.seal{width:90px;height:90px;border:4px double #D4AF37;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold}.foot{position:absolute;bottom:20px;left:0;right:0;font-size:8px;color:#777}
@media print{.head,.panel{display:none}#sheet{max-width:none;margin:0}@page{size:landscape;margin:0}}
</style></head><body><div class="page"><div class="head"><h1>GAAWOW EMS — Diploma Generator</h1></div><div class="panel"><div class="grid">
<div class="field"><label>Select Registered Student</label><select id="student"><option>Loading...</option></select></div>
<div class="field"><label>Student Name</label><input id="name"></div><div class="field"><label>Student ID</label><input id="sid"></div>
<div class="field"><label>Course</label><input id="course"></div><div class="field"><label>Diploma No.</label><input id="no" readonly></div><div class="field"><label>Student Photo URL</label><input id="photo"></div>
<div class="field"><label>Director Name</label><input id="director" placeholder="Director name"></div><div class="field"><label>Authorized Signatory</label><input id="signatory" placeholder="Signatory name"></div></div>
<div class="actions"><button class="gen" id="gen">🎓 Generate Diploma</button><button class="prev" id="prev">👁 Preview</button><button class="down" id="down">⬇ Download HD PNG</button><button class="print" id="print">🖨 Print / PDF</button></div></div><div id="sheet"></div></div><script src="./diploma.js"></script></body></html>
