<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW EMS — Institutions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #F5F7FA;
      color: #1F2937;
    }

    .header {
      background: linear-gradient(135deg, #0B1E63, #0B4DA2);
      color: white;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      padding: 4px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      font-size: 12px;
      opacity: .85;
      margin-top: 3px;
    }

    .back-btn {
      border: none;
      background: #D4AF37;
      color: #0B1E63;
      font-weight: bold;
      padding: 11px 17px;
      border-radius: 9px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .page-title {
      margin-bottom: 20px;
    }

    .page-title h2 {
      color: #0B1E63;
      font-size: 28px;
    }

    .page-title p {
      color: #64748B;
      margin-top: 6px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, .08);
      border: 1px solid #E5E7EB;
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title h3 {
      color: #0B1E63;
      font-size: 20px;
    }

    .add-btn {
      background: #0B4DA2;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #0B1E63;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 7px;
      color: #334155;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #0B4DA2;
      box-shadow: 0 0 0 3px rgba(11,77,162,.10);
    }

    .form-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .save-btn {
      background: #16A34A;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-btn {
      background: #E5E7EB;
      color: #1F2937;
      border: none;
      padding: 12px 22px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .search {
      margin-bottom: 16px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      text-align: left;
      padding: 13px;
      border-bottom: 1px solid #E5E7EB;
      font-size: 14px;
    }

    th {
      background: #F8FAFC;
      color: #0B1E63;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .active {
      background: #DCFCE7;
      color: #166534;
    }

    .inactive {
      background: #FEE2E2;
      color: #991B1B;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #64748B;
    }

    @media (max-width: 700px) {
      .header {
        padding: 15px;
      }

      .brand h1 {
        font-size: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .card {
        padding: 18px;
      }

      .page-title h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="brand">
      <img
        src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
        alt="GAAWOW Academy Logo"
      >

      <div>
        <h1>GAAWOW EMS</h1>
        <p>Education Management & Verification System</p>
      </div>
    </div>

    <button class="back-btn" onclick="goDashboard()">
      ← Dashboard
    </button>

  </header>


  <main class="container">

    <div class="page-title">
      <h2>Institutions Management</h2>
      <p>Manage schools and educational institutions.</p>
    </div>


    <!-- ADD INSTITUTION -->

    <section class="card">

      <div class="card-title">

        <h3>➕ Add Institution</h3>

      </div>

      <form id="institutionForm">

        <div class="form-grid">

          <div class="form-group">
            <label for="name">Institution Name *</label>
            <input
              id="name"
              type="text"
              placeholder="Enter institution name"
              required
            >
          </div>


          <div class="form-group">
            <label for="code">Institution Code *</label>
            <input
              id="code"
              type="text"
              placeholder="e.g. GAA-001"
              required
            >
          </div>


          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              placeholder="institution@email.com"
            >
          </div>


          <div class="form-group">
            <label for="phone">Phone</label>
            <input
              id="phone"
              type="text"
              placeholder="615xxxxxx"
            >
          </div>


          <div class="form-group">
            <label for="address">Address</label>
            <input
              id="address"
              type="text"
              placeholder="Street / Area"
            >
          </div>


          <div class="form-group">
            <label for="city">City</label>
            <input
              id="city"
              type="text"
              placeholder="Bur Hakaba"
            >
          </div>


          <div class="form-group">
            <label for="country">Country</label>
            <input
              id="country"
              type="text"
              value="Somalia"
            >
          </div>


          <div class="form-group">
            <label for="website_url">Website</label>
            <input
              id="website_url"
              type="url"
              placeholder="https://example.com"
            >
          </div>


          <div class="form-group full">
            <label for="logo_url">Logo URL</label>
            <input
              id="logo_url"
              type="url"
              placeholder="https://..."
            >
          </div>

        </div>


        <div class="form-actions">

          <button
            type="submit"
            class="save-btn"
            id="saveBtn"
          >
            ADD INSTITUTION
          </button>

          <button
            type="button"
            class="cancel-btn"
            onclick="resetForm()"
          >
            CLEAR
          </button>

        </div>


        <div id="message"></div>

      </form>

    </section>


    <!-- INSTITUTIONS LIST -->

    <section class="card">

      <div class="card-title">
        <h3>🏫 Institutions</h3>
      </div>

      <div class="search">
        <input
          id="searchInput"
          type="search"
          placeholder="Search institution name, code, city..."
        >
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Code</th>
              <th>City</th>
              <th>Phone</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="institutionsBody">
            <tr>
              <td colspan="5" class="empty">
                Loading institutions...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./institutions.js"></script>

</body>
</html>
