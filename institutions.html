<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW EMS — Institutions</title>

  <meta name="theme-color" content="#0B1E63">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #F5F7FA;
      color: #1F2937;
    }

    .header {
      background: linear-gradient(135deg, #0B1E63, #0B4DA2);
      color: white;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background: white;
      border-radius: 10px;
      padding: 4px;
    }

    .brand h1 {
      font-size: 19px;
    }

    .brand p {
      font-size: 11px;
      color: #E8A317;
      margin-top: 3px;
    }

    .back-btn {
      border: none;
      background: white;
      color: #0B1E63;
      padding: 10px 15px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .top-section {
      background: white;
      padding: 22px;
      border-radius: 17px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .title-row h2 {
      color: #0B1E63;
      font-size: 24px;
    }

    .title-row p {
      color: #6B7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .add-btn {
      border: none;
      background: #0B4DA2;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #0B1E63;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 12px;
    }

    .tools input,
    .tools select,
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #D1D5DB;
      border-radius: 9px;
      outline: none;
      background: white;
    }

    .tools input:focus,
    .tools select:focus,
    .form-group input:focus,
    .form-group select:focus {
      border-color: #0B4DA2;
    }

    .table-card {
      background: white;
      border-radius: 17px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      background: #0B1E63;
      color: white;
      padding: 14px;
      text-align: left;
      font-size: 12px;
      white-space: nowrap;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #E5E7EB;
      font-size: 13px;
      vertical-align: middle;
    }

    tr:hover td {
      background: #F8FAFC;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .active {
      background: #DCFCE7;
      color: #166534;
    }

    .inactive {
      background: #FEE2E2;
      color: #991B1B;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .view-btn {
      background: #DBEAFE;
      color: #1D4ED8;
    }

    .edit-btn {
      background: #FEF3C7;
      color: #92400E;
    }

    .toggle-btn {
      background: #E5E7EB;
      color: #374151;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #6B7280;
    }

    .loading {
      text-align: center;
      padding: 45px;
      color: #6B7280;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 92vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .modal-header {
      background: linear-gradient(135deg, #0B1E63, #0B4DA2);
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 18px;
    }

    .close-btn {
      border: none;
      background: transparent;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: #374151;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #E5E7EB;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .cancel-btn,
    .save-btn {
      border: none;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .cancel-btn {
      background: #E5E7EB;
      color: #374151;
    }

    .save-btn {
      background: #0B4DA2;
      color: white;
    }

    .message {
      margin-bottom: 15px;
      padding: 11px 14px;
      border-radius: 9px;
      display: none;
      font-size: 13px;
    }

    .message.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #FEE2E2;
      color: #991B1B;
    }

    @media (max-width: 700px) {
      .title-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .add-btn {
        width: 100%;
      }

      .tools {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .brand h1 {
        font-size: 16px;
      }

      .brand p {
        display: none;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="brand">

    <img
      src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
      alt="GAAWOW Academy Logo"
    >

    <div>
      <h1>GAAWOW EMS</h1>
      <p>Education Management & Verification System</p>
    </div>

  </div>

  <button
    class="back-btn"
    onclick="window.location.href='super-admin.html'"
  >
    ← Dashboard
  </button>

</header>


<main class="container">

  <section class="top-section">

    <div class="title-row">

      <div>
        <h2>Institutions</h2>

        <p>
          Manage all institutions registered in GAAWOW EMS.
        </p>
      </div>

      <button
        class="add-btn"
        id="addInstitutionBtn"
      >
        + Add Institution
      </button>

    </div>


    <div id="message" class="message"></div>


    <div class="tools">

      <input
        type="search"
        id="searchInput"
        placeholder="Search institution..."
      >

      <select id="statusFilter">

        <option value="all">
          All Status
        </option>

        <option value="active">
          Active
        </option>

        <option value="inactive">
          Inactive
        </option>

      </select>

    </div>

  </section>


  <section class="table-card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              #
            </th>

            <th>
              Institution Name
            </th>

            <th>
              Institution ID
            </th>

            <th>
              Status
            </th>

            <th>
              Created
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>

        <tbody id="institutionsTable">

          <tr>
            <td
              colspan="6"
              class="loading"
            >
              Loading institutions...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- ADD / EDIT MODAL -->

<div
  class="modal"
  id="institutionModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="modalTitle">
        Add Institution
      </h3>

      <button
        class="close-btn"
        id="closeModalBtn"
      >
        ×
      </button>

    </div>


    <form id="institutionForm">

      <div class="modal-body">

        <div class="form-grid">

          <div class="form-group full">

            <label>
              Institution Name *
            </label>

            <input
              type="text"
              id="institutionName"
              required
              placeholder="e.g. GAAWOW Academy"
            >

          </div>


          <div class="form-group">

            <label>
              Status
            </label>

            <select id="institutionStatus">

              <option value="active">
                Active
              </option>

              <option value="inactive">
                Inactive
              </option>

            </select>

          </div>

        </div>

      </div>


      <div class="modal-footer">

        <button
          type="button"
          class="cancel-btn"
          id="cancelModalBtn"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          Save Institution
        </button>

      </div>

    </form>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="institutions.js"></script>

</body>
</html>
