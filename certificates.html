<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAAWOW EMS — Generate Certificate</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&display=swap');

*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#1f2937;font-family:Arial,Helvetica,sans-serif}
.topbar{min-height:64px;background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;object-fit:contain}.brand-title{font-size:19px;font-weight:800}.brand-subtitle{font-size:11px;opacity:.85}
.back-btn{border:0;background:rgba(255,255,255,.12);color:#fff;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:700}
.container{max-width:1550px;margin:auto;padding:22px}
.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.06);overflow:hidden}
.card-head{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;padding:15px 17px;font-weight:800}
.card-body{padding:17px}
label{display:block;font-size:11px;font-weight:800;color:#374151;text-transform:uppercase;margin:0 0 6px}
.field{margin-bottom:13px}
input,select{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:7px;background:#fff;outline:none;font-size:13px}
input:focus,select:focus{border-color:#0B4DA2;box-shadow:0 0 0 2px rgba(11,77,162,.1)}
.readonly{background:#f8fafc}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.btn{border:0;border-radius:7px;padding:10px 12px;cursor:pointer;font-weight:800;font-size:12px}
.btn-primary{background:#0B4DA2;color:#fff}.btn-gold{background:#D4AF37;color:#111827}.btn-light{background:#e5e7eb;color:#111827}.btn-green{background:#16A34A;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;margin:0 0 14px;padding:11px;border-radius:7px;font-size:12px;font-weight:700}.message.success{display:block;background:#dcfce7;color:#166534}.message.error{display:block;background:#fee2e2;color:#991b1b}.message.info{display:block;background:#dbeafe;color:#1e40af}
.photo-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #D4AF37;background:#f3f4f6;display:block;margin:0 auto 10px}
.help{font-size:10px;color:#6b7280;line-height:1.45;margin-top:4px}
.preview-card{background:#111827;border-radius:12px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.preview-wrap{width:100%;background:#fff;overflow:hidden;display:flex;justify-content:center}
#certificateCanvas{width:100%;height:auto;display:block;max-width:1536px}
.preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview-actions .btn{flex:1;min-width:120px}
.small-status{font-size:11px;color:#d1d5db;margin-top:9px}
@media(max-width:1050px){.grid{grid-template-columns:1fr}.preview-card{order:-1}}
@media(max-width:600px){.container{padding:12px}.topbar{padding:10px 14px}.brand-title{font-size:16px}.actions{grid-template-columns:1fr}.preview-card{padding:7px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png" alt="GAAWOW Academy">
    <div>
      <div class="brand-title">GAAWOW EMS</div>
      <div class="brand-subtitle">Certificate Generator</div>
    </div>
  </div>
  <button type="button" class="back-btn" id="backBtn">← Back to Certificates</button>
</header>

<main class="container">
  <div id="message" class="message"></div>

  <div class="grid">
    <section class="card">
      <div class="card-head">Generate Certificate</div>
      <div class="card-body">

        <div class="field">
          <label for="institutionSelect">Institution</label>
          <select id="institutionSelect">
            <option value="">Loading...</option>
          </select>
        </div>

        <div class="field">
          <label for="studentSelect">Student</label>
          <select id="studentSelect">
            <option value="">Select student</option>
          </select>
        </div>

        <div id="photoBox" style="display:none">
          <img id="studentPhotoPreview" class="photo-preview" alt="Student Photo">
        </div>

        <div class="field">
          <label for="courseSelect">Course</label>
          <select id="courseSelect">
            <option value="">Select course</option>
          </select>
        </div>

        <div class="field">
          <label for="certificateNo">Certificate No</label>
          <input id="certificateNo" class="readonly" readonly>
        </div>

        <div class="field">
          <label for="certificateId">Certificate ID</label>
          <input id="certificateId" class="readonly" readonly>
        </div>

        <div class="field">
          <label for="verifyCode">Verify Code</label>
          <input id="verifyCode" class="readonly" readonly>
        </div>

        <div class="field">
          <label for="dateStarted">Date Started</label>
          <input id="dateStarted" type="date">
        </div>

        <div class="field">
          <label for="dateCompleted">Date Completed</label>
          <input id="dateCompleted" type="date">
        </div>

        <div class="field">
          <label for="issueDate">Date Issued</label>
          <input id="issueDate" type="date">
        </div>

        <div class="field">
          <label for="expiryDate">Expiry Date</label>
          <input id="expiryDate" type="date">
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="valid">VALID</option>
            <option value="graduated">GRADUATED</option>
            <option value="pending">PENDING</option>
            <option value="expired">EXPIRED</option>
            <option value="revoked">REVOKED</option>
          </select>
        </div>

        <div class="field">
          <label for="certificateType">Certificate Type</label>
          <input id="certificateType" value="Certificate of Completion">
        </div>

        <div class="field">
          <label for="studentName">Student Name</label>
          <input id="studentName" class="readonly" readonly>
        </div>

        <div class="field">
          <label for="courseName">Course Name</label>
          <input id="courseName" class="readonly" readonly>
        </div>

        <div class="help">
          Template-ka rasmiga ah waa <strong>certificate-template.png</strong>
          oo ku jira root-ka GAAWOW-EMS. Design, icons, fonts, borders,
          signatures iyo background lama beddelayo.
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="generateBtn" type="button">Generate Preview</button>
          <button class="btn btn-gold" id="saveBtn" type="button">Save Certificate</button>
          <button class="btn btn-green" id="pngBtn" type="button">Download PNG</button>
          <button class="btn btn-light" id="pdfBtn" type="button">Download PDF</button>
          <button class="btn btn-light" id="printBtn" type="button">Print HD</button>
          <button class="btn btn-light" id="verifyBtn" type="button">Verify Online</button>
        </div>
      </div>
    </section>

    <section class="preview-card">
      <div class="preview-wrap">
        <canvas id="certificateCanvas" width="1536" height="1024"></canvas>
      </div>
      <div class="small-status" id="previewStatus">Loading official certificate template...</div>
    </section>
  </div>
</main>

<script src="certificate.js?v=800"></script>
</body>
</html>
