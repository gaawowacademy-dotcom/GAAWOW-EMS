<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAAWOW Academy | Authentication Letter</title>
<style>
:root{--navy:#063b8f;--gold:#e6ae1d;--light:#f3f7fb;--ink:#173a70}
*{box-sizing:border-box}body{margin:0;background:#e8eef5;font-family:Arial,Helvetica,sans-serif;color:#173a70}
.toolbar{position:sticky;top:0;z-index:50;background:#063b8f;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 3px 14px #0003}
.toolbar strong{font-size:16px}.toolbar small{display:block;opacity:.8;margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn-gold{background:#e6ae1d;color:#072e70}.btn-white{background:#fff;color:#063b8f}.btn-red{background:#b92d38;color:#fff}
.shell{display:grid;grid-template-columns:365px minmax(0,1fr);gap:15px;padding:15px}
.panel{background:#fff;border-radius:10px;padding:14px;box-shadow:0 4px 18px #0001;max-height:calc(100vh - 92px);overflow:auto}
.panel h2{font-size:15px;margin:0 0 10px;color:#063b8f}.section{border-top:1px solid #dce5ef;margin-top:12px;padding-top:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:10px;font-weight:700;display:block;margin-bottom:3px;color:#405b78}
input,textarea{width:100%;border:1px solid #c6d5e5;border-radius:5px;padding:7px;font-size:11px;color:#173a70;background:#fbfdff}
input[readonly]{background:#eef4fa}.full{grid-column:1/-1}textarea{height:130px;resize:vertical}
.note{font-size:10px;color:#667b92;line-height:1.35;margin-top:5px}.msg{padding:7px;border-radius:5px;background:#edf5ff;color:#1d4f8d;font-size:11px;margin-bottom:8px}
.preview{overflow:auto;background:#cfd9e5;padding:12px;border-radius:10px}
#paper{position:relative;width:min(100%,1024px);aspect-ratio:1024/1536;margin:auto;background:#fff url("./authentication-letter.png") center/100% 100% no-repeat;overflow:hidden;box-shadow:0 5px 25px #0003}
.f{position:absolute;font-weight:700;color:#143c77;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.top{top:21.18%;height:2.25%;font-size:clamp(9px,1.15vw,14px)}
.ref{left:8.9%;width:16.2%}.issued{left:33.1%;width:15.8%}.vcode{left:57.0%;width:16.0%}.status{left:81.4%;width:15.0%}
.student{top:29.55%;height:2.45%;font-size:clamp(9px,1.2vw,14px)}
.sname{left:30.3%;width:29.2%}.sid{top:33.65%;left:30.3%;width:29.2%}.course{top:37.62%;left:30.3%;width:29.2%}.ccode{top:41.57%;left:30.3%;width:29.2%}
.right1{left:66.5%;width:28.7%}.started{top:29.55%}.completed{top:33.65%}.grade{top:37.62%}.sstatus{top:41.57%}
.photo{position:absolute;left:5.15%;top:28.55%;width:18.3%;height:14.45%;object-fit:cover;display:none}
.letter{left:5.0%;top:47.0%;width:89.8%;height:13.7%;font-size:clamp(9px,1.35vw,15px);font-weight:500;white-space:pre-wrap;line-height:1.35;color:#254a78}
.authDirector{left:12.0%;top:65.95%;width:24%;height:2.3%;font-size:clamp(8px,1.05vw,12px)}
.authority{left:74.0%;top:65.95%;width:20%;height:2.3%;font-size:clamp(8px,1.05vw,12px)}
.stamp{position:absolute;left:39.1%;top:64.35%;width:22%;height:7.0%;display:flex;align-items:center;justify-content:center;text-align:center;color:#4f739f;font-weight:700;font-size:clamp(8px,1vw,11px);border:2px dashed #e6ae1d;border-radius:7px;background:#ffffff55}
.qr{position:absolute;left:6.0%;top:76.15%;width:15.5%;height:9.4%;display:flex;align-items:center;justify-content:center;background:#fff}
.ver{top:75.65%;height:2.35%;font-size:clamp(8px,1.1vw,13px)}.vercode{left:34.7%;width:40.5%}.verstatus{top:79.0%;left:34.7%;width:40.5%}.verurl{top:82.15%;left:34.7%;width:59.0%;font-size:clamp(7px,.85vw,10px)}
@media(max-width:950px){.shell{grid-template-columns:1fr}.panel{max-height:none}.preview{order:2}}
@media print{body{background:#fff}.toolbar,.panel{display:none!important}.shell{display:block;padding:0}.preview{padding:0;background:#fff}#paper{width:210mm;height:297mm;box-shadow:none}}
</style>
</head>
<body>
<header class="toolbar">
<div><strong>GAAWOW ACADEMY · Authentication Letter</strong><small>Ilayska Aqoonta iyo Xirfadda · Burhakaba, Bay, Somalia</small></div>
<div class="actions">
<button class="btn-white" id="loadBtn">Load Record</button><button class="btn-gold" id="saveBtn">Save</button>
<button class="btn-white" id="pngBtn">PNG</button><button class="btn-white" id="pdfBtn">PDF</button><button class="btn-white" id="printBtn">Print</button>
</div>
</header>

<div class="shell">
<aside class="panel">
<div id="msg" class="msg">Opening from Certificates with <b>?regen=ID</b> will load the record automatically.</div>

<div class="section">
<h2>Record</h2>
<div class="grid">
<div class="full"><label>Certificate Record ID</label><input id="recordId"></div>
<div><label>Reference No. (Automatic)</label><input id="referenceNo" readonly></div>
<div><label>Date Issued</label><input id="dateIssued" type="date"></div>
<div><label>Verification Code (Automatic)</label><input id="verificationCode" readonly></div>
<div><label>Status</label><input id="topStatus" value="AUTHENTICATED"></div>
</div>
</div>

<div class="section">
<h2>Student & Institution</h2>
<div class="grid">
<div class="full"><label>Institution / Awarding Authority</label><input id="institutionName" readonly></div>
<div><label>Student Name</label><input id="studentName" readonly></div>
<div><label>Student ID</label><input id="studentId" readonly></div>
<div><label>Program / Course</label><input id="courseName" readonly></div>
<div><label>Course Code</label><input id="courseCode" readonly></div>
<div><label>Date Started</label><input id="dateStarted" type="date" readonly></div>
<div><label>Date Completed</label><input id="dateCompleted" type="date" readonly></div>
<div><label>Grade</label><input id="grade" readonly></div>
<div><label>Student Status</label><input id="studentStatus" readonly></div>
<div class="full"><label>Student Photo URL</label><input id="studentPhotoUrl" readonly></div>
</div>
<div style="margin-top:8px"><label>Optional local student photo</label><input id="studentPhoto" type="file" accept="image/*"></div>
</div>

<div class="section">
<h2>Authentication Letter</h2>
<label>Letter Body</label>
<textarea id="letterBody"></textarea>
</div>

<div class="section">
<h2>Official Authentication</h2>
<div class="grid">
<div><label>Founder & Director</label><input id="directorName"></div>
<div><label>Awarding Authority</label><input id="awardingAuthority"></div>
<div><label>Verification Status</label><input id="verificationStatus" value="AUTHENTIC"></div>
<div><label>Verification URL</label><input id="verificationUrl" readonly></div>
</div>
</div>
</aside>

<main class="preview">
<div id="paper">
<img id="previewPhoto" class="photo" alt="">
<div class="f top ref" id="pReference"></div><div class="f top issued" id="pIssued"></div><div class="f top vcode" id="pVCode"></div><div class="f top status" id="pTopStatus"></div>
<div class="f student sname" id="pStudentName"></div><div class="f student sid" id="pStudentId"></div><div class="f student course" id="pCourse"></div><div class="f student ccode" id="pCourseCode"></div>
<div class="f student right1 started" id="pStarted"></div><div class="f student right1 completed" id="pCompleted"></div><div class="f student right1 grade" id="pGrade"></div><div class="f student right1 sstatus" id="pStudentStatus"></div>
<div class="f letter" id="pLetter"></div><div class="f authDirector" id="pDirector"></div><div class="f authority" id="pAuthority"></div>
<div class="stamp">OFFICIAL GAAWOW ACADEMY<br>STAMP HERE</div>
<div class="qr" id="qr"></div><div class="f ver vercode" id="pVerCode"></div><div class="f ver verstatus" id="pVerStatus"></div><div class="f ver verurl" id="pVerUrl"></div>
</div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="./authentication-letter.js"></script>
</body>
</html>
