<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAAWOW EMS — Authentication Letter</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:Arial;color:#1F2937}.page{max-width:1250px;margin:auto;padding:25px}.head{background:linear-gradient(135deg,#0B1E63,#0B4DA2);color:#fff;padding:22px;border-radius:18px}.panel{background:#fff;padding:22px;margin-top:20px;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:bold;color:#0B1E63}.field input,.field select{padding:12px;border:1px solid #ddd;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{padding:12px 17px;border:0;border-radius:9px;font-weight:bold}.gen{background:#D4AF37}.prev{background:#0B4DA2;color:white}.down{background:#D4AF37}.print{background:#0B1E63;color:white}#sheet{width:900px;height:1270px;max-width:100%;margin:25px auto;background:#fff;border:12px solid #0B1E63;padding:12px}.letter{height:100%;border:4px solid #D4AF37;padding:55px 65px;position:relative;overflow:hidden}.letter:after{content:"G";position:absolute;font:900 600px Georgia;color:#0B1E6305;left:250px;top:260px;z-index:0}.letter>*{position:relative;z-index:2}.logo{display:block;width:85px;height:85px;object-fit:contain;margin:auto}.academy{text-align:center;font:900 27px Georgia;color:#0B1E63;letter-spacing:3px}.motto{text-align:center;color:#D4AF37;font-weight:bold}.line{border:0;border-top:3px solid #D4AF37;margin:25px 0}.heading{text-align:center;color:#0B1E63;font:900 29px Georgia;letter-spacing:3px}.ref{text-align:right;font-size:11px;color:#666;margin:25px 0}.letter p{font-size:15px;line-height:1.8}.student{text-align:center;color:#0B1E63;font:900 25px Georgia;border-bottom:2px solid #D4AF37;padding:8px}.sign{position:absolute;bottom:110px;left:65px;right:65px;display:grid;grid-template-columns:1fr 1fr;gap:60px;text-align:center;color:#0B1E63;font-size:10px}.sign hr{border:0;border-top:1px solid #0B1E63}.sign small{display:block;color:#777}.footer{position:absolute;bottom:35px;left:65px;right:65px;text-align:center;border-top:1px solid #0B1E6333;padding-top:8px;font-size:8px;color:#777}
@media print{.head,.panel{display:none}#sheet{max-width:none;margin:0}@page{size:A4;margin:0}}
</style></head><body><div class="page"><div class="head"><h1>GAAWOW EMS — Authentication Letter</h1></div><div class="panel"><div class="grid">
<div class="field"><label>Select Registered Student</label><select id="student"><option>Loading...</option></select></div>
<div class="field"><label>Student Name</label><input id="name"></div><div class="field"><label>Student ID</label><input id="sid"></div>
<div class="field"><label>Course / Programme</label><input id="course"></div><div class="field"><label>Reference No.</label><input id="ref" readonly></div>
<div class="field"><label>Director Name</label><input id="director" placeholder="Director name"></div><div class="field"><label>Authorized Signatory</label><input id="signatory" placeholder="Signatory name"></div></div>
<div class="actions"><button class="gen" id="gen">📄 Generate Letter</button><button class="prev" id="prev">👁 Preview</button><button class="down" id="down">⬇ Download HD PNG</button><button class="print" id="print">🖨 Print / PDF</button></div></div><div id="sheet"></div></div><script src="./authentication-letter.js"></script></body></html>
