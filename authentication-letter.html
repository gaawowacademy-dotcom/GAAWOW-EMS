</style></head><body><div class="app"><header class="top no-print"><div class="brand"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><div><b>GAAWOW EMS — Authentication Letter V3</b><small>Official Certificate Authentication</small></div></div></header><div class="layout"><section class="panel no-print"><h2>Letter Data</h2><label>Student Name</label><input id="n" value="Student Name Here"><label>Student ID</label><input id="sid" value="GA_2026_000001"><label>Certificate No.</label><input id="cn" value="GA-C-2026-0001-4F7B2A"><label>Hash / Verify Code</label><input id="hc" value="4F7B2A"><label>Course Name</label><input id="co" value="Basic Computer Course"><label>Start Date</label><input id="st" type="date" value="2026-01-01"><label>Completion Date</label><input id="cm" type="date" value="2026-06-15"><label>Issue Date</label><input id="is" type="date" value="2026-09-17"><label>Letter ID</label><input id="li" value="GAL-2026-00001"><div class="actions"><button class="btn" onclick="render()">Preview</button><button class="btn gold" onclick="window.print()">Print / PDF</button><button class="btn light" onclick="location.href='certificate.html'">Certificate</button><button class="btn light" onclick="location.href='diploma.html'">Diploma</button></div></section><section class="panel"><div class="preview"><div class="sheet" id="sheet"></div></div></section></div></div><script>
const e=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]);const f=v=>v?new Date(v+"T00:00:00").toLocaleDateString("en-GB").replaceAll("/"," / "):"—";const fld=(a,b)=>`<div class="field"><b>${e(a)}</b><span>${e(b)}</span></div>`;
function render(){let n=document.getElementById("n").value,s=document.getElementById("sid").value,cn=document.getElementById("cn").value,h=document.getElementById("hc").value,co=document.getElementById("co").value,st=document.getElementById("st").value,cm=document.getElementById("cm").value,is=document.getElementById("is").value,li=document.getElementById("li").value,q="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data="+encodeURIComponent("https://gaawowacademy-dotcom.github.io/GAAWOW-EMS/verify.html?code="+h);document.getElementById("sheet").innerHTML=`<div class="letter"><div class="side"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><h3>GAAWOW ACADEMY</h3><div class="info"><b>LETTER ID</b><span>${e(li)}</span></div><div class="info"><b>DATE OF ISSUE</b><span>${f(is)}</span></div><div class="info"><b>VERIFICATION PORTAL</b><span>https://gaawowacademy-dotcom.github.io/GAAWOW-EMS/verify.html</span></div><img class="qr" src="${q}"><div style="text-align:center;color:#f6db7b;font-size:10px;font-weight:900">SCAN TO VERIFY</div><div class="info"><span>Certificate ID, Student ID ama Hash Code si aad u xaqiijiso.</span></div></div><div class="right"><div class="head"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"><div><b>GAAWOW ACADEMY</b><small>Ilayska Aqoonta iyo Xirfadda</small></div></div><div class="title">CERTIFICATE AUTHENTICATION LETTER</div><div class="sub">WARQADDA XAQIIJINTA SUGNAANSHAHA SHAHAADADA</div><div class="to">Ku: Cidda ay khusayso</div><p class="para">Waxaan halkan ku caddeyneynaa in shahaadada uu leeyahay ardayga hoos ku xusan ay si rasmi ah uga diiwaangashan tahay nidaamka kaydka shahaadooyinka ee <b>Gaawow Academy</b>.</p><div class="fields">${fld("Magaca Ardayga",n)}${fld("Student ID",s)}${fld("Certificate No.",cn)}${fld("Hash Code (Verify Code)",h)}${fld("Course Name",co)}${fld("Start Date",f(st))}${fld("Completion Date",f(cm))}${fld("Date of Issue",f(is))}</div><p class="para">Ardaygan wuxuu si guul leh u dhammeystay koorsada kor ku xusan, lana xaqiijiyay dhammaan shuruudihii waxbarasho iyo qiimeyntii looga baahnaa, sidaa darteedna waxaa la siiyay shahaadadan.</p><div class="verifybox"><b>SI LOOGU XAQIIJIYO SAXNIMADA SHAHAADADA AMA WARQADDAN:</b><br>• Booqo bogga rasmiga ah: https://gaawowacademy-dotcom.github.io/GAAWOW-EMS/verify.html<br>• Ama scan garee QR Code-ka dhinaca kaga yaal<br>• Ama geli Certificate No., Student ID ama Hash Code (Verify Code).</div><div class="bottom"><div class="sig"><div class="signame">Ahmed Hassan Omar</div><b>DIRECTOR</b><br>Gaawow Academy</div><div class="seal">GAAWOW<br>ACADEMY<br>OFFICIAL<br>SEAL</div><div class="sig"><div class="signame">Academic Head</div><b>ACADEMIC HEAD</b><br>Gaawow Academy</div></div><div class="footer">Bur Hakaba, Bay, Somalia • +252 615 228824 / 625 228824 • www.gaawowacademy.so • info@gaawowacademy.so</div></div></div>`}render();
</script></body></html>
