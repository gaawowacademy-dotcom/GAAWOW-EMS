<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAAWOW EMS | Authentication Letter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Arial,Helvetica,sans-serif}.topbar{height:68px;background:linear-gradient(135deg,#0b1e63,#0b4da2);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 22px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:44px;height:44px;object-fit:contain}.brand-title{font-weight:800}.brand-subtitle{font-size:11px;opacity:.8}.back-btn{border:1px solid #d4af37;background:transparent;color:#fff;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}.container{max-width:1500px;margin:auto;padding:20px}.message{display:none;margin-bottom:14px;padding:11px 13px;border-radius:8px;font-size:12px;font-weight:700}.message.info{display:block;background:#dbeafe;color:#1e40af}.message.success{display:block;background:#dcfce7;color:#166534}.message.error{display:block;background:#fee2e2;color:#991b1b}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:12px;box-shadow:0 5px 18px rgba(15,23,42,.07);overflow:hidden}.head{padding:15px 17px;background:linear-gradient(135deg,#0b1e63,#0b4da2);color:#fff;font-weight:800}.body{padding:16px}.field{margin-bottom:12px}label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#4b5563;margin-bottom:5px}input,select{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:13px;background:#fff}input:focus,select:focus{outline:none;border-color:#0b4da2;box-shadow:0 0 0 2px #0b4da21a}.readonly{background:#f8fafc}.photo{width:78px;height:78px;object-fit:cover;border-radius:50%;border:3px solid #d4af37;display:block;margin:0 auto 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}.btn{border:0;border-radius:7px;padding:10px 9px;font-weight:800;font-size:11px;cursor:pointer}.primary{background:#0b4da2;color:#fff}.gold{background:#d4af37;color:#111}.green{background:#16a34a;color:#fff}.light{background:#e5e7eb;color:#111}.preview{background:#111827;border-radius:12px;padding:12px}.preview-wrap{background:#fff;display:flex;justify-content:center;overflow:hidden}canvas{display:block;width:100%;height:auto;max-width:1055px}.preview-status{color:#d1d5db;font-size:11px;padding-top:8px}.help{font-size:10px;line-height:1.45;color:#6b7280;margin-top:10px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.preview{order:-1}}@media(max-width:600px){.container{padding:10px}.topbar{padding:9px 12px}.brand-title{font-size:14px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png" alt="GAAWOW"><div><div class="brand-title">GAAWOW EMS</div><div class="brand-subtitle">Authentication Letter Generator</div></div></div><button class="back-btn" id="backBtn">← Certificates</button></header>
<main class="container"><div id="message" class="message"></div><div class="layout">
<section class="card"><div class="head">Authentication Letter</div><div class="body">
<div class="field"><label>Institution</label><select id="institutionSelect"><option>Loading...</option></select></div>
<div class="field"><label>Student</label><select id="studentSelect"><option>Select student</option></select></div>
<div id="photoBox" style="display:none"><img id="studentPhotoPreview" class="photo" alt="Student photo"></div>
<div class="field"><label>Course</label><select id="courseSelect"><option>Select course</option></select></div>
<div class="field"><label>Authentication No</label><input id="certificateNo" class="readonly" readonly></div>
<div class="field"><label>Authentication ID</label><input id="certificateId" class="readonly" readonly></div>
<div class="field"><label>Verify Code</label><input id="verifyCode" class="readonly" readonly></div>
<div class="field"><label>Date Started</label><input id="dateStarted" type="date"></div>
<div class="field"><label>Date Completed</label><input id="dateCompleted" type="date"></div>
<div class="field"><label>Issue Date</label><input id="issueDate" type="date"></div>
<div class="field"><label>Expiry Date</label><input id="expiryDate" type="date"></div>
<div class="field"><label>Status</label><select id="status"><option value="valid">VALID</option><option value="graduated">GRADUATED</option><option value="pending">PENDING</option><option value="expired">EXPIRED</option><option value="revoked">REVOKED</option></select></div>
<div class="field"><label>Director Name</label><input id="directorName" placeholder="Director Name"></div>
<div class="field"><label>Academic Head Name</label><input id="academicHeadName" placeholder="Academic Head Name"></div>
<div class="field"><label>Student Name</label><input id="studentName" class="readonly" readonly></div>
<div class="field"><label>Course Name</label><input id="courseName" class="readonly" readonly></div>
<div class="actions"><button class="btn primary" id="generateBtn">Generate</button><button class="btn gold" id="saveBtn">Save</button><button class="btn green" id="pngBtn">PNG</button><button class="btn light" id="pdfBtn">PDF</button><button class="btn light" id="printBtn">Print</button><button class="btn light" id="verifyBtn">Verify</button></div>
<div class="help">Template-ka waxaa lagu akhriyaa <b>authentication-letter.png</b>. Ku hay isla root-ka file-kan. Dashboard-ka Certificates wuxuu furayaa page-kan isagoo adeegsanaya <b>?regen=ID</b>.</div>
</div></section>
<section class="preview"><div class="preview-wrap"><canvas id="certificateCanvas" width="1055" height="1491"></canvas></div><div id="previewStatus" class="preview-status">Loading...</div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="./authentication-letter.js?v=2.0.0"></script>
</body></html>
