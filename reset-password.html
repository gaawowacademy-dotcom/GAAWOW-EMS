
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1E63">

  <title>Reset Password | GAAWOW EMS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07143f, #0B4DA2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 32px 25px;
      border-radius: 16px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo h1 {
      color: #0B1E63;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo p {
      color: #B8860B;
      font-size: 13px;
      margin-top: 7px;
      font-weight: bold;
    }

    .divider {
      height: 3px;
      width: 65px;
      background: #D4AF37;
      margin: 15px auto 22px;
      border-radius: 5px;
    }

    h2 {
      text-align: center;
      color: #0B1E63;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #1e293b;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px 48px 14px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0B4DA2;
      box-shadow: 0 0 0 3px rgba(11,77,162,.1);
    }

    .toggle {
      position: absolute;
      right: 13px;
      top: 14px;
      border: none;
      background: none;
      color: #0B4DA2;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: -12px;
      margin-bottom: 19px;
    }

    .strength {
      height: 5px;
      background: #e2e8f0;
      border-radius: 5px;
      margin-top: 8px;
      overflow: hidden;
    }

    .strength span {
      display: block;
      height: 100%;
      width: 0;
      transition: .2s;
      background: #dc2626;
    }

    button.submit {
      width: 100%;
      border: none;
      background: #0B1E63;
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button.submit:hover {
      background: #0B4DA2;
    }

    button.submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 17px;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.7;
    }

    .footer strong {
      color: #0B1E63;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0B4DA2;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    #resetForm {
      display: none;
    }

    #loading {
      text-align: center;
      padding: 20px 0;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>GAAWOW EMS</h1>
    <p>ILAYSKA AQOONTA IYO XIRFADDA</p>
    <div class="divider"></div>
  </div>

  <h2>Reset Your Password</h2>

  <p class="description">
    Create a new secure password for your
    GAAWOW EMS account.
  </p>

  <div id="message" class="message" role="alert"
       aria-live="polite"></div>

  <div id="loading">
    <p>Verifying your password reset link...</p>
  </div>

  <form id="resetForm">

    <label for="password">New Password</label>

    <div class="input-group">
      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="8"
        autocomplete="new-password"
        required
      >
      <button type="button" class="toggle"
        onclick="togglePassword('password', this)">
        SHOW
      </button>

      <div class="strength">
        <span id="strengthBar"></span>
      </div>
    </div>

    <p class="hint">
      Use at least 8 characters.
    </p>

    <label for="confirmPassword">
      Confirm New Password
    </label>

    <div class="input-group">
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="button" class="toggle"
        onclick="togglePassword('confirmPassword', this)">
        SHOW
      </button>
    </div>

    <button type="submit" class="submit" id="submitBtn">
      Update Password
    </button>

  </form>

  <a class="back"
     href="./login.html">
     ← Back to Login
  </a>

  <div class="footer">
    <strong>GAAWOW ACADEMY</strong><br>
    Education Management & Verification System<br>
    © 2026 All Rights Reserved
  </div>

</div>

<script>
"use strict";

// ==========================================
// GAAWOW EMS - PASSWORD RESET
// Supabase Authentication
// ==========================================

const SUPABASE_URL =
  "https://mytyvqwrxnxpxnxpiicj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2AvWfupkF1b_s0RjIbAi5g_RqLCs145";

const LOGIN_URL = "./login.html";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      flowType: "pkce",
      detectSessionInUrl: true,
      persistSession: true,
      autoRefreshToken: true
    }
  }
);

const form = document.getElementById("resetForm");
const loading = document.getElementById("loading");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

let recoveryAuthorized = false;
let passwordUpdated = false;

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

function togglePassword(id, button) {
  const input = document.getElementById(id);

  if (input.type === "password") {
    input.type = "text";
    button.textContent = "HIDE";
  } else {
    input.type = "password";
    button.textContent = "SHOW";
  }
}

// Password strength indicator
document.getElementById("password")
  .addEventListener("input", function () {

    const value = this.value;
    let score = 0;

    if (value.length >= 8) score++;
    if (/[A-Z]/.test(value)) score++;
    if (/[a-z]/.test(value)) score++;
    if (/[0-9]/.test(value)) score++;
    if (/[^A-Za-z0-9]/.test(value)) score++;

    const bar = document.getElementById("strengthBar");

    bar.style.width = (score * 20) + "%";

    bar.style.background =
      score <= 2 ? "#dc2626" :
      score <= 3 ? "#eab308" : "#16a34a";
  });

function showResetForm() {
  recoveryAuthorized = true;
  loading.style.display = "none";
  form.style.display = "block";
}

function hideResetForm() {
  recoveryAuthorized = false;
  loading.style.display = "none";
  form.style.display = "none";

  showMessage(
    "Your reset link is invalid or expired. Please request a new password reset email.",
    "error"
  );
}

// Listen for Supabase recovery event
supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (event === "PASSWORD_RECOVERY" && session) {
      showResetForm();
      return;
    }

    if (event === "SIGNED_OUT") {
      recoveryAuthorized = false;
    }
  }
);

// Check session after initialization
async function initializePage() {

  try {

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (passwordUpdated) return;

    if (data.session && data.session.user) {
      showResetForm();
    } else {
      hideResetForm();
    }

  } catch (error) {

    hideResetForm();

  }
}

initializePage();

// Update password
form.addEventListener("submit", async function (event) {

  event.preventDefault();

  if (!recoveryAuthorized || passwordUpdated) {
    showMessage(
      "Please request a new password reset link.",
      "error"
    );
    return;
  }

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    showMessage(
      "Password must contain at least 8 characters.",
      "error"
    );
    return;
  }

  if (password !== confirmPassword) {
    showMessage(
      "Passwords do not match. Please try again.",
      "error"
    );
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating Password...";

  try {

    const { data, error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if (error) throw error;

    passwordUpdated = true;
    recoveryAuthorized = false;

    form.style.display = "none";

    showMessage(
      "Your password has been successfully updated. You can now sign in using your new password.",
      "success"
    );

    setTimeout(async () => {

      await supabaseClient.auth.signOut();

      window.location.replace(LOGIN_URL);

    }, 3000);

  } catch (error) {

    showMessage(
      error.message || "Unable to update password. Please try again.",
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Update Password";

  }

});

</script>

</body>
</html>
