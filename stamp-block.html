<div class="official-stamp">

  <div class="stamp-circle gaawow-official-stamp">

    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GAAWOW ACADEMY official institutional seal">
      <defs>
        <radialGradient id="gsBody" cx="35%" cy="28%" r="85%">
          <stop offset="0" stop-color="#FFF4B8"/>
          <stop offset=".28" stop-color="#EBCB5E"/>
          <stop offset=".6" stop-color="#C9A02C"/>
          <stop offset="1" stop-color="#8A6414"/>
        </radialGradient>
        <linearGradient id="gsRim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFF1A8"/>
          <stop offset=".45" stop-color="#C79A25"/>
          <stop offset=".55" stop-color="#8A6414"/>
          <stop offset="1" stop-color="#F3D875"/>
        </linearGradient>
        <linearGradient id="gsBand" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F7E28F"/>
          <stop offset=".5" stop-color="#D9B13D"/>
          <stop offset="1" stop-color="#B58A22"/>
        </linearGradient>
        <linearGradient id="gsShine" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="gsClip"><circle cx="100" cy="100" r="88"/></clipPath>
        <path id="gsTop" d="M 30,100 A 70,70 0 0 1 170,100"/>
        <path id="gsBottom" d="M 16,100 A 84,84 0 0 0 184,100"/>
      </defs>

      <!-- metal body and serrated edge -->
      <circle cx="100" cy="100" r="98" fill="url(#gsBody)" stroke="#7A5A12" stroke-width=".8"/>
      <circle cx="100" cy="100" r="95.5" fill="none" stroke="#8A6414" stroke-width="3" stroke-dasharray="1.6 1.6" opacity=".55"/>
      <circle cx="100" cy="100" r="91" fill="none" stroke="url(#gsRim)" stroke-width="3"/>

      <!-- lettering band -->
      <circle cx="100" cy="100" r="88" fill="url(#gsBand)"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#8A6414" stroke-width=".5" opacity=".7"/>
      <circle cx="100" cy="100" r="63" fill="none" stroke="#8A6414" stroke-width=".6"/>
      <circle cx="100" cy="100" r="61.2" fill="none" stroke="#FFF1A8" stroke-width=".8"/>

      <!-- soft light reflection -->
      <g clip-path="url(#gsClip)">
        <ellipse cx="72" cy="52" rx="70" ry="34" transform="rotate(-28 72 52)" fill="url(#gsShine)" opacity=".5"/>
      </g>

      <!-- embossed lettering (light offset copy + dark text) -->
      <g font-family="Georgia, 'Times New Roman', serif" font-weight="700">
        <text transform="translate(.6 .6)" fill="#FFF3B0" opacity=".85" font-size="14" letter-spacing="2.2" text-anchor="middle"><textPath href="#gsTop" startOffset="50%">GAAWOW ACADEMY</textPath></text>
        <text fill="#5C4307" font-size="14" letter-spacing="2.2" text-anchor="middle"><textPath href="#gsTop" startOffset="50%">GAAWOW ACADEMY</textPath></text>

        <text transform="translate(.5 .5)" fill="#FFF3B0" opacity=".85" font-size="8" letter-spacing="1.3" text-anchor="middle"><textPath href="#gsBottom" startOffset="50%">ILAYSKA AQOONTA IYO XIRFADDA</textPath></text>
        <text fill="#5C4307" font-size="8" letter-spacing="1.3" text-anchor="middle"><textPath href="#gsBottom" startOffset="50%">ILAYSKA AQOONTA IYO XIRFADDA</textPath></text>

        <text x="25" y="103" fill="#5C4307" font-size="10" text-anchor="middle">&#9733;</text>
        <text x="175" y="103" fill="#5C4307" font-size="10" text-anchor="middle">&#9733;</text>
      </g>

      <!-- centre: the official logo, unchanged -->
      <circle cx="100" cy="100" r="59" fill="#FFFDF4" stroke="#A8801E" stroke-width="1.2"/>
      <circle cx="100" cy="100" r="58" fill="none" stroke="#78550C" stroke-opacity=".25" stroke-width="2"/>
      <image href="logo.png" x="47" y="47" width="106" height="106" preserveAspectRatio="xMidYMid meet"/>
    </svg>

  </div>

</div>
