<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="theme-color" content="#0B1E63">

  <meta
    name="description"
    content="GAAWOW EMS Secure Login Portal"
  >

  <title>GAAWOW EMS | Secure Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top right,
          rgba(212, 175, 55, 0.22),
          transparent 32%
        ),
        linear-gradient(135deg, #07164a, #0B4DA2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 34px 28px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .logo {
      display: block;
      width: 155px;
      max-width: 72%;
      height: auto;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .brand {
      color: #0B1E63;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .gold-line {
      width: 72px;
      height: 4px;
      border-radius: 20px;
      background: #D4AF37;
      margin: 12px auto;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .form-heading {
      color: #0B1E63;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .form-description {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #1F2937;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 1px solid #d7dce5;
      border-radius: 11px;
      padding: 14px 15px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    input:focus {
      border-color: #0B4DA2;
      box-shadow: 0 0 0 3px rgba(11, 77, 162, 0.12);
    }

    input:disabled {
      background: #f1f5f9;
      cursor: not-allowed;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 78px;
    }

    .toggle-password {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      min-height: 30px;
      margin: 0;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: #eef2f8;
      color: #0B1E63;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn {
      display: block;
      width: 100%;
      min-height: 49px;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      margin-top: 5px;
      background: linear-gradient(135deg, #0B4DA2, #0B1E63);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      display: block;
      min-height: 24px;
      margin-top: 17px;
      padding: 0;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-align: left;
    }

    #message.error,
    #message.success {
      padding: 12px;
    }

    #message.error {
      color: #842029;
      background: #f8d7da;
      border: 1px solid #f5c2c7;
    }

    #message.success {
      color: #155724;
      background: #d4edda;
      border: 1px solid #c3e6cb;
    }

    #message.info {
      color: #64748b;
      background: transparent;
      border: 0;
    }

    .security-note {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
    }

    .footer strong {
      color: #0B1E63;
    }

    .security {
      margin-top: 7px;
      color: #94a3b8;
    }

    /* Teacher Login is disabled.
       Keep its HTML IDs available for compatibility. */
    .login-switch,
    #teacherLoginSection,
    #teacherTab {
      display: none !important;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 13px;
      }

      .card {
        padding: 29px 20px 24px;
        border-radius: 20px;
      }

      .brand {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="card" aria-labelledby="brand-title">

      <!-- OFFICIAL GAAWOW ACADEMY LOGO -->
      <img
        class="logo"
        src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
        alt="GAAWOW Academy Logo"
        width="155"
      >

      <div class="brand" id="brand-title">
        GAAWOW EMS
      </div>

      <div class="gold-line" aria-hidden="true"></div>

      <p class="subtitle">
        Education Management &amp; Verification System
      </p>

      <!-- SYSTEM LOGIN -->
      <section id="systemLoginSection">

        <h2 class="form-heading">
          System Login
        </h2>

        <p class="form-description">
          Authorized administrators and system users
        </p>

        <form id="loginForm" autocomplete="on">

          <div class="form-group">
            <label for="email">
              Email Address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="Enter your email"
              maxlength="254"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">
              Password
            </label>

            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              >

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <button
            id="loginButton"
            class="submit-btn"
            type="submit"
          >
            LOGIN
          </button>

        </form>
      </section>

      <!--
        ACCESSIBLE STATUS MESSAGE
        app.js can use #message to show login errors.
      -->
      <div
        id="message"
        class="info"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <!-- FOOTER -->
      <footer class="footer">
        <strong>GAAWOW ACADEMY</strong>
        <br>
        Ilayska Aqoonta iyo Xirfadda

        <div class="security">
          Secure access powered by Supabase
        </div>
      </footer>

    </section>
  </main>

  <!-- =====================================================
       SUPABASE LIBRARY
       Must load before app.js.
       ===================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- =====================================================
       LOGIN CONTROLLER
       ===================================================== -->
  <script>
    (function () {
      "use strict";

      var messageBox = document.getElementById("message");

      function showScriptError(text) {
        if (!messageBox) return;

        messageBox.textContent = text;
        messageBox.className = "error";
      }

      window.addEventListener("error", function (event) {
        console.error(
          "GAAWOW EMS JavaScript error:",
          event.message,
          event.filename,
          event.lineno
        );

        if (
          event.target &&
          event.target.tagName === "SCRIPT"
        ) {
          showScriptError(
            "JavaScript file lama soo dejin. Hubi internet-ka iyo faylasha app.js."
          );
          return;
        }

        if (event.message) {
          showScriptError(
            "JavaScript error: " + event.message
          );
        }
      });

      window.addEventListener(
        "unhandledrejection",
        function (event) {
          console.error(
            "GAAWOW EMS rejected promise:",
            event.reason
          );

          var reason = event.reason;

          if (
            reason &&
            reason.message
          ) {
            showScriptError(
              "System error: " + reason.message
            );
          }
        }
      );

      var toggleButton =
        document.getElementById("togglePassword");

      var passwordInput =
        document.getElementById("password");

      if (toggleButton && passwordInput) {
        toggleButton.addEventListener("click", function () {
          var show = passwordInput.type === "password";

          passwordInput.type = show
            ? "text"
            : "password";

          toggleButton.textContent = show
            ? "Hide"
            : "Show";

          toggleButton.setAttribute(
            "aria-pressed",
            String(show)
          );

          toggleButton.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password"
          );
        });
      }

      /*
       * Confirm the Supabase library is loaded.
       * Do not attempt authentication in this script.
       */
      window.addEventListener("load", function () {
        if (
          !window.supabase ||
          typeof window.supabase.createClient !== "function"
        ) {
          showScriptError(
            "Supabase library lama soo dejin. Hubi internet-ka, CDN-ga iyo script order-ka."
          );

          console.error(
            "Supabase JS library unavailable."
          );

          return;
        }

        console.info(
          "GAAWOW EMS: Supabase JavaScript library loaded."
        );
      });
    })();
  </script>

  <!--
    app.js must be in the same directory as index.html.
    Keep only one login controller.
  -->
  <script src="./app.js"></script>

</body>
</html>
