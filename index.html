<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GAAWOW EMS - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #F5F7FA;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1F2937;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
      text-align: center;
      border-top: 5px solid #D4AF37;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      color: #0B4DA2;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #D4AF37;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .system-name {
      color: #6B7280;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #1F2937;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #D1D5DB;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #0B4DA2;
      box-shadow: 0 0 0 3px rgba(11, 77, 162, 0.10);
    }

    #loginButton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0B4DA2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    #loginButton:hover {
      background: #083B7D;
    }

    #loginButton:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #6B7280;
    }

    .footer strong {
      color: #0B4DA2;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <!-- GAAWOW ACADEMY LOGO -->
      <img
        class="logo"
        src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
        alt="Gaawow Academy Logo"
      >

      <h1>GAAWOW ACADEMY</h1>

      <div class="subtitle">
        Ilayska Aqoonta iyo Xirfadda
      </div>

      <div class="system-name">
        Education Management System
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginButton">
          LOGIN
        </button>

      </form>

      <!-- LOGIN MESSAGE -->
      <div id="message"></div>

      <div class="footer">
        © 2026 <strong>Gaawow Academy</strong><br>
        Bur Hakaba Bay, Somalia
      </div>

    </div>

  </div>


  <!-- SUPABASE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- GAAWOW EMS APPLICATION -->
  <script src="app.js"></script>

</body>
</html>
