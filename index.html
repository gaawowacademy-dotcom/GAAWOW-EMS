<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1E63">
  <title>GAAWOW EMS - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.22), transparent 32%),
        linear-gradient(135deg, #07164a, #0B4DA2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 24px;
      padding: 34px 28px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.28);
      text-align: center;
    }

    .logo {
      display: block;
      width: 155px;
      max-width: 72%;
      height: auto;
      margin: 0 auto 18px;
    }

    .brand {
      color: #0B1E63;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .gold-line {
      width: 72px;
      height: 4px;
      border-radius: 20px;
      background: #D4AF37;
      margin: 12px auto;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #1F2937;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      border: 1px solid #d7dce5;
      border-radius: 11px;
      padding: 14px 15px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #0B4DA2;
      box-shadow: 0 0 0 3px rgba(11,77,162,.12);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      margin-top: 5px;
      background: linear-gradient(135deg, #0B4DA2, #0B1E63);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.55;
    }

    .footer {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer strong {
      color: #0B1E63;
    }

    .security {
      margin-top: 8px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 21px 24px;
      }

      .brand {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <img
        class="logo"
        src="https://i.ibb.co/4ZCRpm30/gaawow-logo.png"
        alt="GAAWOW Academy Logo"
      >

      <div class="brand">GAAWOW EMS</div>
      <div class="gold-line"></div>
      <p class="subtitle">Education Management &amp; Verification System</p>

      <form id="loginForm" autocomplete="on">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button id="loginButton" type="submit">LOGIN</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="footer">
        <strong>GAAWOW ACADEMY</strong><br>
        Ilayska Aqoonta iyo Xirfadda
        <div class="security">Secure access powered by Supabase</div>
      </div>

    </section>
  </main>

  <!-- Supabase JavaScript library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- GAAWOW EMS application -->
  <script src="app.js"></script>
</body>
</html>
